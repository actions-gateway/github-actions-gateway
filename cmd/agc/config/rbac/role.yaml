  - actions-gateway.github.com
  resources:
  - runnergroups/finalizers
  verbs:
  - update
- apiGroups:
  - actions-gateway.github.com
  resources:
  - runnergroups/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - events.k8s.io
  resources:
