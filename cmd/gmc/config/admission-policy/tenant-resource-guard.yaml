# ValidatingAdmissionPolicy that confines the GMC ServiceAccount's cluster-wide
# write grants for tenant provisioning resources to namespaces an administrator
# has marked as managed tenants (Queue Q121 / Q122).
#
# The GMC ClusterRole grants create/update/delete on Deployments, Services,
# ServiceAccounts, NetworkPolicies, RoleBindings, HPAs, PodDisruptionBudgets, and
# create/update on Secrets — all CLUSTER-WIDE, because RBAC cannot
# express "only namespaces that carry label X". A compromised GMC could otherwise
# create a Deployment or RoleBinding in kube-system, or write a Secret into any
# namespace. This policy is the gate RBAC cannot be: it denies the GMC SA any
# create/update/delete of these kinds unless the *target namespace* already carries
# actions-gateway.com/tenant=managed — the same marker the namespace-psa-guard
# policy keys on, applied by a trusted admin at onboarding and never by the GMC.
#
# It also restricts the GMC's ClusterRoleBinding writes to the
# agc-clusterrunnertemplate-reader role. The GMC holds `bind` on roles that grant
# Secret reads, and a ClusterRoleBinding to one of them would grant those reads in
# every namespace (Q1188).
#
# One write outside a tenant namespace is admitted: the GMC deleting its own
# gmc-tenant-secret-reader RoleBinding, so a namespace that stops being a tenant
# also stops granting the GMC Secret reads (Q1271). The match is narrow enough
# that the delete can only remove the GMC's own access.
#
# Scope limits this policy deliberately does NOT cover:
#   - Secret READS (get/list/watch). Admission only runs on create/update/delete, so
#     no ValidatingAdmissionPolicy can confine a read. RBAC confines them instead: the
#     GMC reads Secrets only through per-namespace RoleBindings that this policy
#     restricts to tenant namespaces (docs/design/05-security.md §5.1).
#
# Kept OUT of the prefixed config/default kustomize tree (applied separately by
# `make deploy`, like namespace-psa-guard.yaml) so its cluster-scoped names stay
# stable and the binding->policy reference is not rewritten by namePrefix.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: gmc-tenant-resource-guard
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["secrets", "serviceaccounts", "services"]
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["deployments"]
      - apiGroups: ["networking.k8s.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["networkpolicies"]
      - apiGroups: ["autoscaling"]
        apiVersions: ["v2"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["horizontalpodautoscalers"]
      - apiGroups: ["policy"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["poddisruptionbudgets"]
      - apiGroups: ["rbac.authorization.k8s.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["rolebindings", "roles"]
      # ClusterRoleBindings are cluster-scoped, so the namespace marker cannot
      # confine them; the roleRef rule below does instead.
      - apiGroups: ["rbac.authorization.k8s.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["clusterrolebindings"]
      - apiGroups: ["actions-gateway.com"]
        apiVersions: ["v2"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["runnersets"]
  matchConditions:
    # Only the GMC ServiceAccount is subject to this policy; every other principal
    # is admitted unchanged. This is the default install identity — if the GMC is
    # installed under a different namespace or name, update this single string
    # (shared limitation with namespace-psa-guard; parameterization is Q127).
    - name: only-gmc-service-account
      expression: "request.userInfo.username == 'system:serviceaccount:gmc-system:gmc-controller-manager'"
  variables:
    # namespaceObject is the Namespace the request's resource lives in. It is always
    # populated for these namespaced kinds (null only for cluster-scoped resources),
    # and reflects the live namespace labels — which a compromised GMC cannot forge,
    # since the GMC holds no create on namespaces and the marker key is immutable to
    # it under namespace-psa-guard.
    - name: nsLabels
      expression: "(has(namespaceObject.metadata) && has(namespaceObject.metadata.labels)) ? namespaceObject.metadata.labels : {}"
    # Tenant scope: only the actions-gateway.com/tenant=managed marker counts.
    - name: isManagedTenant
      expression: >-
        'actions-gateway.com/tenant' in variables.nsLabels && variables.nsLabels['actions-gateway.com/tenant'] == 'managed'
    # The GMC holds `bind` on agc-tenant-role, gmc-tenant-secret-reader and
    # agc-clusterrunnertemplate-reader, and RBAC lets a `bind` grant back a
    # ClusterRoleBinding as well as a RoleBinding. A ClusterRoleBinding to either of
    # the first two would grant Secret reads in every namespace, so the only
    # ClusterRoleBinding the GMC may write is the per-gateway one to the third.
    - name: isClusterRoleBinding
      expression: "request.resource.resource == 'clusterrolebindings'"
    - name: bindingRoleRef
      expression: "request.operation == 'DELETE' ? oldObject.roleRef.name : object.roleRef.name"
    # The GMC's own reader binding, matched on the stored object a DELETE carries:
    # a RoleBinding (never a Role or ClusterRoleBinding) named
    # gmc-tenant-secret-reader, bound to the ClusterRole of that name, whose only
    # subject is the requester. matchConditions has already pinned the requester to
    # the GMC ServiceAccount, so the subject check reuses that identity.
    # The subject's `namespace` is read unescaped although CEL reserves the word;
    # the delete is admitted on envtest 1.30.3 and 1.35.0 (Q1271).
    - name: isOwnReaderBindingDelete
      expression: >-
        request.operation == 'DELETE' &&
        request.resource.resource == 'rolebindings' &&
        oldObject.metadata.name == 'gmc-tenant-secret-reader' &&
        oldObject.roleRef.kind == 'ClusterRole' &&
        oldObject.roleRef.name == 'gmc-tenant-secret-reader' &&
        has(oldObject.subjects) && size(oldObject.subjects) == 1 &&
        oldObject.subjects[0].kind == 'ServiceAccount' &&
        'system:serviceaccount:' + oldObject.subjects[0].namespace + ':' + oldObject.subjects[0].name == request.userInfo.username
  validations:
    - expression: "!variables.isClusterRoleBinding || variables.bindingRoleRef == 'agc-clusterrunnertemplate-reader'"
      messageExpression: "'the GMC service account may only write ClusterRoleBindings to agc-clusterrunnertemplate-reader; this one references ' + variables.bindingRoleRef"
      reason: Forbidden
    - expression: "variables.isClusterRoleBinding || variables.isManagedTenant || variables.isOwnReaderBindingDelete"
      messageExpression: "'the GMC service account may only write tenant resources in namespaces labeled actions-gateway.com/tenant=managed; namespace ' + request.namespace + ' is not a managed tenant namespace'"
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: gmc-tenant-resource-guard-binding
spec:
  policyName: gmc-tenant-resource-guard
  # Deny is the secure default. For an in-place upgrade of a cluster whose existing
  # tenant namespaces are not yet labeled, temporarily set this to [Audit] (or label
  # the namespaces first) — see docs/operations/upgrade.md.
  validationActions: [Deny]
