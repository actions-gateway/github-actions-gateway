# ValidatingAdmissionPolicy backstop for the platform PriorityClass allowlist
# (Q289 / Appendix G §G.7).
#
# The allowlist's primary enforcement is the GMC validating webhooks on the
# tenant-facing CRs (ActionsGateway, RunnerTemplate, RunnerSet). RunnerGroup CRs
# have no webhook of their own: they are normally authored only by the GMC (from an
# already-validated ActionsGateway), so a cluster operator who grants a tenant
# direct `runnergroups` write RBAC bypasses the allowlist entirely — the tenant
# could name system-cluster-critical in priorityTiers or podTemplate.spec and have
# the AGC stamp it onto worker pods, preempting other tenants cluster-wide.
#
# This policy is that gap's gate, and defense-in-depth if the GMC webhook is ever
# bypassed or disabled. It rejects any runnergroups write whose
# priorityTiers[].priorityClassName or podTemplate.spec.priorityClassName is not in
# the allowlist supplied via the paramKind PriorityClassAllowlist below. Unlike a
# webhook, a VAP also re-validates on EVERY write to an existing object, narrowing
# the stored-object residual (objects admitted before the gate shipped).
#
# The v2 kinds (Q323): runnersets carry priorityTiers and runnertemplates carry
# podTemplate.spec.priorityClassName — both tenant-authored, both gated by
# failurePolicy=fail GMC webhooks. For them this policy is the same
# defense-in-depth backstop the v1 rule provides: webhook-outage/bypass coverage
# plus stored-object re-validation. The has() guards below make the shared
# variables total across all three resources (runnersets have no podTemplate;
# runnertemplates have no priorityTiers). ClusterRunnerTemplate is deliberately
# exempt, matching its webhook exemptions: it is cluster-scoped and
# platform-authored, and its writers can create PriorityClasses anyway.
#
# The param PriorityClassAllowlist is the policy's single allowlist source — the
# apiserver cannot read the GMC's --allowed-priority-classes flag. Keep it a
# superset of the flag (the Helm chart renders both from the same values), or
# GMC-authored RunnerGroups naming flag-only classes will be denied here.
# parameterNotFoundAction: Deny fails closed if the object is missing — and
# because the apiserver resolves binding params BEFORE any per-object filtering,
# a missing param denies EVERY matched write (runnergroups, runnersets, and
# runnertemplates alike), not just class-naming ones. The object ships with this
# policy (below) and with the chart, so that state is an explicit deletion;
# recreate it to recover. Fail-open (Allow) is not an option: deleting one object
# would silently disable the guard.
#
# Why a CRD paramKind and not a ConfigMap (Q492): a CORE-type paramKind is
# permanently broken for the rest of a kube-apiserver process the moment the set of
# bindings naming it goes empty for one refresh tick, which `helm uninstall` does
# (Q444). The apiserver allocates a fresh dynamic informer per context for a CRD
# paramKind, so this kind survives the same transition; the contrast is measured by
# scripts/e2e/vap-param-informer-check.sh.
#
# The empty-list object shipped below is the secure default: no named class is
# permitted until the platform admin lists it.
#
# This is the canonical, fixed-name copy (gmc-system) the GMC integration suite
# loads to exercise the real deployed CEL; the Helm chart renders the
# parameterized install copy (templates/priorityclass-allowlist-guard.yaml) with
# the param object generated from .Values.allowedPriorityClasses.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: gag-priorityclass-allowlist-guard
spec:
  failurePolicy: Fail
  paramKind:
    apiVersion: actions-gateway.com/v2beta1
    kind: PriorityClassAllowlist
  matchConstraints:
    resourceRules:
      - apiGroups: ["actions-gateway.github.com"]
        apiVersions: ["v1alpha1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["runnergroups"]
      # Q323: the v2 carriers of the same two PriorityClass routes. Both versions
      # are listed explicitly (they share identical field paths), so the rule does
      # not depend on matchPolicy version equivalence.
      - apiGroups: ["actions-gateway.com"]
        apiVersions: ["v2alpha1", "v2beta1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["runnersets", "runnertemplates"]
  matchConditions:
    # Deletion-only updates are exempt (Q518): once the apiserver has set
    # deletionTimestamp (set only on delete, immutable, never client-settable),
    # an update whose spec is identical to the stored spec — finalizer removal
    # above all — cannot change which classes the object names, so re-validating
    # it widens nothing. Denying it wedges teardown after the allowlist is
    # narrowed: the AGC's finalizer-removal write is refused forever and the
    # tenant namespace hangs in Terminating (Q499). A spec CHANGE on a deleting
    # object stays validated, so even a deleting object can never acquire a new
    # class name. The GMC webhooks carry the same exemption
    # (validation.DeletionOnlyUpdate), so the two admission layers agree.
    - name: exclude-deletion-only-updates
      expression: >-
        oldObject == null || !has(object.metadata.deletionTimestamp)
        || !has(object.spec) || !has(oldObject.spec)
        || object.spec != oldObject.spec
  variables:
    # The allowlist, read straight off the param CR. The CRD schema constrains each
    # entry to a DNS 1123 subdomain and the list to a set, so there is no string to
    # split and no malformed-value case to defend against — the apiserver rejects
    # those at write time. An absent or empty list yields an empty allowlist — deny
    # every named class, the secure default.
    - name: allowed
      expression: >-
        has(params.spec) && has(params.spec.allowedPriorityClasses)
        ? params.spec.allowedPriorityClasses : []
    - name: tierClasses
      expression: "has(object.spec.priorityTiers) ? object.spec.priorityTiers.map(t, t.priorityClassName) : []"
    - name: podClass
      expression: >-
        (has(object.spec.podTemplate) && has(object.spec.podTemplate.spec)
         && has(object.spec.podTemplate.spec.priorityClassName))
        ? object.spec.podTemplate.spec.priorityClassName : ''
  validations:
    - expression: "variables.tierClasses.all(c, c in variables.allowed)"
      messageExpression: >-
        'priorityTiers priorityClassName ' + variables.tierClasses.filter(c, !(c in variables.allowed)).join(', ')
        + ' is not in the platform PriorityClassAllowlist; a PriorityClass sets cluster-wide scheduling preemption order, so the platform admin must pre-create it and add it to the allowlist'
      reason: Forbidden
    - expression: "variables.podClass == '' || variables.podClass in variables.allowed"
      messageExpression: >-
        'podTemplate.spec.priorityClassName ' + variables.podClass
        + ' is not in the platform PriorityClassAllowlist; a PriorityClass sets cluster-wide scheduling preemption order, so the platform admin must pre-create it and add it to the allowlist'
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: gag-priorityclass-allowlist-guard-binding
spec:
  policyName: gag-priorityclass-allowlist-guard
  # Deny is the secure default; a missing param object denies every matched
  # write until it is recreated (see the header comment).
  validationActions: [Deny]
  paramRef:
    # Cluster-scoped param: name only, no namespace.
    name: gag-priorityclass-allowlist
    parameterNotFoundAction: Deny
---
# The default (empty) allowlist parameter: no named PriorityClass is permitted
# until the platform admin lists it here. This is the dev/`make deploy` copy; the
# Helm chart renders the same object from .Values.allowedPriorityClasses so the
# webhook flag and this policy stay in lockstep.
apiVersion: actions-gateway.com/v2beta1
kind: PriorityClassAllowlist
metadata:
  name: gag-priorityclass-allowlist
spec:
  allowedPriorityClasses: []
