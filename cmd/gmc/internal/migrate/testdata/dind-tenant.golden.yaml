# Namespace metadata patch (applied to the existing namespace, additively).
# Equivalent kubectl commands for namespace "gag-dogfood-e2e":
#   kubectl label   namespace gag-dogfood-e2e actions-gateway.com/privileged-profile=allowed --overwrite
#   kubectl label   namespace gag-dogfood-e2e actions-gateway.com/security-profile=privileged --overwrite
#   kubectl label   namespace gag-dogfood-e2e actions-gateway.com/tenant=managed --overwrite
# ----------------------------------------------------------------------
# Warnings:
#   - RunnerGroup "ci-e2e" has a privileged worker pod shape, so it migrates to the CLUSTER-SCOPED ClusterRunnerTemplate "crt-gag-dogfood-e2e-0e37afd96d50" rather than a namespaced RunnerTemplate (a namespaced template may not declare privileged containers). Applying it requires cluster-scoped create permission, and deleting namespace "gag-dogfood-e2e" will NOT remove it — tear it down explicitly, or find it again with `kubectl get clusterrunnertemplates -l actions-gateway.com/migrated-from-namespace=gag-dogfood-e2e`
#   - relocating securityProfile "privileged" onto namespace "gag-dogfood-e2e" reads as a downgrade from "baseline" (an absent actions-gateway.com/security-profile label defaults to baseline, and "privileged" is less restrictive), so the namespace-security-profile-guard policy will REJECT the namespace patch. This does not weaken the tenant — its Pod Security Admission level is already "privileged" under v1 — but the opt-in is the operator's to give, not this tool's. Before --apply, run: kubectl annotate namespace gag-dogfood-e2e actions-gateway.com/allow-profile-downgrade=allowed   (remove it once the migration is verified)
