# Minimal Prometheus-Operator (monitoring.coreos.com/v1) ServiceMonitor CRD stub for
# envtest (Q324).
#
# NOT the upstream ServiceMonitor schema — just enough structure for the test apiserver
# to accept the ServiceMonitor objects the GMC emits when tenant ServiceMonitors are
# enabled, so the integration suite can assert emission. spec is
# preserve-unknown-fields, so the GMC's real (un-validated here) spec round-trips. Real
# clusters install the Prometheus Operator's own CRD.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: servicemonitors.monitoring.coreos.com
spec:
  group: monitoring.coreos.com
  names:
    kind: ServiceMonitor
    listKind: ServiceMonitorList
    plural: servicemonitors
    singular: servicemonitor
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              x-kubernetes-preserve-unknown-fields: true
