# Minimal vertical-pod-autoscaler (autoscaling.k8s.io/v1) VerticalPodAutoscaler CRD
# stub for envtest (Q360).
#
# NOT the upstream VerticalPodAutoscaler schema — just enough structure for the test
# apiserver to accept the objects the GMC stamps for a gateway that opted into
# spec.agcAutoscaling, so the integration suite can assert emission and pruning. spec is
# preserve-unknown-fields, so the GMC's real (un-validated here) spec round-trips. Real
# clusters install the Kubernetes autoscaler project's own CRD.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: verticalpodautoscalers.autoscaling.k8s.io
  annotations:
    # *.k8s.io is a protected group: the apiserver rejects a CRD in it without an
    # api-approved annotation (KEP-1111). This is the value the upstream
    # vertical-pod-autoscaler CRD carries.
    api-approved.kubernetes.io: "https://github.com/kubernetes/kubernetes/pull/63797"
spec:
  group: autoscaling.k8s.io
  names:
    kind: VerticalPodAutoscaler
    listKind: VerticalPodAutoscalerList
    plural: verticalpodautoscalers
    singular: verticalpodautoscaler
    shortNames:
      - vpa
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              x-kubernetes-preserve-unknown-fields: true
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
