# Minimal GKE FQDNNetworkPolicy CRD stub for envtest (Q245).
#
# NOT the upstream GKE Dataplane V2 schema — just enough structure for the test
# apiserver to accept the FQDNNetworkPolicy objects the GMC emits in the gke backend so
# the integration suite can assert emission. spec is preserve-unknown-fields, so the
# GMC's real (un-validated here) spec round-trips. Real GKE clusters enforce this kind
# in-kernel via --enable-fqdn-network-policy; there is no self-deployed controller.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: fqdnnetworkpolicies.networking.gke.io
spec:
  group: networking.gke.io
  names:
    kind: FQDNNetworkPolicy
    listKind: FQDNNetworkPolicyList
    plural: fqdnnetworkpolicies
    singular: fqdnnetworkpolicy
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              x-kubernetes-preserve-unknown-fields: true
