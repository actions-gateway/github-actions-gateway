version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/api"
    schedule:
      interval: "weekly"
    groups:
      go-deps:
        patterns: ["*"]

  - package-ecosystem: "gomod"
    directory: "/broker"
    schedule:
      interval: "weekly"
    groups:
      go-deps:
        patterns: ["*"]

  - package-ecosystem: "gomod"
    directory: "/githubapp"
    schedule:
      interval: "weekly"
    groups:
      go-deps:
        patterns: ["*"]

  - package-ecosystem: "gomod"
    directory: "/cmd/agc"
    schedule:
      interval: "weekly"
    groups:
      go-deps:
        patterns: ["*"]

  - package-ecosystem: "gomod"
    directory: "/cmd/gmc"
    schedule:
      interval: "weekly"
    groups:
      go-deps:
        patterns: ["*"]

  - package-ecosystem: "gomod"
    directory: "/cmd/proxy"
    schedule:
      interval: "weekly"
    groups:
      go-deps:
        patterns: ["*"]

  - package-ecosystem: "gomod"
    directory: "/cmd/worker"
    schedule:
      interval: "weekly"
    groups:
      go-deps:
        patterns: ["*"]

  - package-ecosystem: "gomod"
    directory: "/cmd/probe"
    schedule:
      interval: "weekly"
    groups:
      go-deps:
        patterns: ["*"]

  - package-ecosystem: "gomod"
    directory: "/tools"
    schedule:
      interval: "weekly"
    groups:
      go-deps:
        patterns: ["*"]

  - package-ecosystem: "gomod"
    directory: "/test/fakegithub"
    schedule:
      interval: "weekly"
    groups:
      go-deps:
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]

  # Python pins: the docs toolchain (requirements-docs.txt), the render-overflow
  # browser check (requirements-docs-check.txt), and claude-usage/requirements.txt.
  # One "/" entry covers all three: Dependabot reads every *requirements*.txt at
  # the directory and one level of subdirectory below it. mkdocs majors are
  # ignored because Material 9.x requires mkdocs < 2.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python:
        patterns: ["*"]
    ignore:
      - dependency-name: "mkdocs"
        update-types: ["version-update:semver-major"]

  # Track base-image (FROM) updates for every Dockerfile so the digest pins —
  # golang builder, distroless runtime, and the upstream actions-runner that the
  # worker image inherits its CVEs from — get automated bump PRs. The worker
  # trivy leg is report-only precisely because these are upstream; this is the
  # channel that keeps them current (Q70). It is also what keeps the worker
  # inside GitHub's 30-day window, past which a runner stays connected and is
  # never queued a job. Every product image builds from the root
  # Dockerfile; the dogfood runner pins the same actions-runner base.
  - package-ecosystem: "docker"
    directories:
      - "/"
      - "/scripts/dogfood/runner"
    schedule:
      interval: "weekly"
    groups:
      docker-base:
        patterns: ["*"]
