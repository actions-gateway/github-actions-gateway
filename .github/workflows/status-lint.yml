# Named for the file it used to lint. docs/STATUS.md is gone (Q889) and the
# backlog is docs/queue/, but this workflow's `status-lint-gate` job is a
# required check in the branch ruleset: renaming it would leave the required
# context reporting nothing and wedge the merge queue on every PR. The rename
# is a repo-settings change, not a file change, so the name stays until both
# move together.
name: status-lint
on:
  # No pull_request path filter: this workflow must trigger on EVERY PR so its
  # `gate` job always reports its required-status check. A workflow skipped by a
  # top-level path filter leaves its required check Pending, which blocks the
  # merge forever. Fine-grained skipping moved inside to the `changes` job below.
  # See docs/development/testing.md#path-gated-workflows-verify-the-heavy-gates-actually-ran.
  pull_request:
  # Merge queue: also run on the queue's candidate merge commit so the gate
  # reports its required check there — an unreporting required check wedges
  # the queue. paths-filter diffs merge_group events via git against the
  # event's base/head, so non-matching queue entries stay cheap.
  merge_group:
  push:
    branches: [main]
    paths:
      - 'docs/roadmap.md'
      - 'docs/features.md'
      - 'scripts/docs/check-roadmap.sh'
      - 'scripts/docs/check-queue-rules.py'
      - 'scripts/docs/check-queue-claims.sh'
      - 'scripts/docs/queue.py'
      - 'docs/queue/**'
      # The roadmap gate reads its rows through the shared parse layer in
      # devtools/ (Q613), so a change there changes this gate's verdict.
      - 'devtools/**'
      - '.github/workflows/status-lint.yml'

# Cancel superseded runs of this workflow on the same PR; pushes to main are
# never cancelled (each is a distinct post-merge gate). Keyed on github.ref —
# for a PR that is the unique refs/pull/<n>/merge.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Fine-grained path gate. The workflow now triggers on every PR (so `gate` can
  # be a required check), so classify the diff here and skip lint-status when
  # nothing it covers changed. On push to main the job always runs.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      status: ${{ steps.filter.outcome == 'success' && steps.filter.outputs.status || 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        # paths-filter resolves the changed-file list through ONE un-retried
        # GitHub API call (@actions/github Octokit carries no retry plugin), so a
        # single transient 5xx fails this job and, with it, the gate. Survive it:
        # the job outputs below fail OPEN, running the gated jobs rather than
        # skipping them when the diff could not be classified (Q363).
        continue-on-error: true
        with:
          filters: |
            status:
              - 'docs/roadmap.md'
              - 'docs/features.md'
              - 'scripts/docs/check-roadmap.sh'
              - 'scripts/docs/check-queue-rules.py'
              - 'scripts/docs/check-queue-claims.sh'
              - 'scripts/docs/queue.py'
              - 'docs/queue/**'
              - 'devtools/**'
              - '.github/workflows/status-lint.yml'
      # A JS action reports failure only as an ::error:: annotation, so a rerun
      # that replaces the check run erases it — leaving a log that simply stops
      # after `Invoking listFiles` with no error anywhere (Q363). Say it plainly.
      - name: warn when change detection failed
        if: steps.filter.outcome == 'failure'
        run: echo "::warning::paths-filter could not classify the diff; assuming every filter matched so the gated jobs run"

  lint-status:
    needs: [changes]
    if: needs.changes.outputs.status == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    # 5, not 2: the roadmap gate builds devtools/docs/roadmapcheck, and a cold
    # module build has to fit inside the budget alongside the store checks.
    timeout-minutes: 5
    steps:
      # fetch-depth: 0 for the store rules below — rules 8, 9 and 12 are
      # functions of what the branch changed, so they read the merge base,
      # which a shallow checkout does not carry.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # The roadmap gate is a Go program. Pinning the toolchain to go.work keeps
      # it off whatever the runner image happens to default to, which is the
      # version that decides whether the build downloads a second one.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
      # Roadmap/backlog coherence (make roadmap-check). It lives here rather
      # than in unit-test.yml because that workflow path-ignores docs, and the
      # drift this catches arrives on docs-only PRs: deleting a shipped item
      # without graduating the roadmap bullet that names it.
      - name: check roadmap against the backlog
        run: scripts/docs/check-roadmap.sh

      - name: lint the backlog store format
        # The store's own rules, from the vendored queue.py (Q889). It replaces
        # what lint-backlog enforced on the retired table.
        run: scripts/docs/lint-queue.sh

      - name: check the backlog store rules
        # Rules 8, 9 and 11 (Q889): a flake item may not vanish, a plan's
        # last item obliges its index row, the label vocabulary is closed.
        #
        # Runs the script, like every other step in this job. It has to live in
        # THIS job rather than status-lint-gate: that one is the aggregate
        # required-status job and has no actions/checkout, so a step there sees
        # no repository at all. Placed there first, it failed twice for one
        # cause wearing two faces, 'No rule to make target' for the make form
        # and exit 127 for the script.
        run: scripts/docs/check-queue-rules.sh

      - name: check the backlog store id claims
        # Rule 12 (Q889, wired by Q1042): every id this branch adds holds a
        # refs/queue-ids claim, which is what `alloc-queue-id.sh` cannot enforce
        # on its own — an id incremented by hand reserves nothing.
        #
        # --strict here and nowhere else. The default turns an unreadable remote
        # into a skip so an offline clone still runs the gate, and this is the
        # one place a network is guaranteed, so it is the one place that skip
        # must be a failure — otherwise the check can silently not run exactly
        # where it is relied on.
        run: scripts/docs/check-queue-claims.sh --strict

  # Aggregate required-status gate. Mark THIS job's check context
  # (`status-lint-gate`) required in the branch ruleset — never the path-gated
  # lint-status job, because a path-skip leaves it Pending and blocks the merge
  # forever. Passes only when every needed job succeeded or was legitimately
  # skipped. See docs/development/testing.md#path-gated-workflows-verify-the-heavy-gates-actually-ran.
  status-lint-gate:
    needs: [changes, lint-status]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      # `always()` above makes a skipped need a pass, by design — so a green
      # gate reads the same whether the jobs it guards ran or never started, and
      # the check UI has nowhere to say which (Q872 gave the two e2e lanes this;
      # Q898 the rest). Ordered before the gate step so a failing gate still
      # reports. Narration only: the required check is unchanged.
      #
      # Driven off `toJSON(needs)` rather than a hand-written env var per job, so
      # a job added to `needs:` above appears here without a second edit — the
      # kind of drift the gate lists themselves keep acquiring.
      - name: say which gated jobs ran
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          # Backticks inside the single-quoted jq programs are markdown code
          # spans for the rendered summary, not command substitution.
          # shellcheck disable=SC2016
          {
            printf -- '### %s: which gated jobs ran\n\n' "${GITHUB_WORKFLOW}"
            printf -- '| job | result |\n| --- | --- |\n'
            jq -r 'to_entries | .[] | select(.key != "changes")
                   | "| `\(.key)` | \(.value.result) |"' <<<"${NEEDS}"
            if jq -e 'to_entries | any(.key != "changes" and .value.result == "skipped")' \
                >/dev/null <<<"${NEEDS}"; then
              printf -- '\n%s\n' 'A `skipped` job is a path-skip, **not** a pass — this gate counts it as one so the required check can report. A green gate here is not a verdict on the skipped rows above.'
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
      - name: require every gating job to have succeeded or skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          echo "needed job results: ${RESULTS}"
          for r in ${RESULTS}; do
            case "$r" in
              success | skipped) ;;
              *) echo "::error::a gating job concluded '${r}'"; exit 1 ;;
            esac
          done
