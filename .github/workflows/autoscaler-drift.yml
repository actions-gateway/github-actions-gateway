# The live-autoscaler drift gate (Q474), given a trigger (Q480).
#
# What it detects: the capacity gate's elastic-cluster signal recognizes
# cluster-autoscaler by two Event reasons and a reporter name — strings UPSTREAM
# owns. A reword there fails *open* (an unrecognized vocabulary yields "not
# declined", which is exactly the ungated behaviour), so the mode would silently
# become a no-op on every elastic cluster with every recorded-sample test still
# green. `make test-autoscaler` asserts the matcher against events a real
# cluster-autoscaler emits, on its kwok cloud provider (real autoscaler, real
# scheduler-framework evaluation, real events, fake nodes).
#
# WHY THIS IS CHANGE-TRIGGERED AND NOT SCHEDULED (the Q480 decision).
# A weekly sweep would re-run one fixed experiment: CA_VERSION is a pin, so a
# cron at that pin installs the same image and asserts the same strings every
# week, forever, until something in the repo changes. It cannot observe upstream
# drift, because drift arrives in a cluster-autoscaler release this job would
# never install. The event that flips the answer is a version move, so the
# version move is the trigger:
#
#   * CA_VERSION / KWOK_VERSION / the manifests / the matcher — a PR touching any
#     of them runs this gate. That turns "run it when bumping CA_VERSION" from a
#     doc instruction nothing enforced into a check.
#   * KIND_VERSION below — the coupling that makes this fire on its own. The
#     harness deliberately does NOT pin KIND_NODE_IMAGE: it rides kind's default
#     node image, so the cluster's Kubernetes minor is chosen by the kind
#     release. cluster-autoscaler is released per Kubernetes minor, so a kind
#     bump that moves the default node image's minor is exactly the moment
#     CA_VERSION must move to the matching CA minor — and a CA minor is where a
#     vocabulary reword lands. updatecli bumps KIND_VERSION here weekly
#     (updatecli.d/kind.yaml rewrites this file and e2e-reusable.yml together),
#     so that bump PR trips the `changes` filter below and runs the gate.
#   * CA_VERSION itself, for PATCH releases (Q483). The kind coupling above only
#     fires on a minor, which left every CA patch untested until the next minor
#     came round. updatecli.d/cluster-autoscaler.yaml now moves the patch inside
#     the pinned minor weekly; that PR edits scripts/e2e/autoscaler-cluster.sh, the
#     first path in the `changes` filter below. It cannot cross a minor — doing so
#     would manufacture the node-image skew this gate exists to report.
#
# CAVEAT that the trigger depends on: the weekly updatecli bump PR is authored by
# GITHUB_TOKEN, so GitHub creates its runs and then holds them at
# action_required. This gate is among them, and it does not start until someone
# clicks "Approve and run" during the dependency triage pass. An empty check list
# there is a hold, not a workflow that never fired. See
# docs/development/dependency-updates.md, section "Operating notes".
name: autoscaler drift

on:
  # No top-level path filter, per the repo-wide pattern: a workflow skipped by
  # one reports NO check at all, and a PR opened before its code lands does not
  # reliably re-trigger it on the later push (actions/runner#2324). That skip
  # would be silent here in the worst way — this gate's whole job is to run on
  # the PR that moves a version pin. Trigger on every PR, classify in `changes`.
  # See docs/development/testing.md#path-gated-workflows-verify-the-heavy-gates-actually-ran.
  pull_request:
  workflow_dispatch:
    inputs:
      ca_version:
        description: 'cluster-autoscaler image tag to test (default: the CA_VERSION pin in scripts/e2e/autoscaler-cluster.sh). Probe a new minor here before committing to it.'
        type: string
      karpenter_version:
        description: 'kubernetes-sigs/karpenter tag to build and test (default: the KARPENTER_VERSION pin in scripts/e2e/karpenter-cluster.sh). Probe a new release here before committing to it.'
        type: string

# One run per PR; a superseded run's verdict is moot. Keyed on github.ref (the
# unique refs/pull/<n>/merge), not head_ref, so a colliding branch name cannot
# cancel another PR's runs.
concurrency:
  group: autoscaler-drift-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      autoscaler: ${{ steps.filter.outcome == 'success' && steps.filter.outputs.autoscaler || 'true' }}
      karpenter: ${{ steps.filter.outcome == 'success' && steps.filter.outputs.karpenter || 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        # Fails OPEN (Q363): paths-filter classifies the diff through one
        # un-retried GitHub API call, so a transient 5xx runs the gate rather
        # than skipping it.
        continue-on-error: true
        with:
          filters: |
            # Both arms share four surfaces — the matcher, its recorded unit
            # table, the shared live-test plumbing, and this workflow (so a kind
            # bump via updatecli's KIND_VERSION rewrite, or any job edit, re-runs
            # both arms). They are listed in both filters verbatim because the
            # path-filter checker's parser reads this block positionally and
            # does not resolve YAML anchors — keep the two copies in sync.
            autoscaler:
              # The version pins and the cluster recipe. Also the reason the
              # weekly cluster-autoscaler patch bump reaches this job: updatecli
              # rewrites CA_VERSION in this file (updatecli.d/cluster-autoscaler.yaml).
              - 'scripts/e2e/autoscaler-cluster.sh'
              # The verified kind download both arms run before bring-up.
              - 'scripts/fetch/**'
              - 'scripts/lib/**'
              - 'test/autoscaler/**'
              # The matcher under test and its test files. A matcher edit that
              # stays consistent with the recorded unit table can still be wrong
              # against a live autoscaler; that is the case this catches and the
              # unit tier cannot.
              - 'cmd/agc/internal/controller/autoscaler_verdict.go'
              - 'cmd/agc/internal/controller/autoscaler_verdict_test.go'
              - 'cmd/agc/internal/controller/live_harness_test.go'
              - 'cmd/agc/internal/controller/autoscaler_verdict_live_test.go'
              - '.github/workflows/autoscaler-drift.yml'
            karpenter:
              # The Karpenter arm's pins and recipe (KARPENTER_VERSION lives in
              # the script), plus the same four shared surfaces as above.
              - 'scripts/e2e/karpenter-cluster.sh'
              # The verified kind download both arms run before bring-up.
              - 'scripts/fetch/**'
              - 'scripts/lib/**'
              - 'test/karpenter/**'
              - 'cmd/agc/internal/controller/autoscaler_verdict.go'
              - 'cmd/agc/internal/controller/autoscaler_verdict_test.go'
              - 'cmd/agc/internal/controller/live_harness_test.go'
              - 'cmd/agc/internal/controller/karpenter_verdict_live_test.go'
              - '.github/workflows/autoscaler-drift.yml'
      - name: warn when change detection failed
        if: steps.filter.outcome == 'failure'
        run: echo "::warning::paths-filter could not classify the diff; assuming the autoscaler filter matched so the drift gate runs"

  drift:
    needs: [changes]
    if: needs.changes.outputs.autoscaler == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # kind release, pinned (not @latest) for reproducibility, and bumped
      # together with the copy in e2e-reusable.yml by updatecli
      # (updatecli.d/kind.yaml) so the two cannot drift.
      #
      # KIND_NODE_IMAGE is deliberately UNSET — see the header. The harness wants
      # kind's default node image so the Kubernetes minor tracks the kind
      # release; pinning it here would decouple the cluster's minor from
      # CA_VERSION and silently reintroduce the skew this gate is meant to
      # surface.
      KIND_VERSION: v0.32.0
      KIND_BINARY_SHA256: 50030de23cf40a18505f20426f6a8506bedf13c6e509244bd1fa9463721b0f54
      # Empty on every trigger but a dispatch that set it; scripts/e2e/autoscaler-cluster.sh
      # uses `${CA_VERSION:-<pin>}`, which falls back on empty as well as unset.
      # Threaded as an env var rather than interpolated into a run: script — no
      # script-injection surface from the dispatch input.
      CA_VERSION: ${{ inputs.ca_version }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work

      - name: Install kind ${{ env.KIND_VERSION }}
        # Same pinned-binary + checksum path as e2e-reusable.yml:
        # download-verified.sh retries a transient GitHub releases CDN error and
        # gates on KIND_BINARY_SHA256 before anything lands at the output path.
        run: |
          scripts/fetch/download-verified.sh \
            "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64" \
            "${KIND_BINARY_SHA256}" /tmp/kind
          sudo install -m 0755 /tmp/kind /usr/local/bin/kind
          kind version

      - name: Stand up the live-autoscaler cluster
        run: make autoscaler-cluster

      - name: Assert the matcher against the live autoscaler
        run: make test-autoscaler

      - name: Diagnostics on failure
        if: failure()
        # A drift failure is read from the events themselves: the question a
        # human asks next is "what vocabulary DID it emit?", so dump the raw
        # events and CA's own log rather than only the test's assertion diff.
        # Captured here because the runner is torn down with the cluster on it.
        run: |
          ctx=kind-gag-autoscaler
          echo "::group::cluster-autoscaler image + status"
          kubectl --context "$ctx" -n kube-system get deploy/cluster-autoscaler \
            -o jsonpath='{.spec.template.spec.containers[0].image}{"\n"}' || true
          kubectl --context "$ctx" -n kube-system get configmap cluster-autoscaler-status -o yaml || true
          echo "::endgroup::"
          echo "::group::events (all namespaces, raw)"
          kubectl --context "$ctx" get events --all-namespaces -o yaml || true
          echo "::endgroup::"
          echo "::group::cluster-autoscaler log"
          kubectl --context "$ctx" -n kube-system logs deploy/cluster-autoscaler --tail=300 || true
          echo "::endgroup::"
          echo "::group::nodes + pods"
          kubectl --context "$ctx" get nodes -o wide || true
          kubectl --context "$ctx" get pods --all-namespaces -o wide || true
          echo "::endgroup::"

  # The Karpenter arm (Q479). Same shape as `drift`, its own cluster and its
  # own pin: upstream publishes no image for its kwok provider, so the recipe
  # clones the pinned tag and builds it — which is why this job also needs Go.
  karpenter-drift:
    needs: [changes]
    if: needs.changes.outputs.karpenter == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      # Pinned together with the copy in the `drift` job above; see the comment
      # there. KIND_NODE_IMAGE stays unset here too, though for a simpler
      # reason: Karpenter is not released per Kubernetes minor, so there is no
      # version coupling to preserve — kind's default is just the cheapest
      # current cluster.
      KIND_VERSION: v0.32.0
      KIND_BINARY_SHA256: 50030de23cf40a18505f20426f6a8506bedf13c6e509244bd1fa9463721b0f54
      # Empty on every trigger but a dispatch that set it; scripts/e2e/karpenter-cluster.sh
      # uses `${KARPENTER_VERSION:-<pin>}`, which falls back on empty as well as
      # unset. Threaded as an env var rather than interpolated into a run:
      # script — no script-injection surface from the dispatch input.
      KARPENTER_VERSION: ${{ inputs.karpenter_version }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work

      - name: Install kind ${{ env.KIND_VERSION }}
        run: |
          scripts/fetch/download-verified.sh \
            "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64" \
            "${KIND_BINARY_SHA256}" /tmp/kind
          sudo install -m 0755 /tmp/kind /usr/local/bin/kind
          kind version

      - name: Stand up the live-Karpenter cluster
        run: make karpenter-cluster

      - name: Assert the matcher against the live Karpenter
        run: make test-karpenter

      - name: Diagnostics on failure
        if: failure()
        # Same rationale as the drift job's diagnostics: a failure is read from
        # what the cluster actually said, and the runner is torn down with the
        # cluster on it.
        run: |
          ctx=kind-gag-karpenter
          echo "::group::karpenter image + nodepool status"
          kubectl --context "$ctx" -n kube-system get deploy/karpenter \
            -o jsonpath='{.spec.template.spec.containers[0].image}{"\n"}' || true
          kubectl --context "$ctx" get nodepools -o yaml || true
          kubectl --context "$ctx" get nodeclaims -o wide || true
          echo "::endgroup::"
          echo "::group::events (all namespaces, raw)"
          kubectl --context "$ctx" get events --all-namespaces -o yaml || true
          echo "::endgroup::"
          echo "::group::karpenter log"
          kubectl --context "$ctx" -n kube-system logs deploy/karpenter --tail=300 || true
          echo "::endgroup::"
          echo "::group::nodes + pods"
          kubectl --context "$ctx" get nodes -o wide || true
          kubectl --context "$ctx" get pods --all-namespaces -o wide || true
          echo "::endgroup::"

  # Aggregate gate, same shape as every other workflow here so this CAN be made a
  # required status check without restructuring. It is deliberately NOT required
  # today: a drift failure wants a human decision — adopt the new vocabulary
  # (matcher + recorded unit table) or hold the version bump — the same posture
  # as the shellcheck and polaris bump PRs. See docs/development/testing.md.
  autoscaler-drift-gate:
    needs: [changes, drift, karpenter-drift]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      # `always()` above makes a skipped need a pass, by design — so a green
      # gate reads the same whether the jobs it guards ran or never started, and
      # the check UI has nowhere to say which (Q872 gave the two e2e lanes this;
      # Q898 the rest). Ordered before the gate step so a failing gate still
      # reports. Narration only: the required check is unchanged.
      #
      # Driven off `toJSON(needs)` rather than a hand-written env var per job, so
      # a job added to `needs:` above appears here without a second edit — the
      # kind of drift the gate lists themselves keep acquiring.
      - name: say which gated jobs ran
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          # Backticks inside the single-quoted jq programs are markdown code
          # spans for the rendered summary, not command substitution.
          # shellcheck disable=SC2016
          {
            printf -- '### %s: which gated jobs ran\n\n' "${GITHUB_WORKFLOW}"
            printf -- '| job | result |\n| --- | --- |\n'
            jq -r 'to_entries | .[] | select(.key != "changes")
                   | "| `\(.key)` | \(.value.result) |"' <<<"${NEEDS}"
            if jq -e 'to_entries | any(.key != "changes" and .value.result == "skipped")' \
                >/dev/null <<<"${NEEDS}"; then
              printf -- '\n%s\n' 'A `skipped` job is a path-skip, **not** a pass — this gate counts it as one so the required check can report. A green gate here is not a verdict on the skipped rows above.'
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
      - name: require every gating job to have succeeded or skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          echo "needed job results: ${RESULTS}"
          for r in ${RESULTS}; do
            case "$r" in
              success | skipped) ;;
              *) echo "::error::a gating job concluded '${r}'"; exit 1 ;;
            esac
          done
