# e2e on the Calico (egress-enforcing) CNI profile — Q119.
#
# kindnet (the per-PR e2e CNI in e2e-test.yml) accepts NetworkPolicy objects but
# its bundled kube-network-policies enforcer does not drop egress, so the
# NetworkPolicy-enforcement specs cannot be validated there and self-skip. Q7b
# confirmed they enforce on Calico v3.31.5 locally; this lane makes that a
# standing CI gate. On Calico the full suite runs and these specs activate:
#   - E2E_GMC_TenantProvisioning_ProxyConnectWorks       (runs on both CNIs)
#   - E2E_GMC_TenantProvisioning_WorkloadEgressBlockedToNonProxyPod  (calico-only)
#   - E2E_GMC_TenantProvisioning_WorkerCannotReachK8sAPI            (calico-only)
#   - E2E_GMC_ManagerMetricsNP_DeniesUnlabeledNamespace            (calico-only, Q83)
#   - E2E_GMC_ManagerMetricsNP_AllowsLabeledNamespace             (calico-only, Q83)
#   - E2E_V2_DirectEgress_NonGitHubBlocked                        (calico-only)
# egressEnforcingCNI() is the authoritative list — this comment omitted the
# direct-egress spec from the v2 work until #1417, and testing.md's copy had the
# same gap, so grep the call sites rather than trusting either count.
#
# The Calico leg only does real work when the diff touches code that can affect
# NetworkPolicy enforcement — the GMC (which generates the tenant + manager
# policies), the egress proxy, the chart's policy templates, or the cluster/CNI
# plumbing itself — so the vast majority of PRs that cannot regress enforcement
# stay on the fast kindnet leg and pay no Calico cost. The `changes` filter is
# the sole automatic gate (there is no nightly catch-all), so it errs toward the
# components that produce or police the enforced traffic; a manual run is always
# available via workflow_dispatch. The Calico images are pre-pulled + cached
# (see e2e-reusable.yml) so the per-PR cost is bounded and quay.io is off the
# critical path.
#
# This lane IS a required status check via its `gate` job. The workflow triggers
# on every PR (no top-level pull_request path filter) and gates the expensive
# leg on the internal `changes` job — the always-runs-then-skips
# dorny/paths-filter pattern — so a non-matching PR still reports a green
# `gate`. See docs/development/testing.md#path-gated-workflows-verify-the-heavy-gates-actually-ran.
name: e2e (calico)

on:
  # No pull_request path filter: trigger on EVERY PR so `gate` always reports its
  # required-status check. Fine-grained skipping is the `changes` job below. The
  # push filter keeps the expensive post-merge leg scoped to the same paths (the
  # push and changes-filter lists must be kept identical; GitHub Actions does not
  # reliably support YAML anchors, so the list is duplicated rather than shared).
  # That duplication is now asserted — scripts/ci/check-path-filters.sh compares
  # the two sets — because it went unnoticed for a merge when Q571 rewrote the
  # filter's scripts/ patterns and left this list naming two moved files.
  pull_request:
  # Merge queue: also run on the queue's candidate merge commit so the gate
  # reports its required check there — an unreporting required check wedges
  # the queue. paths-filter diffs merge_group events via git against the
  # event's base/head, so non-matching queue entries stay cheap.
  merge_group:
  push:
    branches: [main]
    paths:
      - 'cmd/gmc/**'
      - 'cmd/proxy/**'
      - 'Dockerfile'
      - 'charts/actions-gateway/templates/**'
      - 'scripts/e2e/**'
      - 'scripts/fetch/**'
      - 'scripts/lib/**'
      - 'Makefile'
      - '.github/workflows/e2e-calico.yml'
      - '.github/workflows/e2e-reusable.yml'
  workflow_dispatch:
    inputs:
      # Run-scoped routing for the release gate (E2E_WORKFLOW=e2e-calico.yml):
      # same contract as e2e-test.yml's dispatch input.
      runner:
        description: 'JSON-encoded runs-on for the e2e job, e.g. ''"gag-ci-e2e"''. Empty uses vars.GAG_E2E_RUNNER, then ubuntu-latest.'
        type: string
        default: ''

# Cancel a superseded in-progress run on the same PR (a newer push moots it);
# pushes to main are a distinct ref and are never cancelled. Same keying rationale
# as e2e-test.yml (github.ref, not head_ref).
concurrency:
  group: e2e-calico-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Fine-grained path gate. The workflow triggers on every PR (so `gate` can be a
  # required check), so classify the diff here and skip the expensive Calico leg
  # unless it touches NetworkPolicy-affecting code. On push to main / dispatch the
  # leg runs regardless. The `calico` filter list must stay identical to the
  # `push.paths` list above.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      calico: ${{ steps.filter.outcome == 'success' && steps.filter.outputs.calico || 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        # paths-filter resolves the changed-file list through ONE un-retried
        # GitHub API call (@actions/github Octokit carries no retry plugin), so a
        # single transient 5xx fails this job and, with it, the gate. Survive it:
        # the job outputs below fail OPEN, running the gated jobs rather than
        # skipping them when the diff could not be classified (Q363).
        continue-on-error: true
        with:
          filters: |
            calico:
              - 'cmd/gmc/**'           # generates tenant + manager NetworkPolicies, IPRangeReconciler, e2e specs
              - 'cmd/proxy/**'         # the egress proxy (ProxyConnectWorks)
              - 'Dockerfile'           # builds the gmc + proxy images this lane deploys
              - 'charts/actions-gateway/templates/**'  # manager NetworkPolicy templates (ManagerMetricsNP); templates-only so a metadata Chart.yaml bump doesn't fire this lane (Q296)
              # The scripts behind e2e-reusable.yml, which this lane and the
              # kindnet lane both run — so these three must match e2e-test.yml's
              # `e2e` filter exactly, and check-path-filters.sh asserts it. The
              # two lanes used to disagree by ~60×: this list named 2 of the ≥6
              # scripts the reusable workflow calls, so a free-runner-disk.sh
              # change skipped the lane that exercises it (Q571).
              - 'scripts/e2e/**'
              - 'scripts/fetch/**'
              - 'scripts/lib/**'
              - 'Makefile'             # e2e targets + CALICO_VERSION
              - '.github/workflows/e2e-calico.yml'
              - '.github/workflows/e2e-reusable.yml'
      # A JS action reports failure only as an ::error:: annotation, so a rerun
      # that replaces the check run erases it — leaving a log that simply stops
      # after `Invoking listFiles` with no error anywhere (Q363). Say it plainly.
      - name: warn when change detection failed
        if: steps.filter.outcome == 'failure'
        run: echo "::warning::paths-filter could not classify the diff; assuming every filter matched so the gated jobs run"

  e2e-calico:
    needs: [changes]
    # Queue-time, not per-PR — same reasoning and the same accepted trade-off as
    # the kindnet lane (Q675, see e2e-test.yml). This lane is the longer of the
    # two (870s vs 804s) and runs on ~70% of PR branches, so it set the PR-side
    # critical path that the demotion removes.
    if: (needs.changes.outputs.calico == 'true' && github.event_name == 'merge_group') || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/e2e-reusable.yml
    permissions:
      contents: read
    with:
      kind_cni: calico
      # Empty except on dispatch — see e2e-test.yml.
      runner: ${{ inputs.runner || '' }}
      # Extra headroom over the kindnet leg's 50m: Calico adds the calico-node
      # rollout to cluster bring-up, and the egress-negative specs that self-skip
      # on kindnet actually run here — while this leg skips the three chart
      # checks the kindnet leg pays for. Image pre-pull keeps this comfortable.
      timeout_minutes: 60
      # Skip the day-2 `helm upgrade` check here (Q475). What it asserts — that
      # `helm upgrade` delivers CRD and template changes to a live release — has
      # nothing to do with the CNI, so the kindnet leg (which runs on every
      # e2e-relevant PR, whereas this one is path-gated) is the one that pays for
      # it. Running it on both legs would buy a duplicate verdict, not coverage.
      chart_upgrade_check: false
      # Skip the day-2 uninstall/reinstall check here too (Q444/Q492), on the same
      # reasoning. What it asserts — that the guard's CRD paramKind still resolves
      # after `helm uninstall` empties its binding set — is a kube-apiserver
      # informer property, entirely independent of the CNI. Q444 did originally
      # reproduce on both legs, but that reflected the defect being ambient, not
      # the CNI mattering; the mechanism is now established and CNI-free.
      chart_reinstall_check: false
      # Skip the released-chart upgrade check here too (Q507), on the same
      # reasoning. What it asserts — that the last released chart's published
      # artifact upgrades to HEAD along the documented path — is pure Helm
      # semantics, entirely independent of the CNI.
      released_upgrade_check: false

  # Aggregate required-status gate. Mark THIS job's check context
  # (`e2e-calico-gate`) required in the branch ruleset — never the path-gated
  # e2e-calico job, because a path-skip leaves it Pending and blocks the merge
  # forever. `needs.e2e-calico.result` reflects the reusable workflow's
  # conclusion. Passes only when every needed job succeeded or was legitimately
  # skipped. See docs/development/testing.md#path-gated-workflows-verify-the-heavy-gates-actually-ran.
  e2e-calico-gate:
    needs: [changes, e2e-calico]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: require every gating job to have succeeded or skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          echo "needed job results: ${RESULTS}"
          for r in ${RESULTS}; do
            case "$r" in
              success | skipped) ;;
              *) echo "::error::a gating job concluded '${r}'"; exit 1 ;;
            esac
          done
