on:
  # No pull_request path filter: this workflow must trigger on EVERY PR so its
  # `gate` job always reports its required-status check (a path-skipped workflow
  # leaves the required check Pending and wedges the merge). Fine-grained
  # skipping happens inside via the `changes` job — see
  # docs/development/testing.md#path-gated-workflows-verify-the-heavy-gates-actually-ran.
  pull_request:
  # Merge queue: also run on the queue's candidate merge commit so the gate
  # reports its required check there — an unreporting required check wedges
  # the queue. paths-filter diffs merge_group events via git against the
  # event's base/head, so non-matching queue entries stay cheap.
  merge_group:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  # Manual opt-in dispatch for GAG dogfood validation turn-ups (Q224/Q264). When
  # target_gag=true the integration-test job routes to the self-hosted GAG runner
  # (vars.GAG_RUNNER); on every other trigger — and on a dispatch with the input
  # unset/false — it stays on ubuntu-latest. This scopes cluster contention to
  # explicitly-requested validation bursts instead of every concurrent push, PR,
  # or Dependabot run, which is what a global GAG_RUNNER flip would route.
  workflow_dispatch:
    inputs:
      target_gag:
        description: 'Route the integration-test job to the GAG dogfood cluster (vars.GAG_RUNNER)'
        type: boolean
        default: false

# Cancel superseded runs of this workflow on the same PR; pushes to main are
# never cancelled (each is a distinct post-merge gate). Keyed on github.ref —
# for a PR that is the unique refs/pull/<n>/merge. A workflow_dispatch run gets
# its own group (run id appended) so a validation turn-up never queues behind an
# in-flight push run on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Fine-grained path gate. The coarse paths-ignore above still lets non-code,
  # non-docs files (e.g. .gitignore, LICENSE) trigger this workflow, so classify
  # the diff and skip the test job when no code changed. Mirrors e2e-test.yml.
  # On push to main the job always runs, so the output only matters on PRs.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outcome == 'success' && steps.filter.outputs.code || 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        # paths-filter resolves the changed-file list through ONE un-retried
        # GitHub API call (@actions/github Octokit carries no retry plugin), so a
        # single transient 5xx fails this job and, with it, the gate. Survive it:
        # the job outputs below fail OPEN, running the gated jobs rather than
        # skipping them when the diff could not be classified (Q363).
        continue-on-error: true
        with:
          filters: |
            code:
              # api/** and scaleset/** are go.work modules the envtest suites
              # compile against — cmd/{agc,gmc} import api/{apilabels,v2alpha1,
              # v2beta1} and the AGC ScaleSet suite imports scaleset +
              # scaleset/scalesettest directly. Both were missing until Q400, so
              # a change confined to either module skipped this whole tier.
              - 'api/**'
              - 'broker/**'
              - 'cmd/**'
              - 'githubapp/**'
              - 'scaleset/**'
              - 'test/**'
              # The shipped runner template library is INPUT to this tier:
              # TestTemplateLibrary_Admitted applies every entry to a real
              # apiserver, which is the only thing that validates an entry no
              # dogfood overlay exercises (Q554). Without this pattern a
              # library-only change skips its own gate and reports green.
              - 'deploy/templates/**'
              - 'vendor/**'
              - 'go.work'
              - 'go.work.sum'
              - 'Makefile'
              # The two steps below run through this wrapper, which sources
              # scripts/lib/. A change to either decides how this tier runs, so
              # it has to be able to trigger the tier that would catch it.
              - 'scripts/go/go-test-integration.sh'
              - 'scripts/lib/**'
              - '.github/workflows/integration-test.yml'
      # A JS action reports failure only as an ::error:: annotation, so a rerun
      # that replaces the check run erases it — leaving a log that simply stops
      # after `Invoking listFiles` with no error anywhere (Q363). Say it plainly.
      - name: warn when change detection failed
        if: steps.filter.outcome == 'failure'
        run: echo "::warning::paths-filter could not classify the diff; assuming every filter matched so the gated jobs run"

  integration-test:
    needs: [changes]
    if: needs.changes.outputs.code == 'true' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ (github.event_name == 'workflow_dispatch' && inputs.target_gag) && fromJSON(vars.GAG_RUNNER || '"ubuntu-latest"') || 'ubuntu-latest' }}
    # One job per module. The two suites are separate go.work modules with
    # separate envtest clusters and no shared state, so running them in one job
    # only serialized them: 308s (GMC) then 284s (AGC) inside a 617s job,
    # measured 2026-08-12. As a matrix the tier costs max() instead of sum().
    #
    # fail-fast is off because each entry is an independent verdict — cancelling
    # AGC because GMC failed would hide whether the change broke one tier or both,
    # which is the first thing triage needs.
    strategy:
      fail-fast: false
      matrix:
        module: [gmc, agc]
    # Must exceed the suite budget plus its build, or a hung suite is killed by
    # THIS timeout first — which reports a cancelled job and no goroutine dump,
    # the one failure shape that says less than the panic it pre-empts. One 10m
    # budget plus setup and the -race build is ~15m worst case; a normal entry is
    # ~6m (measured 2026-08-12).
    timeout-minutes: 20
    # ENVTEST_K8S_VERSION pins the Kubernetes API-server version the integration
    # tier tests against. Single-sourced here (the cache key + the `use` below both
    # read it) and kept in lockstep with the same pin in cmd/{gmc,agc}/Makefile by
    # updatecli (updatecli.d/envtest.yaml, weekly), which rewrites all three. It is
    # the envtest twin of KIND_NODE_IMAGE — keep the two on the same Kubernetes
    # minor so the integration and e2e tiers test the same version. Multi-gateway
    # AGC scoping (KEP-4358 field selectors) needs ≥ 1.31; older fails the field
    # selector. The ".x" patch wildcard lets setup-envtest pick the newest patch.
    env:
      ENVTEST_K8S_VERSION: 1.35.x
      # The module this entry tests, as a directory under cmd/. Surfaced as an
      # env var rather than interpolated into the run: script below, matching the
      # KIND_CNI handling in e2e-reusable.yml — a matrix value is workflow-authored
      # rather than attacker-supplied, but keeping every ${{ }} out of run: bodies
      # means no reviewer has to re-derive that for each one.
      MODULE: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
      - name: Build setup-envtest
        run: make setup-envtest
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/envtest-bins
          key: envtest-${{ runner.os }}-${{ env.ENVTEST_K8S_VERSION }}
      - name: Install envtest binaries
        run: |
          KUBEBUILDER_ASSETS=$(.build/setup-envtest use "$ENVTEST_K8S_VERSION" --bin-dir /tmp/envtest-bins -p path)
          echo "KUBEBUILDER_ASSETS=$KUBEBUILDER_ASSETS" >> "$GITHUB_ENV"
      # The wrapper owns -race, the `integration` tag and the -timeout budget, so
      # the budget is one number here and in both module Makefiles, and a breach
      # annotates the step with "the suite ran out of time" instead of leaving
      # the panic to blame whichever test held the wall (Q741).
      - name: Run ${{ matrix.module }} integration tests
        run: scripts/go/go-test-integration.sh "cmd/${MODULE}" -v -count=1 ./internal/controller/integration/...

  # Aggregate required-status gate. Mark THIS job's check context
  # (`integration-test-gate`) required in the branch ruleset — never the
  # path-gated jobs above, because a path-skip leaves them Pending and blocks the
  # merge forever. Passes only when every needed job succeeded or was
  # legitimately skipped. See docs/development/testing.md#path-gated-workflows-verify-the-heavy-gates-actually-ran.
  integration-test-gate:
    needs: [changes, integration-test]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      # `always()` above makes a skipped need a pass, by design — so a green
      # gate reads the same whether the jobs it guards ran or never started, and
      # the check UI has nowhere to say which (Q872 gave the two e2e lanes this;
      # Q898 the rest). Ordered before the gate step so a failing gate still
      # reports. Narration only: the required check is unchanged.
      #
      # Driven off `toJSON(needs)` rather than a hand-written env var per job, so
      # a job added to `needs:` above appears here without a second edit — the
      # kind of drift the gate lists themselves keep acquiring.
      - name: say which gated jobs ran
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          # Backticks inside the single-quoted jq programs are markdown code
          # spans for the rendered summary, not command substitution.
          # shellcheck disable=SC2016
          {
            printf -- '### %s: which gated jobs ran\n\n' "${GITHUB_WORKFLOW}"
            printf -- '| job | result |\n| --- | --- |\n'
            jq -r 'to_entries | .[] | select(.key != "changes")
                   | "| `\(.key)` | \(.value.result) |"' <<<"${NEEDS}"
            if jq -e 'to_entries | any(.key != "changes" and .value.result == "skipped")' \
                >/dev/null <<<"${NEEDS}"; then
              printf -- '\n%s\n' 'A `skipped` job is a path-skip, **not** a pass — this gate counts it as one so the required check can report. A green gate here is not a verdict on the skipped rows above.'
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
      - name: require every gating job to have succeeded or skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          echo "needed job results: ${RESULTS}"
          for r in ${RESULTS}; do
            case "$r" in
              success | skipped) ;;
              *) echo "::error::a gating job concluded '${r}'"; exit 1 ;;
            esac
          done
