# Q583 probe fixture — dispatch-only, never runs in normal CI.
#
# Queues one job on runs-on: gag-q583-replay so the cmd/probe Investigation G run
# (PROBE_REPLAY_TEST=true) has a real job to be assigned. Nothing ever runs it:
# the probe cancels the run to drive the job terminal, which is what makes the
# replayed assignment a job that is provably over. See the Q583 plan doc.
#
# Dispatch this BEFORE starting the probe: a job queued against a
# not-yet-registered scale-set label waits server-side and is assigned the moment
# the scale set appears, which removes the race the probe's own "dispatch NOW"
# prompt implies.
name: q583-replay-probe
on:
  workflow_dispatch: {}
  # workflow_dispatch only works once the file reaches the default branch; the
  # push trigger (scoped to this file on claude/ branches) lets the probe session
  # queue the job from its own feature branch.
  push:
    branches: ["claude/**"]
    paths: [".github/workflows/q583-replay-probe.yml"]

# The job exists to be queued against the scale-set label and cancelled; it never
# touches the repo, so it gets no token scopes at all.
permissions: {}

# Jobs run only on explicit opt-in: a workflow_dispatch, or a push whose head
# commit message contains "[q583-probe]". A plain push touching this file (e.g.
# editing the fixture itself) skips the job, so the run concludes green instead
# of leaving a queued job on the PR.
jobs:
  replay-job:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[q583-probe]')
    runs-on: gag-q583-replay
    timeout-minutes: 10
    steps:
      - run: echo "This job is never expected to run — the Q583 probe cancels it (Q583)."
