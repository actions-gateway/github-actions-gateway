on:
  # No pull_request path filter: this workflow must trigger on EVERY PR so its
  # `gate` job always reports its required-status check. A workflow skipped by a
  # top-level path filter leaves its required check Pending, which blocks the
  # merge forever. Fine-grained skipping still happens inside via the `changes`
  # job + each job's `if:` guard, so the expensive jobs stay off unrelated PRs.
  # See docs/development/testing.md#path-gated-workflows-verify-the-heavy-gates-actually-ran.
  pull_request:
  # Merge queue: also run on the queue's candidate merge commit so the gate
  # reports its required check there — an unreporting required check wedges
  # the queue. paths-filter diffs merge_group events via git against the
  # event's base/head, so non-matching queue entries stay cheap.
  merge_group:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '!docs/STATUS.md'
      # Generated from api/v2beta1 and gated by the `lint` job's
      # api-reference-check (Q632), so a hand-edit landing on main must still
      # reach that gate — a docs path that is code output, not prose.
      - '!docs/reference/api.md'
  # Manual opt-in dispatch for GAG dogfood validation turn-ups (Q224/Q264). When
  # target_gag=true the migrated jobs route to the self-hosted GAG runner
  # (vars.GAG_RUNNER); on every other trigger — and on a dispatch with the input
  # unset/false — they stay on ubuntu-latest. This scopes cluster contention to
  # explicitly-requested validation bursts instead of every concurrent push, PR,
  # or Dependabot run, which is what a global GAG_RUNNER flip would route.
  workflow_dispatch:
    inputs:
      target_gag:
        description: 'Route the migrated jobs to the GAG dogfood cluster (vars.GAG_RUNNER)'
        type: boolean
        default: false

# Cancel superseded runs of this workflow on the same PR; pushes to main are
# never cancelled (each is a distinct post-merge gate). Keyed on github.ref —
# for a PR that is the unique refs/pull/<n>/merge. A workflow_dispatch run gets
# its own group (run id appended) so a validation turn-up never queues behind an
# in-flight push run on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Pin the shellcheck version rather than using ubuntu-latest's preinstalled one:
# that version drifts with the runner image and its SC2015-style heuristics
# differ between releases, so an unpinned gate gives a different verdict locally
# vs. CI. Pinning makes `make shellcheck` reproducible; devs install the same
# version to match (see docs/development/testing.md).
#
# Workflow-level so the two jobs that install shellcheck — `shellcheck` (the
# scripts/ tree) and `actionlint` (inline workflow `run:` blocks) — cannot drift
# to different versions and disagree about the same script.
env:
  SHELLCHECK_VERSION: v0.11.0
  # SHA256 of shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz (Q127).
  # GitHub release assets are mutable for an existing tag, so verify the bytes
  # before trusting the binary. Bumped in lockstep with the version by updatecli
  # (updatecli.d/shellcheck.yaml; shellcheck publishes no checksum file, so it
  # hashes the tarball directly).
  SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198

jobs:
  # Fine-grained path gate. The coarse paths-ignore above still lets non-code,
  # non-docs files (e.g. .gitignore, LICENSE) trigger this workflow, so classify
  # the diff and skip the jobs when nothing they cover changed. Mirrors
  # e2e-test.yml. On push to main the jobs always run, so outputs only matter on PRs.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outcome == 'success' && steps.filter.outputs.code || 'true' }}
      status: ${{ steps.filter.outcome == 'success' && steps.filter.outputs.status || 'true' }}
      scripts: ${{ steps.filter.outcome == 'success' && steps.filter.outputs.scripts || 'true' }}
      vendor: ${{ steps.filter.outcome == 'success' && steps.filter.outputs.vendor || 'true' }}
      modules: ${{ steps.filter.outcome == 'success' && steps.filter.outputs.modules || 'true' }}
      workflows: ${{ steps.filter.outcome == 'success' && steps.filter.outputs.workflows || 'true' }}
      claude_usage: ${{ steps.filter.outcome == 'success' && steps.filter.outputs.claude_usage || 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        # paths-filter resolves the changed-file list through ONE un-retried
        # GitHub API call (@actions/github Octokit carries no retry plugin), so a
        # single transient 5xx fails this job and, with it, the gate. Survive it:
        # the job outputs below fail OPEN, running the gated jobs rather than
        # skipping them when the diff could not be classified (Q363).
        continue-on-error: true
        with:
          filters: |
            code:
              # api/** was missing here until Q374: the neutral v2 API module is in
              # go.work and both `make lint` and `make test` cover it, so an
              # api-only change skipped its own gofmt, golangci-lint, and unit
              # tests. It also gates the v2 API sync check below.
              - 'api/**'
              - 'broker/**'
              - 'cmd/**'
              - 'githubapp/**'
              - 'scaleset/**'
              - 'test/**'
              - 'vendor/**'
              - 'go.work'
              - 'go.work.sum'
              - 'tools/**'
              # cmd/agc/names/runner_version_test.go reads the root Dockerfile's
              # `worker` stage FROM line, so a Dockerfile-only edit can break a
              # unit test.
              - 'Dockerfile'
              - '.golangci.yml'
              - 'Makefile'
              # Every backend of this job's gates lives in scripts/go/ (Q571), so
              # the group is the pattern — no enumeration to drift out of date.
              # local-throttle.sh sits in agent/ because nothing in CI gates on
              # it, but go-test.sh/go-lint.sh source it.
              - 'scripts/go/**'
              - 'scripts/agent/local-throttle.sh'
              - 'scripts/lib/**'
              # The API-reference drift gate (Q632) runs in this job's `lint`
              # step. Its source of truth is api/** above, but a hand-edit of the
              # generated page — or of the generator itself — must re-run it too,
              # and neither path is otherwise in `code`.
              - 'scripts/docs/gen-api-reference.sh'
              - 'docs/reference/api.md'
              # devtools/ is outside go.work, but go-test.sh tests it in this
              # job's own run (the firstparty_nonworkspace_modules loop) — so
              # without this a devtools-only change ships with its Go tests
              # never executed. It reaches the `scripts` filter below too; that
              # one gates shellcheck, which does not touch Go (Q618).
              - 'devtools/**'
              # devtools/agent/pipedgate's table test reads the shipped registry
              # rather than a fixture (Q625), so a registry edit that broke a
              # pattern must re-run this job's Go tests too.
              - '.claude/piped-gate-guard.json'
              - 'coverage-baseline.txt'
              - '.github/workflows/unit-test.yml'
            status:
              - 'docs/STATUS.md'
              - 'scripts/docs/lint-backlog.sh'
              - '.github/workflows/unit-test.yml'
            scripts:
              - 'scripts/**'
              # The piped-gate hook's registry (Q625). It is data, not shell, so
              # shellcheck skips it — but claude-piped-gate-hook-test.sh reads
              # the shipped file rather than a copy, so a registry edit that
              # broke a pattern would otherwise land with its test never run.
              - '.claude/piped-gate-guard.json'
              # The shipped runner template library and the dogfood e2e overlays
              # that consume it (Q554). Neither is shell, so shellcheck skips
              # both — but this job's `make template-library-check` reconciles
              # the two trees against each other, and check-template-library-test.sh
              # runs that gate against the tracked tree. Without these patterns a
              # library-only change skips the gate whose whole job is to notice it.
              - 'deploy/templates/**'
              - 'deploy/dogfood-e2e/**'
              # The MkDocs hooks are Python, not shell, so shellcheck skips them —
              # but `make scripts-test` asserts their behaviour (Q393), and that
              # runs in this job. Without this the announce-bar hook could change
              # with its own test never running.
              - 'hooks/**'
              # devtools/ is the first-party Go tooling module (Q584). It backs
              # gates this job runs — check-path-filters.sh builds and execs
              # devtools/ci/pathfilters — so a change there must re-run them.
              # Deliberately narrow: it is outside go.work precisely so tooling
              # edits never reach the e2e or security lanes.
              - 'devtools/**'
              # foreground-guard-patterns-test.sh asserts against this config,
              # so a config-only change must re-run it. Without this a new slow
              # command could register an over-matching pattern with the test
              # that catches it never running.
              - '.claude/foreground-guard.json'
              - 'Makefile'
              - '.github/workflows/unit-test.yml'
            # Vendor-integrity gate scope: anything that determines what the
            # committed vendor trees should contain. A pure .go edit can't change
            # vendor contents, so it's deliberately narrower than `code` to avoid
            # re-running the network re-vendor on every source change.
            vendor:
              - 'vendor/**'
              - 'tools/vendor/**'
              - 'devtools/vendor/**'
              - '**/go.mod'
              - '**/go.sum'
              - 'go.work'
              - 'go.work.sum'
              - 'scripts/go/vendor-check.sh'
              - 'Makefile'
              - '.github/workflows/unit-test.yml'
            # Tidiness gate scope (Q94): anything that determines the tidy-canonical
            # shape of the workspace module files — the module files, the import
            # graph, and the tidy flow itself.
            modules:
              - '**/go.mod'
              - '**/go.sum'
              - 'go.work'
              - 'go.work.sum'
              # The import graph is an input too (Q545). Promoting a dependency from
              # indirect to direct — or dropping its last import — untidies a go.mod
              # with no module file in the diff, so a .go-only PR skipped this gate
              # entirely. #890 merged untidy that way; tidy-check then failed on main
              # and every branch cut from it until #907 re-tidied six days later. A
              # glob rather than a per-module list so a new module can't be missed;
              # that it also matches the vendored trees is harmless, since a vendor
              # sync never lands without the go.mod change that drove it.
              - '**/*.go'
              - 'scripts/go/go-tidy-check.sh'
              - 'scripts/go/go-work-tidy.sh'
              - 'Makefile'
              - '.github/workflows/unit-test.yml'
            # Scope for the three gates that read the workflows themselves: the
            # path-filter coherence gate (Q429), actionlint (Q579) and the
            # `uses:` pin gate (Q644). Their trigger set is the same — any
            # workflow edit must re-run all three — so they share one filter
            # rather than keeping lists that would have to stay in step.
            # Deliberately the only filter watching ALL of .github/workflows/:
            # editing any workflow's `filters:` block must re-run the gate that
            # lints it.
            workflows:
              - '.github/workflows/**'
              # The kubebuilder scaffolding workflows GitHub never runs. Outside
              # actionlint's scope, which sees only the root directory above, but
              # inside the pin gate's — it covers every workflow in the tree, so
              # its trigger must too (Q644).
              - 'cmd/gmc/.github/workflows/**'
              - '.github/actionlint.yaml'
              - 'go.work'
              - 'scripts/ci/check-path-filters.sh'
              - 'scripts/ci/actionlint-workflows.sh'
              - 'scripts/ci/check-uses-pinned.sh'
              # devtools/ backs the two gates here whose logic outgrew shell:
              # devtools/ci/pathfilters and devtools/ci/usespin.
              - 'devtools/**'
              - 'tools/**'
              - 'Makefile'
            # The claude-usage/ Python module (Q437). It matched no filter in this
            # repo — it is neither Go code nor a shell script — so its unittest
            # suite ran only when someone remembered to run it by hand, and PR
            # #841 shipped a model-mapping fix that no gate would have caught.
            claude_usage:
              - 'claude-usage/**'
              - 'scripts/agent/claude-usage-test.sh'
              - 'Makefile'
              - '.github/workflows/unit-test.yml'
      # A JS action reports failure only as an ::error:: annotation, so a rerun
      # that replaces the check run erases it — leaving a log that simply stops
      # after `Invoking listFiles` with no error anywhere (Q363). Say it plainly.
      - name: warn when change detection failed
        if: steps.filter.outcome == 'failure'
        run: echo "::warning::paths-filter could not classify the diff; assuming every filter matched so the gated jobs run"

  lint:
    needs: [changes]
    # gofmt/golangci need code; lint-backlog needs the STATUS.md filter.
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.status == 'true' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ (github.event_name == 'workflow_dispatch' && inputs.target_gag) && fromJSON(vars.GAG_RUNNER || '"ubuntu-latest"') || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
      # setup-go caches $GOCACHE + modules but not the golangci-lint analyzer
      # cache, so every PR re-analyzes cold. Key invalidates on linter version
      # (tools/go.sum), config, or any module's deps changing.
      - name: cache golangci-lint analyzer
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/golangci-lint
          key: golangci-lint-${{ runner.os }}-${{ hashFiles('tools/go.sum', '.golangci.yml', '**/go.sum') }}
          restore-keys: |
            golangci-lint-${{ runner.os }}-
      # `make lint` (scripts/go/go-lint.sh) is the single source of truth for the
      # gofmt check and the per-module golangci-lint loop, so local and CI
      # verdicts match. It builds .build/golangci-lint from the vendored tools/
      # module first; its local throttle is a no-op here (CI env var is set).
      - name: gofmt + golangci-lint (make lint)
        run: make lint
      - name: lint STATUS.md
        run: make lint-backlog
      # Enforce a single Go version across go.work / all go.mod / all go.work.gen
      # (Q68). The go.work.gen files feed `make manifests` and have drifted before.
      - name: single Go version (make go-version-check)
        run: make go-version-check
      # Assert the two served v2 API packages hold their shared files identically
      # (Q345, widened in Q374). Ran only under a local `make check` before, so the
      # drift it guards could reach main unnoticed.
      - name: v2 API package sync (make v2-api-sync-check)
        run: make v2-api-sync-check
      # Compile + vet the build-tagged (integration/e2e/load) Go files (Q404).
      # `make lint` above and the unit-test job both build with the DEFAULT tag
      # set, so a compile break in an envtest/e2e/load package used to reach only
      # the path-gated integration and e2e workflows, which may not even run on
      # the PR that introduced it. This catches it in the fast leg, on every PR
      # touching code, without envtest assets or a cluster.
      - name: build-tagged files compile + vet (make build-tags-check)
        run: make build-tags-check
      # Assert every committed CRD/RBAC/webhook manifest still matches what
      # controller-gen generates from today's Go types (Q440). It belongs in this
      # job, not manifest-validate.yml: the drift is caused by a GO TYPE change,
      # and that workflow's `manifests` filter is deliberately scoped to the
      # generated YAML. cmd/gmc's ActionsGateway CRD embeds AGC types, so an edit
      # in cmd/agc/api goes stale in the GMC manifest with neither module's YAML
      # touched — exactly the diff this job's `code` filter sees.
      - name: controller-gen manifest drift (make codegen-check)
        run: make codegen-check

      # Assert the published API reference still matches the api/v2beta1 doc
      # comments and validation markers it is generated from (Q632). Same
      # reasoning as codegen-check above and the same `code` filter: the drift is
      # caused by a GO type/doc-comment change, and a doc-comment edit changes no
      # schema, so no manifest lands in the diff to route it elsewhere.
      - name: API reference drift (make api-reference-check)
        run: make api-reference-check
  # Shellcheck the standalone helper scripts under scripts/. The `actionlint` job
  # below covers the inline workflow `run:` blocks, but the scripts/*.sh files
  # ship unlinted otherwise. Isolated from the `lint` job so a scripts-only
  # change does not also trigger the full Go lint. `make shellcheck` (scripts/ci/shellcheck-scripts.sh) is
  # the single source of truth for the file set (every present scripts/*.sh,
  # recursive — tracked or untracked-and-not-gitignored).
  shellcheck:
    needs: [changes]
    if: needs.changes.outputs.scripts == 'true' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ (github.event_name == 'workflow_dispatch' && inputs.target_gag) && fromJSON(vars.GAG_RUNNER || '"ubuntu-latest"') || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # `make scripts-test` below shells out to go (go-vet-tags-test.sh runs a
      # real `go vet`), and the GAG dogfood runner image omits go by design —
      # without this step every target_gag=true dispatch failed here (Q482).
      # ubuntu-latest happens to preinstall go, but the pinned go-version-file
      # toolchain keeps the verdict identical across both runner types.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
      - name: install pinned shellcheck
        run: |
          set -euo pipefail
          base="shellcheck-${SHELLCHECK_VERSION}"
          url="https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/${base}.linux.x86_64.tar.xz"
          scripts/fetch/download-verified.sh "$url" "${SHELLCHECK_SHA256}" "$RUNNER_TEMP/sc.tar.xz"
          tar -xf "$RUNNER_TEMP/sc.tar.xz" -C "$RUNNER_TEMP"
          sudo install "$RUNNER_TEMP/${base}/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version
      - name: shellcheck scripts
        run: make shellcheck
      - name: errexit prologue (make errexit-prologue-check)
        # shellcheck has no check for `set -e` not reaching into a command
        # substitution, and its SC2155 covers only the `local x="$(f)"` half.
        # Named separately from `make scripts-test` — which also runs the gate
        # against the tracked tree — so the verdict for the bug class this
        # repo cares most about is not buried in a suite's tail (Q733).
        run: make errexit-prologue-check
      - name: scripts behavioural tests (make scripts-test)
        # Pure-bash assertions shellcheck can't express — currently the tags-only
        # release signing-identity regexp (Q124). Same job as shellcheck since
        # both gate the scripts/ tree on a scripts-only change.
        run: make scripts-test
      - name: shipped template library matches what CI exercises (make template-library-check)
        # Named separately from `make scripts-test` even though that suite also
        # runs the gate against the tracked tree, so a library-only change gets a
        # CI verdict under its own name rather than buried in a suite's tail.
        # Seconds; the render half needs kubectl and degrades to a printed skip
        # without it.
        run: make template-library-check
  # Supply-chain integrity gate for the committed vendor trees (Q126). `go build
  # -mod=vendor` only checks vendor/modules.txt consistency, never that the
  # vendored source matches the go.sum hashes — so a tampered vendor/ edit would
  # ship into the signed release images undetected. `make vendor-check` re-runs
  # the workspace-vendor flow (re-fetching every module verified against go.sum)
  # and fails on any drift vs the committed trees. Isolated from unit-test so a
  # vendor/go.mod-only change doesn't also trigger the -race suite, and vice
  # versa. A Dependabot go.mod bump legitimately fails here until a follow-up
  # vendor sync lands — that's the intended signal (see scripts/go/vendor-check.sh).
  vendor-check:
    needs: [changes]
    if: needs.changes.outputs.vendor == 'true' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ (github.event_name == 'workflow_dispatch' && inputs.target_gag) && fromJSON(vars.GAG_RUNNER || '"ubuntu-latest"') || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
      # `make vendor-check` (scripts/go/vendor-check.sh) is the single source of
      # truth so the local and CI verdicts match. It re-fetches modules from the
      # proxy (verified against go.sum) when the setup-go module cache misses,
      # else re-vendors offline from cache; either way the git diff is the gate.
      - name: vendor integrity vs go.sum (make vendor-check)
        run: make vendor-check

  # Tidiness gate for the workspace module files (Q94). A non-canonical committed
  # go.sum makes the documented tidy flow (scripts/go/go-work-tidy.sh + go work sync)
  # re-add the /go.mod hash rows to broker/probe/proxy/githubapp and re-resolve
  # cmd/gmc's stale indirect requires, so contributors keep reverting spurious
  # diffs. `make tidy-check` re-runs that flow and fails on any go.mod/go.sum/
  # go.work.sum drift, keeping the committed files tidy-canonical. Sibling of
  # vendor-check (Q126): this gates the module files, vendor-check gates that
  # vendor/ matches them. Isolated as its own job (and its own narrower `modules`
  # path filter) so a vendor-only or source-only change doesn't trigger the tidy
  # re-run, and vice versa.
  tidy-check:
    needs: [changes]
    if: needs.changes.outputs.modules == 'true' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ (github.event_name == 'workflow_dispatch' && inputs.target_gag) && fromJSON(vars.GAG_RUNNER || '"ubuntu-latest"') || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
      # `make tidy-check` (scripts/go/go-tidy-check.sh) is the single source of truth
      # so the local and CI verdicts match. It re-runs the documented tidy flow;
      # on a cold module cache `go mod tidy` re-fetches the build-graph go.mod
      # files (verified against go.sum), else tidies offline. The git diff is the
      # gate.
      - name: module files are tidy (make tidy-check)
        run: make tidy-check

  unit-test:
    needs: [changes]
    if: needs.changes.outputs.code == 'true' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ (github.event_name == 'workflow_dispatch' && inputs.target_gag) && fromJSON(vars.GAG_RUNNER || '"ubuntu-latest"') || 'ubuntu-latest' }}
    # -race roughly doubles unit runtime vs. plain `go test`, so allow more
    # headroom than the lint job. The race detector needs cgo, which the
    # ubuntu-latest image's gcc satisfies out of the box.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
      # Run the workspace unit tests under the race detector. `make test-race`
      # is the single source of truth for the race flags/timeout; its throttle
      # prefix is a no-op on CI (the CI env var is set), so this runs at full
      # speed here while staying desktop-safe when invoked locally.
      - name: run unit tests (-race)
        run: make test-race

  # Coverage no-regression ratchet. Separate from unit-test (which runs -race):
  # this re-runs the unit tests with -cover (no race) and fails only if a
  # module's coverage drops below the floor recorded in coverage-baseline.txt
  # minus a small tolerance. `make cover-check` is the single source of truth
  # for the measurement and gate. See
  # docs/development/testing.md#coverage-measurement-and-the-ratchet. Runs in
  # parallel with unit-test rather than
  # chained after it so the race gate's latency isn't serialized behind a second
  # (uninstrumented) test run.
  coverage:
    needs: [changes]
    if: needs.changes.outputs.code == 'true' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ (github.event_name == 'workflow_dispatch' && inputs.target_gag) && fromJSON(vars.GAG_RUNNER || '"ubuntu-latest"') || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
      - name: coverage ratchet (make cover-check)
        run: make cover-check

  # Reconcile every workflow's `dorny/paths-filter` lists with `go.work` and with
  # the paths they name (Q429). The filters are hand-maintained, and a filter that
  # omits a directory makes its gate report green by SKIPPING — which is how an
  # api-only and a scaleset-only change reached main without ever meeting the
  # envtest, e2e, or security tiers (Q400). Its own job rather than a step in
  # `lint`, because the trigger set is different: a workflow-only change must
  # re-run this and nothing else. Parses YAML and stats paths, so it needs no Go
  # build and finishes in seconds.
  path-filters:
    needs: [changes]
    if: needs.changes.outputs.workflows == 'true' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ (github.event_name == 'workflow_dispatch' && inputs.target_gag) && fromJSON(vars.GAG_RUNNER || '"ubuntu-latest"') || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # `go work edit -json` reads the module list; no build, no module download.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
      - name: path filters cover go.work (make path-filters-check)
        run: make path-filters-check

  # Lint the workflows themselves (Q579). Three docs credited actionlint with
  # keeping SHA-pinned `uses:` clean and with linting inline `run:` blocks while
  # nothing in CI ran it, so a workflow-only PR shipped unlinted. Its own job
  # rather than a step in `lint`, for the same reason as path-filters above: a
  # workflow-only change must re-run this and nothing else.
  #
  # actionlint builds from the vendored tools/ module — a Go linter, so tools/ is
  # its home the same way golangci-lint's is — which keeps it off the host
  # dependency list while `make actionlint` still gives the identical local
  # verdict. Its `run:` linting is delegated to shellcheck, which must therefore
  # be installed here: with shellcheck absent actionlint silently disables that
  # half and still exits 0 (scripts/ci/actionlint-workflows.sh fails instead).
  actionlint:
    needs: [changes]
    if: needs.changes.outputs.workflows == 'true' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ (github.event_name == 'workflow_dispatch' && inputs.target_gag) && fromJSON(vars.GAG_RUNNER || '"ubuntu-latest"') || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
      # Same pinned install as the shellcheck job, off the same workflow-level
      # version + digest, so both jobs lint shell with one shellcheck.
      - name: install pinned shellcheck
        run: |
          set -euo pipefail
          base="shellcheck-${SHELLCHECK_VERSION}"
          url="https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/${base}.linux.x86_64.tar.xz"
          scripts/fetch/download-verified.sh "$url" "${SHELLCHECK_SHA256}" "$RUNNER_TEMP/sc.tar.xz"
          tar -xf "$RUNNER_TEMP/sc.tar.xz" -C "$RUNNER_TEMP"
          sudo install "$RUNNER_TEMP/${base}/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version
      - name: lint workflows (make actionlint)
        run: make actionlint

  # Assert every `uses:` is pinned to an immutable commit SHA (Q644). Its own job
  # rather than a step in `actionlint` above, because it is the gate for what
  # actionlint does NOT check and the two verdicts must be readable apart: folded
  # into that job, a mutable pin would report as "actionlint failed" and send the
  # reader to the linter that had in fact passed.
  #
  # Measured against actionlint v1.7.12, the version tools/ pins: `@v7.0.1`,
  # `@v4` and `@main` all exit 0, and it resolves the action's inputs off the tag
  # while doing so — it reads the ref and only ever asserts one is present and
  # well formed. A tag is mutable by whoever owns the action, and an action runs
  # inside a job holding the repository token. Dependabot bumps pins; nothing
  # stopped one being written as a tag until this.
  #
  # Wider scope than actionlint, which lints only the root .github/workflows/:
  # this covers every workflow and composite action in the tree, cmd/gmc/'s
  # scaffolding included. Parses YAML and matches refs — no network, no toolchain
  # beyond the Go build of devtools/ci/usespin.
  uses-pinned:
    needs: [changes]
    if: needs.changes.outputs.workflows == 'true' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ (github.event_name == 'workflow_dispatch' && inputs.target_gag) && fromJSON(vars.GAG_RUNNER || '"ubuntu-latest"') || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
      - name: action refs are SHA-pinned (make uses-pinned-check)
        run: make uses-pinned-check

  # Run the claude-usage/ Python suite (Q437). That module holds the committed
  # record of the project's Claude Code usage — for days whose session transcripts
  # have since been archived, the CSVs under claude-usage/data/ are the only
  # surviving copy — and compute_metrics.py's merge rule is what keeps a re-run
  # from revising a recorded day downward or collapsing two machines' shares of
  # one day. test_compute_metrics.py pins that, but the module fell outside every
  # filter above (neither Go code nor a shell script), so the suite ran only when
  # someone remembered; PR #841 shipped a model-mapping fix that no gate would
  # have caught. Its own job because its trigger set and its toolchain are
  # different: Python, no Go, no build. Finishes in seconds.
  #
  # Stays on ubuntu-latest even under a target_gag dispatch: the dogfood runner
  # image is provisioned for the Go/e2e jobs, and this gate has no reason to take
  # cluster capacity.
  claude-usage-test:
    needs: [changes]
    if: needs.changes.outputs.claude_usage == 'true' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'
      # `make claude-usage-test` (scripts/agent/claude-usage-test.sh) is the single
      # source of truth so the local and CI verdicts match. The suite is
      # stdlib-only, so there is nothing to pip install here.
      - name: claude-usage unit tests (make claude-usage-test)
        run: make claude-usage-test

  # Aggregate required-status gate. Mark THIS job's check context
  # (`unit-test-gate`) required in the branch ruleset — never the individual
  # path-gated jobs above, because a path-skip leaves them Pending and blocks the
  # merge forever. Runs on every PR (the workflow has no top-level path filter)
  # and passes only when every needed job succeeded or was legitimately skipped.
  # See docs/development/testing.md#path-gated-workflows-verify-the-heavy-gates-actually-ran.
  unit-test-gate:
    needs: [changes, lint, shellcheck, actionlint, vendor-check, tidy-check, unit-test, coverage, path-filters, claude-usage-test]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: require every gating job to have succeeded or skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          echo "needed job results: ${RESULTS}"
          for r in ${RESULTS}; do
            case "$r" in
              success | skipped) ;;
              *) echo "::error::a gating job concluded '${r}'"; exit 1 ;;
            esac
          done
