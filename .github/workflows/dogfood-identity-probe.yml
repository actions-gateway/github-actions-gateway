# Q880 milestone 1 — prove GitHub Actions can reach the dogfood cluster with no
# stored credential, and that the access it gets is read-only.
#
# The identity is set up once by scripts/dogfood/ci-identity-setup.sh: the job's
# own OIDC token is exchanged through Workload Identity Federation for a
# short-lived token of the release-validator service account. The provider only
# accepts this repository's tokens from THIS workflow on `main`, inside the
# `dogfood-validation` environment. The environment also waits for its reviewer,
# which is the account `gh` authenticates as — a click, not a second person.
#
# Deliberately workflow_dispatch ONLY: it is the acceptance check for a one-time
# setup and gates nothing. Milestone 3 widens the service account's roles for the
# real gate, and the negative assertion below moves with it.
# Plan: Q880.
name: dogfood-identity-probe

on:
  workflow_dispatch:

# id-token: write is what lets the job mint its OIDC token; nothing else here
# needs more than read.
permissions:
  contents: read
  id-token: write

jobs:
  probe:
    name: Keyless access to the dogfood cluster
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: dogfood-validation
    steps:
      - name: Authenticate to GCP through Workload Identity Federation
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Fetch cluster credentials
        uses: google-github-actions/get-gke-credentials@3da1e46a907576cefaa90c484278bb5b259dd395 # v3.0.0
        with:
          project_id: ${{ vars.DOGFOOD_PROJECT }}
          cluster_name: ${{ vars.DOGFOOD_CLUSTER }}
          location: ${{ vars.DOGFOOD_ZONE }}

      - name: Read the cluster, and fail if the grant can write to it
        # Reading proves the exchange worked end to end. The write check is the
        # half that proves the grant is the one milestone 1 asked for: a probe
        # that only reads would pass just as well under cluster-admin.
        run: |
          kubectl get namespaces
          verdict="$(kubectl auth can-i create pods --namespace gag-dogfood || true)"
          echo "can create pods in gag-dogfood: ${verdict}"
          if [ "${verdict}" != "no" ]; then
            echo "::error::the service account can write to the cluster; milestone 1 grants read-only access"
            exit 1
          fi
