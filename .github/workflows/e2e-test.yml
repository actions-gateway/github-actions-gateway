on:
  # No pull_request path filter: this workflow must trigger on EVERY PR so its
  # `gate` job always reports its required-status check (a path-skipped workflow
  # leaves the required check Pending and wedges the merge). Fine-grained
  # skipping happens inside via the `changes` job — see
  # docs/development/testing.md#path-gated-workflows-verify-the-heavy-gates-actually-ran.
  pull_request:
  # Merge queue: also run on the queue's candidate merge commit so the gate
  # reports its required check there — an unreporting required check wedges
  # the queue. paths-filter diffs merge_group events via git against the
  # event's base/head, so non-matching queue entries stay cheap.
  merge_group:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  # The release gate's entry point: dispatch one run routed to the dogfood GAG
  # scale set via `runner`, scoped to that run alone. Replaces flipping the
  # repo-wide vars.GAG_E2E_RUNNER, which routed every concurrent PR/merge onto
  # the tenant for the whole window (2026-07-31 incident).
  workflow_dispatch:
    inputs:
      runner:
        description: 'JSON-encoded runs-on for the e2e job, e.g. ''"gag-ci-e2e"''. Empty uses vars.GAG_E2E_RUNNER, then ubuntu-latest.'
        type: string
        default: ''

# Cancel an in-progress e2e run when a newer commit is pushed to the same PR —
# the old run's result is moot and finishing it just burns ~35 min of runner
# time. cancel-in-progress is gated to pull_request events so pushes to main
# (each a distinct ref, and a post-merge gate worth keeping) are never cancelled.
# Keyed on github.ref (not head_ref): for a PR this is the unique
# refs/pull/<n>/merge, so an attacker cannot pick a colliding branch name to
# cancel another PR's runs the way a head_ref (source branch name) key allows.
concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Detect which files changed so the e2e job can be skipped on PRs that
  # touch only CI configs for other suites, .claude/, etc.  Pushes to main
  # always run regardless of this filter.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      e2e: ${{ steps.filter.outcome == 'success' && steps.filter.outputs.e2e || 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        # paths-filter resolves the changed-file list through ONE un-retried
        # GitHub API call (@actions/github Octokit carries no retry plugin), so a
        # single transient 5xx fails this job and, with it, the gate. Survive it:
        # the job outputs below fail OPEN, running the gated jobs rather than
        # skipping them when the diff could not be classified (Q363).
        continue-on-error: true
        with:
          filters: |
            e2e:
              # api/** and scaleset/** are go.work modules compiled into the AGC and
              # GMC images this tier bakes and deploys (cmd/{agc,gmc} import both).
              # Both were missing until Q400, so a change confined to either module
              # shipped to main without any e2e run against it.
              - 'api/**'
              - 'cmd/**'
              - 'broker/**'
              - 'githubapp/**'
              - 'scaleset/**'
              - 'test/**'
              - 'vendor/**'
              - 'go.work'
              - 'go.work.sum'
              # scripts/ is grouped by blast radius (Q571), so the scripts this
              # tier runs are three prefixes rather than the whole directory:
              # e2e/ is its cluster bring-up, image bake and chart install checks;
              # fetch/ is the download/retry/prepull family e2e-reusable.yml calls
              # directly; lib/ is sourced by both. Every other group — docs/, go/,
              # dogfood/, … — is invisible here by construction. Keep these three
              # identical to e2e-calico.yml's, which runs the same reusable
              # workflow; scripts/ci/check-path-filters.sh asserts that.
              - 'scripts/e2e/**'
              - 'scripts/fetch/**'
              - 'scripts/lib/**'
              # The chart is the sole cluster-install path (Q142) and this tier
              # deploys it via `make deploy`. Absent here, a chart-only change
              # skipped the one job that exercises the chart against a real
              # apiserver — so chart regressions reached main untested.
              - 'charts/**'
              - 'Makefile'
              - 'docker-bake.hcl'
              # The root Dockerfile builds all six images this tier deploys. It
              # used to live under cmd/** and test/**, already covered above;
              # at the repo root it needs its own entry or an image-only change
              # skips e2e.
              - 'Dockerfile'
              - '.github/workflows/e2e-test.yml'
              - '.github/workflows/e2e-reusable.yml'
      # A JS action reports failure only as an ::error:: annotation, so a rerun
      # that replaces the check run erases it — leaving a log that simply stops
      # after `Invoking listFiles` with no error anywhere (Q363). Say it plainly.
      - name: warn when change detection failed
        if: steps.filter.outcome == 'failure'
        run: echo "::warning::paths-filter could not classify the diff; assuming every filter matched so the gated jobs run"

  # The per-PR / push-to-main e2e leg: kindnet (kind's default CNI). The
  # cluster/image/test plumbing lives in the reusable workflow so the nightly
  # Calico lane (e2e-calico.yml) inherits the same setup without duplication.
  # kindnet accepts NetworkPolicy but does not enforce egress drops, so the
  # NetworkPolicy-enforcement negative specs self-skip here; the Calico lane
  # covers them (Q119).
  e2e:
    needs: [changes]
    # Always run on push to main and on dispatch; skip on PRs where no
    # e2e-relevant files changed.
    if: needs.changes.outputs.e2e == 'true' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/e2e-reusable.yml
    permissions:
      contents: read
    with:
      kind_cni: kindnet
      # Empty on pull_request/push (the inputs context only populates on
      # dispatch), so those events keep the variable-then-hosted fallback.
      runner: ${{ inputs.runner || '' }}

  # Aggregate required-status gate. Mark THIS job's check context
  # (`e2e-gate`) required in the branch ruleset — never the path-gated
  # `e2e` job, because a path-skip leaves it Pending and blocks the merge
  # forever. `needs.e2e.result` reflects the reusable workflow's conclusion.
  # Passes only when every needed job succeeded or was legitimately skipped.
  # See docs/development/testing.md#path-gated-workflows-verify-the-heavy-gates-actually-ran.
  e2e-gate:
    needs: [changes, e2e]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: require every gating job to have succeeded or skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          echo "needed job results: ${RESULTS}"
          for r in ${RESULTS}; do
            case "$r" in
              success | skipped) ;;
              *) echo "::error::a gating job concluded '${r}'"; exit 1 ;;
            esac
          done
