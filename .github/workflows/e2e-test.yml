on:
  # No pull_request path filter: this workflow must trigger on EVERY PR so its
  # `gate` job always reports its required-status check (a path-skipped workflow
  # leaves the required check Pending and wedges the merge). Fine-grained
  # skipping happens inside via the `changes` job — see
  # docs/plan/required-status-checks.md.
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'

# Cancel an in-progress e2e run when a newer commit is pushed to the same PR —
# the old run's result is moot and finishing it just burns ~35 min of runner
# time. cancel-in-progress is gated to pull_request events so pushes to main
# (each a distinct ref, and a post-merge gate worth keeping) are never cancelled.
# Keyed on github.ref (not head_ref): for a PR this is the unique
# refs/pull/<n>/merge, so an attacker cannot pick a colliding branch name to
# cancel another PR's runs the way a head_ref (source branch name) key allows.
concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Detect which files changed so the e2e job can be skipped on PRs that
  # touch only CI configs for other suites, .claude/, etc.  Pushes to main
  # always run regardless of this filter.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      e2e: ${{ steps.filter.outputs.e2e }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        with:
          filters: |
            e2e:
              - 'cmd/**'
              - 'broker/**'
              - 'githubapp/**'
              - 'test/**'
              - 'vendor/**'
              - 'go.work'
              - 'go.work.sum'
              # All of scripts/ EXCEPT scripts/dogfood/. dorny/paths-filter ORs
              # its patterns (filter.ts: patterns.some), so a leading-'!' item is
              # NOT a subtraction — picomatch reads '!scripts/dogfood/**' as "match
              # anything outside dogfood", which OR's to true for nearly every file.
              # Instead enumerate positively: top-level scripts (scripts/*) plus any
              # non-dogfood subdir (scripts/!(dogfood)/**, an extglob — MatchOptions
              # leaves extglob enabled). Dogfood/GKE tooling is never run by the kind
              # e2e job (it provisions the GAG-hosted DinD runner, a separate deploy
              # target), so a dogfood-only change must not trigger this job.
              - 'scripts/*'
              - 'scripts/!(dogfood)/**'
              - 'Makefile'
              - 'docker-bake.hcl'
              - '.github/workflows/e2e-test.yml'
              - '.github/workflows/e2e-reusable.yml'

  # The per-PR / push-to-main e2e leg: kindnet (kind's default CNI). The
  # cluster/image/test plumbing lives in the reusable workflow so the nightly
  # Calico lane (e2e-calico.yml) inherits the same setup without duplication.
  # kindnet accepts NetworkPolicy but does not enforce egress drops, so the
  # NetworkPolicy-enforcement negative specs self-skip here; the Calico lane
  # covers them (Q119).
  e2e:
    needs: [changes]
    # Always run on push to main; skip on PRs where no e2e-relevant files changed.
    if: needs.changes.outputs.e2e == 'true' || github.event_name == 'push'
    uses: ./.github/workflows/e2e-reusable.yml
    permissions:
      contents: read
    with:
      kind_cni: kindnet

  # Aggregate required-status gate. Mark THIS job's check context
  # (`e2e-gate`) required in the branch ruleset — never the path-gated
  # `e2e` job, because a path-skip leaves it Pending and blocks the merge
  # forever. `needs.e2e.result` reflects the reusable workflow's conclusion.
  # Passes only when every needed job succeeded or was legitimately skipped.
  # See docs/plan/required-status-checks.md.
  e2e-gate:
    needs: [changes, e2e]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: require every gating job to have succeeded or skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          echo "needed job results: ${RESULTS}"
          for r in ${RESULTS}; do
            case "$r" in
              success | skipped) ;;
              *) echo "::error::a gating job concluded '${r}'"; exit 1 ;;
            esac
          done
