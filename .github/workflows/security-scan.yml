name: security-scan

# Two independent supply-chain gates that the existing unit/integration/e2e
# workflows don't cover:
#   - govulncheck: per-module, workspace-aware scan for known vulnerabilities
#     reachable from our code (stdlib + dependency CVEs).
#   - trivy: scans every built image (OS packages + bundled Go libraries) for
#     fixable HIGH/CRITICAL CVEs.
# Both fail the PR so a regression cannot merge silently.
on:
  # No pull_request path filter: this workflow must trigger on EVERY PR so its
  # `gate` job always reports its required-status check (a path-skipped workflow
  # leaves the required check Pending and wedges the merge). Fine-grained
  # skipping happens inside via the `changes` job — see
  # docs/development/testing.md#path-gated-workflows-verify-the-heavy-gates-actually-ran.
  pull_request:
  # Merge queue: also run on the queue's candidate merge commit so the gate
  # reports its required check there — an unreporting required check wedges
  # the queue. paths-filter diffs merge_group events via git against the
  # event's base/head, so non-matching queue entries stay cheap.
  merge_group:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'

# Cancel superseded runs of this workflow on the same PR; pushes to main are
# never cancelled (each is a distinct post-merge gate). Mirrors unit-test.yml.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Fine-grained path gate. The coarse paths-ignore above still lets non-code
  # files (e.g. .gitignore, LICENSE) trigger this workflow, so classify the diff
  # and skip the scan jobs when nothing they cover changed. Mirrors
  # unit-test.yml. On push to main the jobs always run.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outcome == 'success' && steps.filter.outputs.code || 'true' }}
      chart: ${{ steps.filter.outcome == 'success' && steps.filter.outputs.chart || 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        # paths-filter resolves the changed-file list through ONE un-retried
        # GitHub API call (@actions/github Octokit carries no retry plugin), so a
        # single transient 5xx fails this job and, with it, the gate. Survive it:
        # the job outputs below fail OPEN, running the gated jobs rather than
        # skipping them when the diff could not be classified (Q363).
        continue-on-error: true
        with:
          filters: |
            code:
              # api/** and scaleset/** are go.work modules, so scripts/security/go-vulncheck.sh
              # (which loops `workspace_modules`) scans them and the baked images
              # link them in via cmd/{agc,gmc}. Both were missing until Q400, so a
              # change confined to either module skipped govulncheck and trivy.
              - 'api/**'
              - 'broker/**'
              - 'cmd/**'
              - 'githubapp/**'
              - 'scaleset/**'
              - 'test/**'
              - 'vendor/**'
              - 'go.work'
              - 'go.work.sum'
              - 'tools/**'
              - 'docker-bake.hcl'
              # The root Dockerfile builds every image the trivy matrix scans.
              - 'Dockerfile'
              - 'Makefile'
              # This job's scan backends are scripts/security/ (Q571); fetch/ is
              # the pinned-binary download and buildkit pre-pull it runs first.
              - 'scripts/security/**'
              - 'scripts/fetch/**'
              - 'scripts/lib/**'
              - '.github/workflows/security-scan.yml'
            chart:
              - 'charts/**'
              - 'Makefile'
              - 'scripts/security/**'
              - 'scripts/fetch/**'
              - 'scripts/lib/**'
              - '.github/workflows/security-scan.yml'
      # A JS action reports failure only as an ::error:: annotation, so a rerun
      # that replaces the check run erases it — leaving a log that simply stops
      # after `Invoking listFiles` with no error anywhere (Q363). Say it plainly.
      - name: warn when change detection failed
        if: steps.filter.outcome == 'failure'
        run: echo "::warning::paths-filter could not classify the diff; assuming every filter matched so the gated jobs run"

  # govulncheck is symbol-precise: it only fails on vulnerabilities actually
  # reachable from our code, not every CVE in the dependency graph. Run it per
  # workspace module (it is module-scoped) mirroring the lint job's loop.
  govulncheck:
    needs: [changes]
    if: needs.changes.outputs.code == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
      # `make vulncheck` (scripts/security/go-vulncheck.sh) is the single source of truth
      # for the per-module loop, so local and CI verdicts match. It builds
      # .build/govulncheck from the vendored tools/ module first.
      - name: run govulncheck across workspace modules
        run: make vulncheck

  # Build each image, scan it, and generate its SBOM. One matrix leg per image
  # (a named stage of the root Dockerfile) so a finding points straight at the
  # offending image and the six builds run in parallel. The SBOM is generated from the same build — a PR-time
  # check so SBOM generation can't silently break before a release. It is
  # uploaded as a build artifact only; SIGNING and attaching the SBOM as a cosign
  # attestation to a PUBLISHED image happen in publish.yml (needs a registry push
  # + OIDC), never on PRs.
  #
  # exit-code per leg: the images we build FROM a minimal/distroless base
  # block the PR (exit-code 1) — their only packages are ones we chose, so a
  # finding is actionable here. The worker image is built FROM the upstream
  # ghcr.io/actions/actions-runner and inherits dozens of HIGH/CRITICAL CVEs in
  # the bundled node20 runtime and the runner's own Go binaries that we cannot
  # fix without forking the runner. Gating PRs on those would red-gate unrelated
  # work, so worker is report-only (exit-code 0): findings are printed for
  # visibility but never block. Runner-base CVEs are addressed by bumping the
  # pinned tag (tracked via the dependabot 'docker' ecosystem + Q70).
  trivy:
    needs: [changes]
    if: needs.changes.outputs.code == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      # Buildkit image docker/setup-buildx-action boots its builder from; named
      # here so the pre-pull step and the builder pin reference one source.
      # DIGEST-PINNED (Q151): the buildx-stable-1 tag floats, so an unpinned
      # reference would let the builder that assembles the scanned images change
      # underfoot between runs. Pin by digest, kept in step with the e2e and
      # publish workflows by updatecli.d/buildkit.yaml.
      BUILDKIT_IMAGE: moby/buildkit:buildx-stable-1@sha256:0168606be2315b7c807a03b3d8aa79beefdb31c98740cebdffdfeebf31190c9f
      # Local-only tag the cached builder image is restored under, and what the
      # buildx driver below boots from. `docker load` cannot restore a manifest
      # digest, so ${BUILDKIT_IMAGE} itself would never resolve from the cache
      # (Q460 — see scripts/fetch/prepull-image-cached.sh). The pin is not weakened:
      # the cold-path pull is still digest-verified against ${BUILDKIT_IMAGE} and
      # the cache key below carries that digest, so this tag can only ever name
      # the bytes that pin selected. Keep BUILDKIT_IMAGE as the source of truth —
      # updatecli.d/buildkit.yaml bumps it by name.
      BUILDKIT_LOCAL_IMAGE: local/buildkit:pinned
      # syft release that generates the SBOMs, and the SHA256 of its linux/amd64
      # tarball taken from the release's published checksums file (Q127 — release
      # assets are mutable for an existing tag, so verify before trusting).
      # Auto-bumped by updatecli.d/syft.yaml, which rewrites the pair here and in
      # publish.yml together so the PR-time and release-time scanners match.
      SYFT_VERSION: v1.45.1
      SYFT_SHA256: 20c84195e24927f50a3b2269946be51f4c4abc9d2f145fee7388b4199149f716
    strategy:
      fail-fast: false
      # Each image is a named stage of the root Dockerfile, so a leg is selected
      # by `target`, not by file.
      matrix:
        include:
          - name: gmc
            exit-code: '1'
          - name: agc
            exit-code: '1'
          - name: proxy
            exit-code: '1'
          - name: fakegithub
            exit-code: '1'
          - name: worker
            # report-only — see the per-leg exit-code note on the job above.
            exit-code: '0'
          - name: wrapper
            # blocking: FROM scratch + the Go wrapper binary, no OS base CVEs
            # (unlike the worker leg's actions-runner base).
            exit-code: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cache buildkit builder image
        # All six shards of this matrix pre-pull the same ~200 MB builder image,
        # so without a cache one run means six concurrent anonymous Docker Hub
        # pulls — the rate-limit pressure that burned a shard's whole retry
        # budget on #895 (Q460). Keyed on the digest-pinned ref so an updatecli
        # bump invalidates it; on a cold key the six shards all miss and race to
        # save it, and the five losers log a benign "unable to reserve cache"
        # warning.
        id: buildkit-image-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/buildkit-image
          key: buildkit-image-${{ env.BUILDKIT_IMAGE }}
      - name: Pre-pull buildkit builder image
        # docker/setup-buildx-action boots its docker-container builder from the
        # image named in driver-opts, pulling it from Docker Hub with no retry of
        # its own — a timeout/rate-limit flake source. Restore it from the cache
        # above (or pull it once, with retries, on a miss) and expose it under
        # ${BUILDKIT_LOCAL_IMAGE} so the boot is a local hit and never touches Hub.
        run: |
          scripts/fetch/prepull-image-cached.sh \
            "${BUILDKIT_IMAGE}" /tmp/buildkit-image "${BUILDKIT_LOCAL_IMAGE}"
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          # Pin the builder to the buildkit image pre-pulled above so the boot
          # uses the local cache instead of pulling from Docker Hub. See the
          # BUILDKIT_LOCAL_IMAGE note on the job env for why this is the local
          # tag and not the digest-pinned ref.
          driver-opts: image=${{ env.BUILDKIT_LOCAL_IMAGE }}
      - name: build ${{ matrix.name }} image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          target: ${{ matrix.name }}
          load: true
          tags: local/${{ matrix.name }}:scan
          # Read-only reuse of the e2e bake's gha cache scope (docker-bake.hcl);
          # no cache-to so these scan builds never evict the e2e build cache.
          # One scope, not one per image: every target shares the Dockerfile's
          # `deps` stage, so the bake exports that warm Go build cache once.
          cache-from: type=gha,scope=images
      - name: install syft
        # Installed from the pinned release rather than via anchore/sbom-action:
        # that action fetches anchore's install.sh from raw.githubusercontent and
        # runs it with NO retry, so a single transient CDN denial reddened this
        # whole job — measured twice on 2026-08-12, `HTTP status=000` on `main`
        # and on #1406 (Q806). download-verified.sh retries and refuses to write
        # bytes that miss SYFT_SHA256, so the flake is absorbed without loosening
        # what runs. Mirrors publish.yml, which installs the same pinned syft.
        run: |
          set -euo pipefail
          # syft embeds the version WITHOUT the leading "v" in its asset names:
          # tag v1.45.1 -> syft_1.45.1_linux_amd64.tar.gz.
          asset="syft_${SYFT_VERSION#v}_linux_amd64.tar.gz"
          scripts/fetch/download-verified.sh \
            "https://github.com/anchore/syft/releases/download/${SYFT_VERSION}/${asset}" \
            "${SYFT_SHA256}" "${RUNNER_TEMP}/syft.tar.gz"
          tar -xzf "${RUNNER_TEMP}/syft.tar.gz" -C "${RUNNER_TEMP}" syft
          sudo install "${RUNNER_TEMP}/syft" /usr/local/bin/syft
          syft version
      # Generate an SPDX-JSON SBOM for the image we just built and upload it as a
      # build artifact. Runs right after the build (before the trivy scan) so a
      # CVE-induced scan failure never suppresses SBOM generation. This is the
      # PR-time exercise of the SBOM path; publish.yml regenerates the SBOM for
      # the pushed image and attaches it as a keyless cosign attestation.
      - name: generate SBOM for ${{ matrix.name }}
        # `docker:` scheme explicitly: the image was built with load: true and
        # exists only in the local daemon, never in a registry syft could fall
        # back to.
        run: |
          set -euo pipefail
          syft "docker:local/${{ matrix.name }}:scan" \
            -o "spdx-json=sbom-${{ matrix.name }}.spdx.json"
      - name: upload SBOM for ${{ matrix.name }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ matrix.name }}.spdx.json
          path: sbom-${{ matrix.name }}.spdx.json
          if-no-files-found: error
      # Cache trivy's data dir (vuln DB + scan cache) so each run avoids
      # re-pulling the ~50 MB DB from the registry — the DB pull is otherwise a
      # rate-limit flake source. The DB refreshes every few hours; the run_id
      # key always misses and writes a fresh entry, while restore-keys load the
      # most recent prior DB so a refresh is incremental, not a cold pull.
      - name: cache trivy data
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.trivy-cache
          key: trivy-data-${{ github.run_id }}
          restore-keys: |
            trivy-data-
      - name: trivy scan ${{ matrix.name }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_CACHE_DIR: ${{ github.workspace }}/.trivy-cache
        with:
          image-ref: local/${{ matrix.name }}:scan
          format: table
          # Only fixable HIGH/CRITICAL findings fail the gate. ignore-unfixed
          # drops CVEs with no released fix (nothing actionable in this repo).
          # exit-code is per-leg (1 = block, 0 = report-only); see the job note.
          # Mirrors `make trivy-scan` so local and CI verdicts match.
          exit-code: ${{ matrix.exit-code }}
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          vuln-type: os,library

  # polaris audits the Kubernetes security/best-practice posture of the SHIPPED
  # install artifact: it renders the Helm chart (digest-pinned, matching the
  # production posture) and checks the rendered manifests. The gate fails on
  # `danger` findings only (privileged, host namespaces, dangerous capabilities,
  # missing securityContext, a floating :latest image tag, …) — a real security
  # regression in the chart cannot merge. `warning`-level findings are reported
  # for visibility but do not block; the handful that are false positives against
  # a Helm-packaged operator chart are tuned to `ignore` in
  # charts/actions-gateway/polaris.yaml, each with a justifying comment.
  # `make polaris-scan` runs this exact gate locally so local and CI verdicts
  # match. CIS-benchmark (kube-bench) posture is cluster-level and runs against a
  # live node, not static manifests — see docs/operations/security-operations.md
  # for that operator runbook.
  polaris:
    needs: [changes]
    if: needs.changes.outputs.chart == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      # Pin the polaris release scanned. Bump deliberately (new checks can change
      # the verdict); keep in step with the version `make polaris-scan` expects.
      # Auto-bumped by updatecli.d/polaris.yaml (version + matching SHA256).
      POLARIS_VERSION: v10.2.0
      # SHA256 of the polaris linux/amd64 tarball for POLARIS_VERSION, taken from
      # the release's published checksums.txt (Q127). Release assets are mutable
      # for an existing tag; verify before trusting. Bump alongside POLARIS_VERSION.
      POLARIS_SHA256: c264fc682fe612732e8a97680451d6e5f6b6fb920936215d6bb9ef387c7eadce
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: install polaris
        run: |
          set -euo pipefail
          # v10+ embeds the version (without the leading "v") in the asset name:
          # tag v10.2.0 -> polaris_10.2.0_linux_amd64.tar.gz. Strip the "v" to
          # build the asset filename from the tag.
          asset="polaris_${POLARIS_VERSION#v}_linux_amd64.tar.gz"
          scripts/fetch/download-verified.sh \
            "https://github.com/FairwindsOps/polaris/releases/download/${POLARIS_VERSION}/${asset}" \
            "${POLARIS_SHA256}" "${RUNNER_TEMP}/polaris.tar.gz"
          tar -xzf "${RUNNER_TEMP}/polaris.tar.gz" -C "${RUNNER_TEMP}" polaris
          sudo install "${RUNNER_TEMP}/polaris" /usr/local/bin/polaris
          polaris version
      - name: polaris posture scan (gate on danger findings)
        run: make polaris-scan

  # Aggregate required-status gate. Mark THIS job's check context
  # (`security-scan-gate`) required in the branch ruleset — never the
  # individual path-gated jobs above, because a path-skip leaves them Pending and
  # blocks the merge forever. `needs: [trivy]` aggregates all matrix legs (its
  # result is failure if any leg failed). Passes only when every needed job
  # succeeded or was legitimately skipped. See docs/development/testing.md#path-gated-workflows-verify-the-heavy-gates-actually-ran.
  security-scan-gate:
    needs: [changes, govulncheck, trivy, polaris]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: require every gating job to have succeeded or skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          echo "needed job results: ${RESULTS}"
          for r in ${RESULTS}; do
            case "$r" in
              success | skipped) ;;
              *) echo "::error::a gating job concluded '${r}'"; exit 1 ;;
            esac
          done
