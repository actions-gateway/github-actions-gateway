name: manifest-validate

# Validates the SHIPPED install artifact so a malformed RBAC/CRD/policy file
# cannot merge silently (Q66). The Helm chart is the SOLE install path (Q142);
# there is no kustomize overlay to render. Two layers, run by
# `make manifest-validate` so local and CI verdicts match:
#   - yamllint: catches ill-formed/ill-formatted YAML in the controller-gen
#     manifests under cmd/*/config/** and the chart metadata.
#   - kubeconform: schema-validates the controller-gen manifests (the codegen +
#     envtest substrate) and `helm template` output in digest-pinned, dev/test
#     opt-out, and all-features form against the Kubernetes API, plus `helm lint`
#     on the chart itself and a fail-closed check that a render with any of the
#     four image digests (gmc/agc/proxy/wrapper) empty is REJECTED, so image
#     digest pinning cannot regress to fail-open (Q96, Q307). The chart
#     CRD/RBAC/webhook drift gates
#     (sync-chart-{crds,rbac,webhook}.sh --check) run first inside
#     `make manifest-validate`.
on:
  # No pull_request path filter: this workflow must trigger on EVERY PR so its
  # `gate` job always reports its required-status check (a path-skipped workflow
  # leaves the required check Pending and wedges the merge). Fine-grained
  # skipping happens inside via the `changes` job — see
  # docs/development/testing.md#path-gated-workflows-verify-the-heavy-gates-actually-ran.
  pull_request:
  # Merge queue: also run on the queue's candidate merge commit so the gate
  # reports its required check there — an unreporting required check wedges
  # the queue. paths-filter diffs merge_group events via git against the
  # event's base/head, so non-matching queue entries stay cheap.
  merge_group:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'

# Cancel superseded runs of this workflow on the same PR; pushes to main are
# never cancelled (each is a distinct post-merge gate). Mirrors unit-test.yml.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Fine-grained path gate. The coarse paths-ignore above still lets non-manifest
  # files (e.g. .gitignore) trigger this workflow, so classify the diff and skip
  # the validate job when nothing it covers changed. Mirrors security-scan.yml.
  # On push to main the job always runs.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      manifests: ${{ steps.filter.outcome == 'success' && steps.filter.outputs.manifests || 'true' }}
      promql: ${{ steps.filter.outcome == 'success' && steps.filter.outputs.promql || 'true' }}
      dashboards: ${{ steps.filter.outcome == 'success' && steps.filter.outputs.dashboards || 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        # paths-filter resolves the changed-file list through ONE un-retried
        # GitHub API call (@actions/github Octokit carries no retry plugin), so a
        # single transient 5xx fails this job and, with it, the gate. Survive it:
        # the job outputs below fail OPEN, running the gated jobs rather than
        # skipping them when the diff could not be classified (Q363).
        continue-on-error: true
        with:
          filters: |
            manifests:
              # The five v2 CRDs under api/config/crd/ are in
              # scripts/manifest/manifest-validate.sh's standalone_manifests list, but this
              # filter only knew about cmd/*/config — so a regenerated v2 CRD
              # skipped its own kubeconform+yamllint run until Q400. Scoped to
              # api/config/** (not all of api/**) to match cmd/*/config/**: a Go
              # type change that does not regenerate the YAML cannot break this
              # gate, and unit-test.yml's `code` filter already covers api/**.
              - 'api/config/**'
              - 'cmd/agc/config/**'
              - 'cmd/gmc/config/**'
              - 'charts/**'
              # The install doc's `mode=render` blocks name in-tree charts, and
              # `make getting-started-render-check` (a step in `validate` below)
              # renders them — so the doc and its parser are inputs to this gate
              # as much as the charts are (Q958).
              - 'docs/getting-started.md'
              - 'scripts/docs/doc-blocks.sh'
              # The shipped runner template library, yamllint'd by this gate as
              # hand-authored YAML an operator applies directly (Q554).
              - 'deploy/templates/**'
              # The shipped monitoring artifacts, for the same reason (Q827):
              # the reference PrometheusRule and the two Grafana dashboards
              # reached operators with nothing in CI having parsed them.
              - 'deploy/monitoring/**'
              # The Q408 registry pull-through cache: yamllint'd and
              # kubeconform'd by this gate as hand-authored operator YAML, and
              # a security surface — its NetworkPolicies are the untrusted-PR
              # workers' only registry path.
              - 'deploy/registry-mirror/**'
              # The consumer half of the same posture: the e2e tenant overlays
              # carry the ConfigMap wiring the job's image clients to those
              # mirrors, which `make registry-mirror-wiring-check` reconciles
              # against them (Q408 Phase 3).
              - 'deploy/dogfood-e2e/**'
              - '.yamllint.yaml'
              - 'Makefile'
              # scripts/manifest/ is exactly this gate's backends — the validator
              # plus the three chart-sync generators it drift-checks (Q571).
              # fetch/ installs the pinned kubeconform/yamllint binaries.
              - 'scripts/manifest/**'
              - 'scripts/fetch/**'
              - 'scripts/lib/**'
              - '.github/workflows/manifest-validate.yml'
            # The promql gate parses the shipped PrometheusRule and both Grafana
            # dashboards, and compares the rules against the two docs that
            # describe its alerts, so its trigger set spans both — the
            # `manifests` filter above deliberately covers neither doc. The
            # workflow's push-to-main trigger path-ignores docs/**, so a
            # docs-only edit reaches this gate on the PR rather than after the
            # merge; every change lands through one.
            promql:
              - 'deploy/monitoring/**'
              - 'docs/operations/observability-alerting.md'
              - 'docs/operations/runbook.md'
              - 'devtools/monitoring/**'
              - 'scripts/manifest/check-promql.sh'
              - 'tools/**'
              - 'Makefile'
              - '.github/workflows/manifest-validate.yml'
            # The render gate pairs each dashboard with the screenshot the docs
            # embed, so its trigger set is both sides of that pair (Q868). It
            # judges the branch's whole diff against the merge base, so the PNG
            # half has to trigger it too: a PR whose only later push is the
            # render must re-run and go green.
            dashboards:
              - 'deploy/monitoring/grafana-dashboard-*.json'
              - 'docs/assets/grafana-dashboard-*.png'
              - 'scripts/manifest/check-dashboard-render.py'
              - 'scripts/manifest/check-dashboard-render.sh'
              - 'Makefile'
              - 'mk/gate-lists.mk'
              - '.github/workflows/manifest-validate.yml'
      # A JS action reports failure only as an ::error:: annotation, so a rerun
      # that replaces the check run erases it — leaving a log that simply stops
      # after `Invoking listFiles` with no error anywhere (Q363). Say it plainly.
      - name: warn when change detection failed
        if: steps.filter.outcome == 'failure'
        run: echo "::warning::paths-filter could not classify the diff; assuming every filter matched so the gated jobs run"

  validate:
    needs: [changes]
    if: needs.changes.outputs.manifests == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      # Pinned tool versions. Bump deliberately (a new kubeconform can change
      # validation behaviour); keep in step with the versions
      # `make manifest-validate` is documented against in docs/development/testing.md.
      KUBECONFORM_VERSION: v0.6.7
      # SHA256 of kubeconform-linux-amd64.tar.gz for KUBECONFORM_VERSION (Q127).
      # Release assets are mutable for an existing tag; verify before trusting.
      # Bump this digest alongside KUBECONFORM_VERSION.
      KUBECONFORM_SHA256: 95f14e87aa28c09d5941f11bd024c1d02fdc0303ccaa23f61cef67bc92619d73
      YAMLLINT_VERSION: 1.37.1
      # Persist kubeconform's downloaded JSON schemas between runs so each run
      # does not re-fetch the schema set from GitHub (a rate-limit flake source).
      KUBECONFORM_CACHE: ${{ github.workspace }}/.kubeconform-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: install yamllint
        run: python3 -m pip install --user "yamllint==${YAMLLINT_VERSION}"
      - name: install kubeconform
        run: |
          set -euo pipefail
          scripts/fetch/download-verified.sh \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            "${KUBECONFORM_SHA256}" "${RUNNER_TEMP}/kubeconform.tar.gz"
          tar -xzf "${RUNNER_TEMP}/kubeconform.tar.gz" -C "${RUNNER_TEMP}" kubeconform
          sudo install "${RUNNER_TEMP}/kubeconform" /usr/local/bin/kubeconform
          kubeconform -v
      # Cache kubeconform's schema dir keyed on the validated Kubernetes version.
      # The schema set for a fixed version is immutable, so a hit makes the run
      # fully offline; the key changes only when MANIFEST_K8S_VERSION (pinned in
      # scripts/manifest/manifest-validate.sh) does.
      - name: cache kubeconform schemas
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.KUBECONFORM_CACHE }}
          key: kubeconform-schemas-1.30.0
      - name: validate install artifact
        run: |
          set -euo pipefail
          mkdir -p "${KUBECONFORM_CACHE}"
          export PATH="${HOME}/.local/bin:${PATH}"  # pip --user yamllint
          make manifest-validate
      # The helm half of the install-doc gate (Q958). It belongs in this job
      # rather than a job of its own because it renders a chart, which is what
      # this job already installs helm for; the offline half of the same gate
      # runs in doc-links.yml, where `make check` can reach it tool-free.
      - name: install-doc helm blocks render (make getting-started-render-check)
        run: make getting-started-render-check
      # Reconcile the Q408 registry mirrors with the e2e tenant's wiring to them
      # (Q408 Phase 3). A step here rather than a job of its own: this job is
      # already the one that reads deploy/registry-mirror/**, and the check needs
      # only python3 — no helm, no kubeconform, no git history.
      - name: mirrors and their wiring name one endpoint set (make registry-mirror-wiring-check)
        run: make registry-mirror-wiring-check
      # The other half of the same tree's posture (Q1022): every mirror instance
      # behind the proxy that refuses GET /v2/_catalog, with its registry on
      # loopback. Same job for the same reason — it reads deploy/registry-mirror/**
      # already, and the check needs only python3.
      - name: every mirror is fronted by the catalog deny (make registry-mirror-catalog-deny-check)
        run: make registry-mirror-catalog-deny-check
      # The same tree's third question, and the one only a render can answer
      # (Q1024): nothing rendered the four `kubectl apply -k` targets, so a
      # kustomization.yaml that does not build reached the operator's cluster
      # before it reached CI. Same job again — it already reads
      # deploy/registry-mirror/**, and kubectl is on the hosted image
      # (measured: run 33230881190's template-library step printed its success
      # line with no skip note).
      #
      # Invoked directly rather than through `make registry-mirror-render-check`
      # so it can pass --require-render: the gate degrades to a printed skip
      # without kubectl, which `make check` needs (kubectl is e2e-tier) and CI
      # must not have — a runner that lost kubectl would leave this green while
      # checking nothing, the shape the gate exists to close.
      - name: every registry-mirror kustomize target renders (registry-mirror-render-check)
        run: scripts/manifest/check-registry-mirror-render.sh --require-render

  # Parse the shipped PromQL — the rule file's expressions and both dashboards'
  # panel queries (Q910) — and reconcile the alert rules with the docs that
  # describe them (Q827; Q831 wired it). Its own job rather than a step in
  # `validate`: that job installs helm, kubeconform and yamllint to answer a
  # different question, and this one needs none of them — only Go, to build
  # .build/promqlcheck from devtools/. Every failure it catches is silent, so
  # the verdict has to be readable on its own.
  promql:
    needs: [changes]
    if: needs.changes.outputs.promql == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
      - name: PromQL parses in the rules and the dashboards, and matches its docs (make promql-check)
        run: make promql-check

  # A dashboard change must ship the screenshot the docs embed (Q868). Its own
  # job rather than a step in `validate`: that one installs helm, kubeconform and
  # yamllint to answer a different question, and this needs none of them — only
  # git history. fetch-depth: 0 is the requirement, and the reason it cannot be a
  # step there: the gate judges the branch's whole diff against the merge base
  # with origin/main, which a shallow checkout does not carry. Same shape as the
  # backlog store rules in status-lint.yml.
  dashboard-render:
    needs: [changes]
    if: needs.changes.outputs.dashboards == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: dashboards ship their screenshots (make dashboard-render-check)
        run: make dashboard-render-check

  # Aggregate required-status gate. Mark THIS job's check context
  # (`manifest-validate-gate`) required in the branch ruleset — never the
  # path-gated jobs above, because a path-skip leaves them Pending and blocks the
  # merge forever. Passes only when every needed job succeeded or was
  # legitimately skipped. See docs/development/testing.md#path-gated-workflows-verify-the-heavy-gates-actually-ran.
  manifest-validate-gate:
    needs: [changes, validate, promql, dashboard-render]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      # `always()` above makes a skipped need a pass, by design — so a green
      # gate reads the same whether the jobs it guards ran or never started, and
      # the check UI has nowhere to say which (Q872 gave the two e2e lanes this;
      # Q898 the rest). Ordered before the gate step so a failing gate still
      # reports. Narration only: the required check is unchanged.
      #
      # Driven off `toJSON(needs)` rather than a hand-written env var per job, so
      # a job added to `needs:` above appears here without a second edit — the
      # kind of drift the gate lists themselves keep acquiring.
      - name: say which gated jobs ran
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          # Backticks inside the single-quoted jq programs are markdown code
          # spans for the rendered summary, not command substitution.
          # shellcheck disable=SC2016
          {
            printf -- '### %s: which gated jobs ran\n\n' "${GITHUB_WORKFLOW}"
            printf -- '| job | result |\n| --- | --- |\n'
            jq -r 'to_entries | .[] | select(.key != "changes")
                   | "| `\(.key)` | \(.value.result) |"' <<<"${NEEDS}"
            if jq -e 'to_entries | any(.key != "changes" and .value.result == "skipped")' \
                >/dev/null <<<"${NEEDS}"; then
              printf -- '\n%s\n' 'A `skipped` job is a path-skip, **not** a pass — this gate counts it as one so the required check can report. A green gate here is not a verdict on the skipped rows above.'
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
      - name: require every gating job to have succeeded or skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          echo "needed job results: ${RESULTS}"
          for r in ${RESULTS}; do
            case "$r" in
              success | skipped) ;;
              *) echo "::error::a gating job concluded '${r}'"; exit 1 ;;
            esac
          done
