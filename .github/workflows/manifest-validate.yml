name: manifest-validate

# Validates the SHIPPED install artifact so a malformed RBAC/CRD/policy file
# cannot merge silently (Q66). The Helm chart is the SOLE install path (Q142);
# there is no kustomize overlay to render. Two layers, run by
# `make manifest-validate` so local and CI verdicts match:
#   - yamllint: catches ill-formed/ill-formatted YAML in the controller-gen
#     manifests under cmd/*/config/** and the chart metadata.
#   - kubeconform: schema-validates the controller-gen manifests (the codegen +
#     envtest substrate) and `helm template` output in digest-pinned, dev/test
#     opt-out, and all-features form against the Kubernetes API, plus `helm lint`
#     on the chart itself and a fail-closed check that a render with any of the
#     four image digests (gmc/agc/proxy/wrapper) empty is REJECTED, so image
#     digest pinning cannot regress to fail-open (Q96, Q307). The chart
#     CRD/RBAC/webhook drift gates
#     (sync-chart-{crds,rbac,webhook}.sh --check) run first inside
#     `make manifest-validate`.
on:
  # No pull_request path filter: this workflow must trigger on EVERY PR so its
  # `gate` job always reports its required-status check (a path-skipped workflow
  # leaves the required check Pending and wedges the merge). Fine-grained
  # skipping happens inside via the `changes` job — see
  # docs/development/testing.md#path-gated-workflows-verify-the-heavy-gates-actually-ran.
  pull_request:
  # Merge queue: also run on the queue's candidate merge commit so the gate
  # reports its required check there — an unreporting required check wedges
  # the queue. paths-filter diffs merge_group events via git against the
  # event's base/head, so non-matching queue entries stay cheap.
  merge_group:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'

# Cancel superseded runs of this workflow on the same PR; pushes to main are
# never cancelled (each is a distinct post-merge gate). Mirrors unit-test.yml.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Fine-grained path gate. The coarse paths-ignore above still lets non-manifest
  # files (e.g. .gitignore) trigger this workflow, so classify the diff and skip
  # the validate job when nothing it covers changed. Mirrors security-scan.yml.
  # On push to main the job always runs.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      manifests: ${{ steps.filter.outcome == 'success' && steps.filter.outputs.manifests || 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        # paths-filter resolves the changed-file list through ONE un-retried
        # GitHub API call (@actions/github Octokit carries no retry plugin), so a
        # single transient 5xx fails this job and, with it, the gate. Survive it:
        # the job outputs below fail OPEN, running the gated jobs rather than
        # skipping them when the diff could not be classified (Q363).
        continue-on-error: true
        with:
          filters: |
            manifests:
              # The five v2 CRDs under api/config/crd/ are in
              # scripts/manifest/manifest-validate.sh's standalone_manifests list, but this
              # filter only knew about cmd/*/config — so a regenerated v2 CRD
              # skipped its own kubeconform+yamllint run until Q400. Scoped to
              # api/config/** (not all of api/**) to match cmd/*/config/**: a Go
              # type change that does not regenerate the YAML cannot break this
              # gate, and unit-test.yml's `code` filter already covers api/**.
              - 'api/config/**'
              - 'cmd/agc/config/**'
              - 'cmd/gmc/config/**'
              - 'charts/**'
              - '.yamllint.yaml'
              - 'Makefile'
              # scripts/manifest/ is exactly this gate's backends — the validator
              # plus the three chart-sync generators it drift-checks (Q571).
              # fetch/ installs the pinned kubeconform/yamllint binaries.
              - 'scripts/manifest/**'
              - 'scripts/fetch/**'
              - 'scripts/lib/**'
              - '.github/workflows/manifest-validate.yml'
      # A JS action reports failure only as an ::error:: annotation, so a rerun
      # that replaces the check run erases it — leaving a log that simply stops
      # after `Invoking listFiles` with no error anywhere (Q363). Say it plainly.
      - name: warn when change detection failed
        if: steps.filter.outcome == 'failure'
        run: echo "::warning::paths-filter could not classify the diff; assuming every filter matched so the gated jobs run"

  validate:
    needs: [changes]
    if: needs.changes.outputs.manifests == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      # Pinned tool versions. Bump deliberately (a new kubeconform can change
      # validation behaviour); keep in step with the versions
      # `make manifest-validate` is documented against in docs/development/testing.md.
      KUBECONFORM_VERSION: v0.6.7
      # SHA256 of kubeconform-linux-amd64.tar.gz for KUBECONFORM_VERSION (Q127).
      # Release assets are mutable for an existing tag; verify before trusting.
      # Bump this digest alongside KUBECONFORM_VERSION.
      KUBECONFORM_SHA256: 95f14e87aa28c09d5941f11bd024c1d02fdc0303ccaa23f61cef67bc92619d73
      YAMLLINT_VERSION: 1.37.1
      # Persist kubeconform's downloaded JSON schemas between runs so each run
      # does not re-fetch the schema set from GitHub (a rate-limit flake source).
      KUBECONFORM_CACHE: ${{ github.workspace }}/.kubeconform-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: install yamllint
        run: python3 -m pip install --user "yamllint==${YAMLLINT_VERSION}"
      - name: install kubeconform
        run: |
          set -euo pipefail
          scripts/fetch/download-verified.sh \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            "${KUBECONFORM_SHA256}" "${RUNNER_TEMP}/kubeconform.tar.gz"
          tar -xzf "${RUNNER_TEMP}/kubeconform.tar.gz" -C "${RUNNER_TEMP}" kubeconform
          sudo install "${RUNNER_TEMP}/kubeconform" /usr/local/bin/kubeconform
          kubeconform -v
      # Cache kubeconform's schema dir keyed on the validated Kubernetes version.
      # The schema set for a fixed version is immutable, so a hit makes the run
      # fully offline; the key changes only when MANIFEST_K8S_VERSION (pinned in
      # scripts/manifest/manifest-validate.sh) does.
      - name: cache kubeconform schemas
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.KUBECONFORM_CACHE }}
          key: kubeconform-schemas-1.30.0
      - name: validate install artifact
        run: |
          set -euo pipefail
          mkdir -p "${KUBECONFORM_CACHE}"
          export PATH="${HOME}/.local/bin:${PATH}"  # pip --user yamllint
          make manifest-validate

  # Aggregate required-status gate. Mark THIS job's check context
  # (`manifest-validate-gate`) required in the branch ruleset — never the
  # path-gated jobs above, because a path-skip leaves them Pending and blocks the
  # merge forever. Passes only when every needed job succeeded or was
  # legitimately skipped. See docs/development/testing.md#path-gated-workflows-verify-the-heavy-gates-actually-ran.
  manifest-validate-gate:
    needs: [changes, validate]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: require every gating job to have succeeded or skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          echo "needed job results: ${RESULTS}"
          for r in ${RESULTS}; do
            case "$r" in
              success | skipped) ;;
              *) echo "::error::a gating job concluded '${r}'"; exit 1 ;;
            esac
          done
