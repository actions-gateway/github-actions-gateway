# Reusable e2e job, parameterized by CNI. Two callers drive it:
#   - e2e-test.yml   — per-PR / push-to-main, KIND_CNI=kindnet (the default).
#   - e2e-calico.yml — KIND_CNI=calico (egress-enforcing profile; activates the
#                      NetworkPolicy-enforcement specs that self-skip on kindnet).
#                      Runs per-PR on NetworkPolicy/proxy-affecting paths, on
#                      push to main for the same paths, and on manual dispatch
#                      (Q119). The calico path additionally pre-pulls + caches the
#                      Calico images (see the steps below).
# Keeping the cluster/image/test plumbing here means a kind bump, image-tag
# change, or flake mitigation is made once and both lanes inherit it (no drift
# between two near-identical ~300-line workflows).
name: e2e (reusable)

on:
  workflow_call:
    inputs:
      kind_cni:
        description: 'CNI to install in the kind cluster: kindnet (kind default) or calico (egress-enforcing).'
        type: string
        default: kindnet
      runner:
        description: 'JSON-encoded runs-on for the e2e job (e.g. ''"gag-ci-e2e"''), same encoding as vars.GAG_E2E_RUNNER. Overrides the variable for THIS run only — the release gate routes its dispatched run here so no repo-wide routing window exists. Empty falls through to the variable, then ubuntu-latest.'
        type: string
        default: ''
      timeout_minutes:
        description: 'Job timeout in minutes. Calico bring-up (image pulls from quay + calico-node rollout) needs more headroom than kindnet. The default covers the kindnet lane plus the three post-suite chart checks (upgrade, reinstall, released-upgrade).'
        type: number
        default: 50
      chart_upgrade_check:
        description: 'Run the day-2 `helm upgrade` check after the suite (Q475). CNI-independent, so only one lane needs to pay for it.'
        type: boolean
        default: true
      chart_reinstall_check:
        description: 'Run the day-2 uninstall/reinstall check after the suite (Q444/Q492). Destroys and recreates the release, so it runs after the upgrade check.'
        type: boolean
        default: true
      released_upgrade_check:
        description: 'Run the released-chart upgrade check after the suite (Q507): install the last released chart from GHCR, upgrade it to HEAD along the documented path. Replaces the live release, so it runs last. CNI-independent, so only one lane needs to pay for it.'
        type: boolean
        default: true

jobs:
  e2e:
    # Routing precedence: the caller's run-scoped `runner` input (the release
    # gate's dispatch — routes ONE run with no repo-wide window), then
    # vars.GAG_E2E_RUNNER (the opt-in standing window, Q231 / runbook Part F2),
    # then GitHub-hosted. Mirrors the GAG_RUNNER wiring on unit-test.yml /
    # integration-test.yml.
    runs-on: ${{ fromJSON(inputs.runner || vars.GAG_E2E_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    permissions:
      contents: read

    env:
      # The CNI to build the kind cluster with, threaded to `make e2e-cluster`
      # as a make argument below. Trusted enum (kindnet|calico) validated by
      # scripts/e2e/kind-with-registry.sh; surfaced as an env var rather than
      # interpolated into a run: script directly (no script-injection surface).
      KIND_CNI: ${{ inputs.kind_cni }}
      # Calico release for the egress-enforcing profile (KIND_CNI=calico).
      # Auto-bumped in lockstep with the root Makefile's CALICO_VERSION by
      # updatecli (updatecli.d/calico.yaml), so the two copies cannot drift. Used
      # to (a) key the
      # Calico image cache and pre-pull below and (b) pin the version passed to
      # `make e2e-cluster`, so the pre-pulled images match what the manifest
      # references. Ignored on the kindnet caller.
      CALICO_VERSION: v3.31.5
      # cert-manager release applied on every e2e run (both CNIs). Keep in sync
      # with CERTMANAGER_VERSION in cmd/gmc/Makefile. Used to key the image cache
      # and pin the manifest the pre-pull step reads, so the images kind-loaded
      # onto the nodes match what `make apply-cert-manager` applies.
      CERTMANAGER_VERSION: v1.20.2
      # metrics-server release applied on every e2e run (both CNIs) to back the
      # HPA specs. Keep in sync with metricsServerVersion in
      # cmd/gmc/test/e2e/e2e_suite_test.go (the suite applies the pinned
      # components.yaml from this tag). Used to key the image cache and pin the
      # manifest the pre-pull step reads, so the metrics-server image kind-loaded
      # onto the nodes matches what the suite applies — kubelet never pulls it
      # from registry.k8s.io at test time (Q150).
      METRICSSERVER_VERSION: v0.8.1
      # kind release, pinned (not @latest) for reproducibility. KIND_NODE_IMAGE
      # is digest-pinned to the node image kind v0.32.0 ships for K8s v1.35.5 so
      # the cluster's K8s version is deterministic and the image is cacheable by
      # a stable key. KIND_VERSION + KIND_BINARY_SHA256 are bumped together
      # automatically by updatecli (updatecli.d/kind.yaml); KIND_NODE_IMAGE is
      # reviewed and bumped by hand in that PR when the tested Kubernetes version
      # should move (see docs/development/dependency-updates.md).
      KIND_VERSION: v0.32.0
      KIND_BINARY_SHA256: 50030de23cf40a18505f20426f6a8506bedf13c6e509244bd1fa9463721b0f54
      KIND_NODE_IMAGE: kindest/node:v1.35.5@sha256:ce977ae6d65918d0b58a5f8b5e940429c2ce42fa3a5619ec2bbc60b949c0ac95
      # All six images live in the local registry the e2e-cluster target
      # stands up. SHA-suffixed so kubelet's IfNotPresent cache cannot serve a
      # stale image across runs that reuse the cluster. The full ${{ github.sha }}
      # is used here (not the Makefile's short SHA default) so the tags match
      # the ones the bake step pushes — leaving any of these unset would let
      # the Makefile default to its short-SHA tag and the lookup would miss.
      # The registry host is the literal IPv4 loopback, not "localhost": the
      # registry is published IPv4-only, and a buildx/docker pusher that resolves
      # "localhost" to IPv6 [::1] first fails intermittently with "connection
      # refused". Must match docker-bake.hcl's IMAGE_REGISTRY default and the
      # containerd certs.d host dir in scripts/e2e/kind-with-registry.sh.
      GMC_IMG: 127.0.0.1:5000/gmc:e2e-${{ github.sha }}
      AGC_IMG: 127.0.0.1:5000/agc:e2e-${{ github.sha }}
      PROXY_IMG: 127.0.0.1:5000/proxy:e2e-${{ github.sha }}
      FAKEGITHUB_IMG: 127.0.0.1:5000/fakegithub:e2e-${{ github.sha }}
      WORKER_IMG: 127.0.0.1:5000/worker:e2e-${{ github.sha }}
      WRAPPER_IMG: 127.0.0.1:5000/wrapper:e2e-${{ github.sha }}
      # The curl-based test pods (proxy connectivity, cross-tenant isolation,
      # metrics scrape) otherwise pull curlimages/curl live from Docker Hub on
      # the kind nodes, which flakes under Hub anonymous rate limits (HTTP 429).
      # Mirror it into the local registry once and point the suite at that ref
      # via E2E_CURL_IMAGE so kubelet never touches Docker Hub. Bump the pinned
      # upstream tag and the mirror tag together.
      E2E_CURL_UPSTREAM: curlimages/curl:8.10.1
      E2E_CURL_IMAGE: 127.0.0.1:5000/curlimages/curl:8.10.1
      # The workload-identity (Q201) e2e stands up an in-cluster TEST Vault (dev
      # mode, no real credentials) for the no-PEM round-trip. Mirror the upstream
      # image into the local registry like curl so the kind nodes never pull from
      # Docker Hub (429 flakes). Bump the pinned upstream and mirror tags together.
      E2E_VAULT_UPSTREAM: hashicorp/vault:1.18.3
      E2E_VAULT_IMAGE: 127.0.0.1:5000/hashicorp/vault:1.18.3
      # The buildkit image docker/setup-buildx-action boots its docker-container
      # builder from. Named here so the pre-pull step and the builder pin below
      # reference one source. DIGEST-PINNED (Q151): the buildx-stable-1 tag
      # floats, so an unpinned reference would let the builder change underfoot
      # between runs. Pin by digest, kept in step with the security-scan and
      # publish workflows by updatecli.d/buildkit.yaml.
      BUILDKIT_IMAGE: moby/buildkit:buildx-stable-1@sha256:0168606be2315b7c807a03b3d8aa79beefdb31c98740cebdffdfeebf31190c9f

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Start freeing runner disk space
        # Drops the preinstalled toolchains this job never touches (~15–20 GB)
        # so the bake + kind-load peak cannot hit ENOSPC (Q292 — see
        # scripts/e2e/free-runner-disk.sh for the full disk-pressure story).
        #
        # Detached, not serial: nothing between here and the image build needs
        # the headroom, so the deletions overlap with the toolchain setup and
        # cache restores below instead of costing 17–61 s of critical path on
        # their own. The "Wait for the disk cleanup" step just before the bake
        # is what makes that safe — it blocks on the sentinel and falls back to
        # a synchronous run if this one never finished.
        #
        # Hosted-only: a self-hosted runner (GAG_E2E_RUNNER) owns its own image
        # and won't have these dirs.
        if: runner.environment == 'github-hosted'
        env:
          DONE_SENTINEL: /tmp/free-runner-disk.done
        run: |
          set -euo pipefail
          rm -f "${DONE_SENTINEL}"
          # setsid detaches from this step's process group so the runner tearing
          # the step down cannot take the cleanup with it.
          setsid scripts/e2e/free-runner-disk.sh >/tmp/free-runner-disk.log 2>&1 &
          echo "started disk cleanup in the background (pid $!)"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work

      # The e2e suite deploys the GMC via `helm upgrade --install` of
      # charts/actions-gateway (Q142 — Helm is the sole install path), so helm
      # must be on PATH. Pinned via the same action manifest-validate.yml uses.
      #
      # Hosted-only: the self-hosted e2e runner image bakes helm
      # (scripts/dogfood/e2e-runner/Dockerfile), and this action downloads from
      # get.helm.sh — job-time egress the managed GitHub rule does not admit.
      # The Kata untrusted-PR posture keeps the self-hosted lane's non-registry
      # fetches GitHub-only (Q408).
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        if: runner.environment == 'github-hosted'

      - name: Install kind ${{ env.KIND_VERSION }}
        # Pinned release binary + checksum instead of `go install ...@latest`:
        # ~20-40s faster (no compile), reproducible, and integrity-checked.
        run: |
          # download-verified.sh retries a transient GitHub releases CDN error
          # (observed: curl 22 / HTTP 504, HTTP 403) in-step instead of failing
          # the run, and gates on KIND_BINARY_SHA256 before anything lands at
          # the output path.
          scripts/fetch/download-verified.sh \
            "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64" \
            "${KIND_BINARY_SHA256}" /tmp/kind
          sudo install -m 0755 /tmp/kind /usr/local/bin/kind
          kind version

      - name: Pre-pull buildkit builder image
        # docker/setup-buildx-action boots its docker-container builder from
        # ${BUILDKIT_IMAGE}, pulled from Docker Hub (registry-1.docker.io) with
        # no retry of its own — a timeout/rate-limit flake (observed: "net/http:
        # request canceled (Client.Timeout exceeded while awaiting headers)").
        # Pre-pull it here with retries so the buildx boot below finds it already
        # in the local image cache and never touches Hub. Routing it through the
        # e2e local registry would not help: that registry isn't up yet at this
        # point, and seeding it would still require this same one Hub pull — so a
        # retried runner-side pull is the simpler equivalent. Nor does this job
        # carry the tar cache the security-scan trivy job gained in Q460: that
        # cache exists to collapse six matrix shards pulling at once, and this is
        # a single pull. The exponential, jittered retry schedule covers it.
        run: scripts/fetch/pull-image-with-retry.sh "${BUILDKIT_IMAGE}"

      - name: Configure buildkit registry mirrors
        # Q408 Phase 3. buildkit is the one image client that reads neither
        # dockerd's registry-mirrors nor a rewritten ref: its base images are
        # named in the Dockerfile. REGISTRY_MIRRORS comes from the worker's own
        # environment on the dogfood Kata lane (the tenant's
        # registry-mirror-wiring ConfigMap), so this is a no-op everywhere else:
        # the output is empty, which is falsy in the action, so no --config
        # reaches `docker buildx create`.
        #
        # It cannot be an `env` context expression: the variable is set on the
        # runner process by the cluster, and the `env` context holds only what a
        # workflow declares.
        id: buildkit-mirrors
        run: |
          set -euo pipefail
          config="$(scripts/e2e/buildkitd-mirror-config.sh /tmp/buildkitd.toml)"
          echo "config=${config}" >> "$GITHUB_OUTPUT"
          if [[ -n "${config}" ]]; then
            echo "buildkit will resolve these registries through the in-cluster mirror:"
            cat "${config}"
          else
            echo "no REGISTRY_MIRRORS configured; buildkit resolves upstream directly"
          fi

      - name: Prove the worker's egress is mirror-only
        # Q408 Phase 4. The Kata overlay ships no additive egress policy, so a
        # worker on the dogfood lane reaches cluster DNS, GitHub and the
        # in-cluster mirrors and nothing else. This is what says so: three
        # destinations that must NOT answer, each paired with a control that
        # must, since a battery of unreachable checks passes identically on a
        # worker with no network at all.
        #
        # It runs on every run rather than once, because the posture is a
        # property to hold rather than a milestone to reach: a policy that stops
        # selecting the worker is invisible in a green suite.
        #
        # No `if:` — the script reads REGISTRY_MIRRORS, which only the dogfood
        # Kata tenant sets, and reports a skip everywhere else. A step condition
        # cannot express that: the variable is set on the runner process by the
        # cluster, and the `env` context holds only what a workflow declares.
        # Placed before the build so a lost posture fails here rather than after
        # the suite; each blocked probe spends its whole timeout, so this step
        # is minutes rather than seconds even when everything holds.
        run: scripts/e2e/egress-negatives.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          # image pins the builder to the buildkit image pre-pulled above so the
          # boot uses the local cache instead of pulling from Docker Hub.
          # network=host so the docker-container builder can push to the
          # registry container published on the runner's 127.0.0.1:5000, and so
          # the builder resolves the mirror's in-cluster DNS name.
          driver-opts: |
            image=${{ env.BUILDKIT_IMAGE }}
            network=host
          # `buildkitd-config`, not `config`: v4 renamed it, and this action
          # ignores an input it does not declare — a silent no-op, which is the
          # one failure this wiring cannot afford.
          buildkitd-config: ${{ steps.buildkit-mirrors.outputs.config }}

      - name: Cache kind node image
        # The node image (~1 GB) is otherwise pulled from Docker Hub on every
        # run, which is both slow and a flake source under Hub rate limits.
        # Keyed on the digest-pinned image so a kind bump invalidates it.
        #
        # Every actions/cache step in this job is hosted-only: the Actions cache
        # data plane is job-time egress the managed GitHub rule does not admit,
        # and the Kata untrusted-PR posture keeps the self-hosted lane's
        # non-registry fetches GitHub-only (Q408). The load/pull steps below
        # already fall back to a retried upstream pull when no tar is present;
        # the in-cluster registry mirror is what serves these warm on that lane.
        if: runner.environment == 'github-hosted'
        id: kind-node-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/kind-node-image
          key: kind-node-${{ env.KIND_NODE_IMAGE }}

      - name: Load or pull kind node image
        run: |
          tar=/tmp/kind-node-image/node.tar
          node_tag="${KIND_NODE_IMAGE%@*}"                                  # kindest/node:vX.Y.Z
          node_digest_ref="${KIND_NODE_IMAGE%%:*}@${KIND_NODE_IMAGE##*@}"   # kindest/node@sha256:...
          if [[ -f "$tar" ]]; then
            echo "==> loading kind node image from cache"
            docker load -i "$tar"
          else
            # Retried: this is the cold path on every self-hosted run (the cache
            # step above is hosted-only) and on a hosted cache miss.
            echo "==> pulling kind node image ${KIND_NODE_IMAGE}"
            scripts/fetch/pull-image-with-retry.sh "${KIND_NODE_IMAGE}"
            # `docker pull name:tag@digest` stores the image under the digest ref
            # only, not the tag — re-tag so it can be saved by (and on a later run
            # loaded/used as) the tag-only ref kind is given.
            docker tag "$node_digest_ref" "$node_tag"
            mkdir -p /tmp/kind-node-image
            docker save -o "$tar" "$node_tag"
          fi

      - name: Start local image registry
        # Up front so the background image build below can push to it while the
        # kind cluster is still being created.
        run: make e2e-registry

      - name: Cache curl test image
        # Avoids even the single runner-side Docker Hub pull on warm runs.
        # Keyed on the pinned upstream tag so a curl bump invalidates it.
        # Hosted-only — see the kind node cache step (Q408).
        if: runner.environment == 'github-hosted'
        id: curl-image-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/curl-image
          key: curl-image-${{ env.E2E_CURL_UPSTREAM }}

      - name: Mirror curl test image into local registry
        # The e2e curl-based test pods otherwise pull curlimages/curl live from
        # Docker Hub on the kind nodes, which flakes under Hub anonymous rate
        # limits (HTTP 429). Pull once on the runner (cached) and push to the
        # local registry the kind nodes already resolve, so kubelet never
        # touches Docker Hub. Retried because the cold-cache pull is the one
        # remaining Hub touch.
        run: |
          set -euo pipefail
          tar=/tmp/curl-image/curl.tar
          if [[ -f "$tar" ]]; then
            echo "==> loading curl image from cache"
            docker load -i "$tar"
          else
            echo "==> pulling ${E2E_CURL_UPSTREAM}"
            PULL_RETRY_ATTEMPTS=3 PULL_RETRY_DELAY=15 \
              scripts/fetch/pull-image-with-retry.sh "${E2E_CURL_UPSTREAM}"
            mkdir -p /tmp/curl-image
            docker save -o "$tar" "${E2E_CURL_UPSTREAM}"
          fi
          docker tag "${E2E_CURL_UPSTREAM}" "${E2E_CURL_IMAGE}"
          docker push "${E2E_CURL_IMAGE}"

      - name: Cache Vault test image
        # The workload-identity e2e's in-cluster test Vault. Keyed on the pinned
        # upstream tag so a Vault bump invalidates it.
        # Hosted-only — see the kind node cache step (Q408).
        if: runner.environment == 'github-hosted'
        id: vault-image-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/vault-image
          key: vault-image-${{ env.E2E_VAULT_UPSTREAM }}

      - name: Mirror Vault test image into local registry
        # Same Docker-Hub-429 avoidance as the curl mirror above: pull once on the
        # runner (cached) and push to the local registry the kind nodes resolve.
        run: |
          set -euo pipefail
          tar=/tmp/vault-image/vault.tar
          if [[ -f "$tar" ]]; then
            echo "==> loading vault image from cache"
            docker load -i "$tar"
          else
            echo "==> pulling ${E2E_VAULT_UPSTREAM}"
            PULL_RETRY_ATTEMPTS=3 PULL_RETRY_DELAY=15 \
              scripts/fetch/pull-image-with-retry.sh "${E2E_VAULT_UPSTREAM}"
            mkdir -p /tmp/vault-image
            docker save -o "$tar" "${E2E_VAULT_UPSTREAM}"
          fi
          docker tag "${E2E_VAULT_UPSTREAM}" "${E2E_VAULT_IMAGE}"
          docker push "${E2E_VAULT_IMAGE}"

      - name: Cache Calico images
        # Calico-only. Keyed on CALICO_VERSION so a Calico bump invalidates it.
        # Hosted-only — see the kind node cache step (Q408).
        if: inputs.kind_cni == 'calico' && runner.environment == 'github-hosted'
        id: calico-image-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/calico-images
          key: calico-images-${{ env.CALICO_VERSION }}

      - name: Pre-pull Calico images
        # Calico-only. The Calico manifest pulls calico/node, calico/cni, and
        # calico/kube-controllers from quay.io/docker.io on every node during
        # install — the dominant flake/latency source on this CNI's bring-up.
        # Those pulls happen *before* the local registry is wired into the nodes,
        # so they cannot be mirrored like the curl image. Instead pre-pull the
        # exact image refs the pinned manifest references into the runner's Docker
        # daemon here (cached + retried); scripts/e2e/kind-with-registry.sh then
        # kind-loads whatever is present onto the nodes, so the rollout never
        # touches quay.io. The image list is extracted from the same manifest the
        # script applies, so the two always agree.
        if: inputs.kind_cni == 'calico'
        run: |
          scripts/fetch/prepull-manifest-images.sh calico \
            "https://raw.githubusercontent.com/projectcalico/calico/${CALICO_VERSION}/manifests/calico.yaml" \
            /tmp/calico-images

      - name: Cache cert-manager images
        # Both CNIs: cert-manager is applied on every e2e run. Keyed on
        # CERTMANAGER_VERSION so a bump invalidates it. The cached dir holds the
        # image tar and the image list, so a hit needs no manifest fetch.
        # Hosted-only — see the kind node cache step (Q408).
        if: runner.environment == 'github-hosted'
        id: cert-manager-image-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/cert-manager-images
          key: cert-manager-images-${{ env.CERTMANAGER_VERSION }}

      - name: Pre-pull cert-manager images
        # Both CNIs. `make apply-cert-manager` (in the cluster step below) makes
        # kubelet pull the cert-manager controller/webhook/cainjector images from
        # quay.io on the nodes, and that rollout is then waited on — squarely on
        # the critical path. Pre-pull the exact refs the pinned manifest
        # references into the runner's Docker daemon here (cached + retried); the
        # cluster step then kind-loads them onto the nodes so the rollout never
        # touches quay.io. The image list is persisted alongside the tar so the
        # load step needs neither a manifest fetch nor a re-extract.
        run: |
          scripts/fetch/prepull-manifest-images.sh cert-manager \
            "https://github.com/cert-manager/cert-manager/releases/download/${CERTMANAGER_VERSION}/cert-manager.yaml" \
            /tmp/cert-manager-images

      - name: Cache metrics-server image
        # Both CNIs: the e2e suite installs metrics-server on every run to back
        # the HPA specs. Keyed on METRICSSERVER_VERSION so a bump invalidates it.
        # The cached dir holds the image tar and the image list, so a hit needs
        # no manifest fetch.
        # Hosted-only — see the kind node cache step (Q408).
        if: runner.environment == 'github-hosted'
        id: metrics-server-image-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/metrics-server-images
          key: metrics-server-images-${{ env.METRICSSERVER_VERSION }}

      - name: Pre-pull metrics-server image
        # Both CNIs. The e2e suite applies the pinned metrics-server
        # components.yaml itself (setupMetricsServer), which makes kubelet pull
        # the metrics-server image from registry.k8s.io on the nodes — an
        # uncached pull squarely on the test critical path. Pre-pull the exact
        # ref the pinned manifest references into the runner's Docker daemon here
        # (cached + retried); the preload step below kind-loads it onto the nodes
        # so the suite's apply never makes kubelet touch registry.k8s.io. The
        # image list is persisted alongside the tar so the load step needs
        # neither a manifest fetch nor a re-extract. Keep METRICSSERVER_VERSION in
        # sync with metricsServerVersion in cmd/gmc/test/e2e/e2e_suite_test.go.
        run: |
          scripts/fetch/prepull-manifest-images.sh metrics-server \
            "https://github.com/kubernetes-sigs/metrics-server/releases/download/${METRICSSERVER_VERSION}/components.yaml" \
            /tmp/metrics-server-images

      - name: Wait for the disk cleanup to finish
        # The barrier for the detached cleanup started at the top of the job.
        # Everything above this point is light on disk; everything below —
        # the bake's six images and the kind-load of the preloaded manifests —
        # is exactly what tipped a run into ENOSPC before Q292's mitigation, so
        # the headroom has to be real by the time we get here.
        #
        # If the sentinel never lands (the detached process was killed, or a
        # deletion failed and `set -e` aborted before writing it), run the
        # cleanup synchronously instead of proceeding on a half-cleaned runner.
        # Re-deleting paths the background run already removed is a no-op.
        if: runner.environment == 'github-hosted'
        env:
          DONE_SENTINEL: /tmp/free-runner-disk.done
        run: |
          set -euo pipefail
          # Generous relative to the 17–61 s the cleanup actually takes: this
          # bound exists to catch a dead process, not a slow one.
          deadline=$((SECONDS + 180))
          while [[ ! -f "${DONE_SENTINEL}" && "${SECONDS}" -lt "${deadline}" ]]; do
            sleep 2
          done
          echo "::group::background disk cleanup output"
          cat /tmp/free-runner-disk.log 2>/dev/null || echo "(no log)"
          echo "::endgroup::"
          if [[ ! -f "${DONE_SENTINEL}" ]]; then
            echo "::warning::background disk cleanup did not complete; running it synchronously"
            scripts/e2e/free-runner-disk.sh
          fi
          echo "==> disk available to the build"
          df -h /

      - name: Expose the Actions runtime to the bake
        # buildx's type=gha backend reads ACTIONS_RUNTIME_TOKEN and
        # ACTIONS_RESULTS_URL, which the runner injects into action processes
        # only: docker/setup-buildx-action exports no environment of its own, so
        # the `run:` step below sees neither and buildx drops both cache entries
        # silently (exit 0, no import or export vertex, no warning). This action
        # re-exports every ACTIONS_* variable through GITHUB_ENV so the bake can
        # reach the cache data plane. It must run before the bake step, not
        # beside it: GITHUB_ENV applies to subsequent steps only.
        #
        # Hosted-only, matching GHA_CACHE and every actions/cache step above —
        # the Kata untrusted-PR posture keeps the self-hosted lane's non-registry
        # fetches GitHub-only (Q408), so that lane never reaches this data plane.
        if: runner.environment == 'github-hosted'
        uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0

      - name: Build images while the kind cluster and cert-manager come up
        # The image build is the long pole on a cold cache (~8 min). It depends
        # only on the registry (already up), not the cluster, so run it in the
        # background and bring up the cluster + cert-manager (~2 min, more on
        # Calico) underneath it instead of before it. cert-manager is applied
        # (not waited on) here so its pods pull and start during the build too.
        env:
          GIT_SHA: ${{ github.sha }}
          # Hosted-only (empty disables): buildx's type=gha cache rides the same
          # Actions cache data plane as the actions/cache steps (Q408).
          GHA_CACHE: ${{ runner.environment == 'github-hosted' && 'true' || '' }}
        run: |
          bake_log="$(mktemp)"
          # bake-with-retry.sh wraps `docker buildx bake` in a bounded retry so a
          # mid-push registry connection reset (127.0.0.1:5000 resets under the
          # six concurrent pushes — a recurring e2e-calico bring-up flake, Q256)
          # is absorbed in-step instead of failing the run. Retries re-push from
          # the buildkit layer cache, so they are cheap.
          scripts/e2e/bake-with-retry.sh --file docker-bake.hcl >"$bake_log" 2>&1 &
          bake_pid=$!
          # If cluster bring-up fails (set -e aborts the step), don't leave the
          # build orphaned.
          trap 'kill "$bake_pid" 2>/dev/null || true' EXIT

          # Hand kind the tag-only ref: `docker save`/`load` drops the registry
          # digest, so a `@sha256:` ref would miss the pre-loaded image and kind
          # would re-pull. We already pulled the exact digest above, so the
          # tagged image is the pinned content.
          #
          # KIND_CNI selects the CNI: kindnet (default) or calico. On calico the
          # e2e-cluster target creates the cluster with disableDefaultCNI, applies
          # the pinned Calico manifest, and blocks on calico-node rollout + all
          # nodes Ready before returning, so the tests below never race CNI
          # startup (scripts/e2e/kind-with-registry.sh install_calico). When the
          # Calico images were pre-pulled into the runner's Docker daemon (the
          # step above, calico path only), install_calico kind-loads them onto the
          # nodes so the rollout never touches quay.io. CALICO_VERSION is passed
          # so those pre-pulled images match the manifest the script applies.
          make e2e-cluster KIND_CLUSTER=actions-gateway-e2e KIND_NODE_IMAGE="${KIND_NODE_IMAGE%@*}" KIND_CNI="${KIND_CNI}" CALICO_VERSION="${CALICO_VERSION}"

          # Preload the pre-pulled cert-manager images onto the nodes before
          # applying the manifest, so the rollout the wait step blocks on never
          # pulls them from quay.io. IfNotPresent on the manifest's pinned tags
          # makes the load a hit. (Calico's equivalent load is inside
          # kind-with-registry.sh because its create/install are coupled; the
          # cert-manager apply is a separate step, so its load lives here.)
          while read -r img; do
            [[ -z "$img" ]] && continue
            echo "==> preloading $img onto kind nodes"
            kind load docker-image --name actions-gateway-e2e "$img"
          done < /tmp/cert-manager-images/images.txt
          make apply-cert-manager

          echo "==> waiting for image build (bake) to finish"
          bake_rc=0
          wait "$bake_pid" || bake_rc=$?
          echo "::group::docker buildx bake output"
          cat "$bake_log"
          echo "::endgroup::"
          if [[ "$bake_rc" -ne 0 ]]; then
            echo "image build (bake) failed with exit code ${bake_rc}" >&2
            exit "$bake_rc"
          fi

      - name: Wait for cert-manager to be ready
        # cert-manager pods have been starting since the cluster step; by the
        # time the image build finishes they are typically already Available.
        run: make wait-cert-manager

      - name: Preload metrics-server image onto kind nodes
        # The e2e suite applies metrics-server itself (setupMetricsServer), so —
        # unlike cert-manager, whose apply is a workflow step — its load can't
        # ride the build step. Kind-load the pre-pulled image onto the nodes here
        # (the cluster is up), before the suite runs. IfNotPresent on the
        # manifest's pinned tag makes the suite's apply a cache hit, so kubelet
        # never pulls from registry.k8s.io at test time (Q150).
        run: |
          set -euo pipefail
          while read -r img; do
            [[ -z "$img" ]] && continue
            echo "==> preloading $img onto kind nodes"
            kind load docker-image --name actions-gateway-e2e "$img"
          done < /tmp/metrics-server-images/images.txt

      - name: Run e2e tests
        # E2E_SKIP_TEARDOWN leaves the GMC, fakegithub, and cert-manager alive
        # after the suite finishes so the diagnostic step can dump real cluster
        # state on failure. The kind cluster itself is still deleted by the
        # final cleanup step regardless.
        #
        # The full suite runs on both CNIs. The NetworkPolicy-enforcement specs
        # (the two TenantProvisioning egress negatives + the two ManagerMetricsNP
        # specs) self-skip on kindnet and assert real packet drops on calico, so
        # the calico caller exercises them while the kindnet caller skips them —
        # no per-lane spec selection needed here (Q7b/Q83/Q119).
        env:
          E2E_SKIP_TEARDOWN: "true"
        run: make e2e KIND_CLUSTER=actions-gateway-e2e

      - name: Chart helm-upgrade check
        # The ONLY coverage of `helm upgrade` over a live release (Q475). Every
        # other path installs into a cluster that has never had the chart —
        # `make deploy` runs `helm upgrade --install`, but always as a first
        # install — so nothing else proves a CRD field change still reaches an
        # existing installation. It does only because the CRDs ship under
        # templates/crds/ instead of the chart-root crds/ Helm never upgrades;
        # this step fails closed if that ever regresses.
        #
        # Placed after the suite because it MUTATES the release (upgrade to a
        # marker-bearing chart, then back), which is only safe once no spec is
        # running. E2E_SKIP_TEARDOWN above leaves the release up for it. It
        # restores the real chart on every exit path, so the diagnostic step
        # below still dumps the state the suite left behind.
        #
        # `if: success()` — not always(): on a suite failure the diagnostics are
        # what matters, and mutating the release first would destroy them.
        if: success() && inputs.chart_upgrade_check
        run: make chart-upgrade-check KIND_CLUSTER=actions-gateway-e2e

      - name: Chart uninstall/reinstall check
        # The other day-two path no fresh-cluster test covers: `helm uninstall`
        # followed by a reinstall (Q444). That cycle used to be a cluster-wide
        # outage — deleting the guard's only ValidatingAdmissionPolicyBinding
        # emptied the binding set for its ConfigMap paramKind, and the apiserver
        # tore down the shared param informer permanently, denying EVERY
        # runnergroups/runnersets/runnertemplates write with `no params found for
        # policy binding`. Q492 moved the paramKind to the cluster-scoped
        # PriorityClassAllowlist CRD, which gets a fresh dynamic informer per
        # context and survives the transition; this step is what keeps that true.
        #
        # It was deliberately NOT wired in while the defect was open, because it
        # would have pinned every run red. Wiring it in was part of closing Q492.
        #
        # Runs AFTER chart-upgrade-check because it destroys and recreates the
        # release, and after the suite for the same reason that one does —
        # E2E_SKIP_TEARDOWN leaves the release up for both.
        #
        # `if: success()` — not always(): on a failure the diagnostics the suite
        # left behind are what matters, and reinstalling would destroy them.
        if: success() && inputs.chart_reinstall_check
        run: make chart-reinstall-check KIND_CLUSTER=actions-gateway-e2e

      - name: Released-chart upgrade check
        # The only coverage of the upgrade an operator actually performs: last
        # RELEASED chart -> HEAD (Q507). chart-upgrade-check above proves HEAD's
        # chart upgrades to a mutated copy of ITSELF; nothing before this step
        # proved the chart a real installation runs upgrades to HEAD — Q492's
        # CRD placement broke every v1.2.0 upgrade and passed all of CI. The
        # script pulls the released chart artifact and the released GMC image
        # from GHCR (both public; the pulls are retried), installs the released
        # chart, and upgrades to HEAD along the documented path, asserting any
        # failure is the render-time preflight kind, never Helm's bare
        # "ensure CRDs are installed first".
        #
        # Runs LAST among the chart checks: it uninstalls the live release and
        # leaves the cluster on a fresh released->HEAD release, which would
        # invalidate the earlier checks' baseline if it ran before them.
        #
        # `if: success()` — not always(): on a failure the diagnostics the suite
        # left behind are what matters, and replacing the release would destroy
        # them.
        if: success() && inputs.released_upgrade_check
        run: make chart-released-upgrade-check KIND_CLUSTER=actions-gateway-e2e

      - name: Summarize e2e results
        # Renders the JUnit report into the job summary and one ::error::
        # annotation per failed spec (Q608). Without it the report is reachable
        # only by downloading the artifact below and reading 300 KB of XML —
        # the upload was added assuming Actions would draw a summary table from
        # it via a built-in reporter, and there is no such reporter.
        #
        # Before the upload so a failure here cannot cost us the artifact, and
        # `if: always()` because the failing run is the one worth summarizing.
        # The script never exits non-zero — a suite that died before writing a
        # report must not have that reported as a second, misleading failure.
        if: always()
        run: scripts/e2e/e2e-report-summary.sh tmp/e2e-report.xml

      - name: Upload e2e test report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-junit-report-${{ inputs.kind_cni }}
          # Matches the repo-local report path in the root Makefile's `e2e` target.
          path: tmp/e2e-report.xml

      - name: Collect diagnostic info on failure
        # Also fire on cancellation so a manually-cancelled run still produces
        # cluster state; the previous `if: failure()` skipped this entirely
        # when the user clicked Cancel.
        if: always() && (failure() || cancelled())
        run: |
          set +e
          echo "=== runner disk (ENOSPC during bring-up is Q292's signature) ==="
          df -h /
          echo
          echo "=== runner-host GitHub egress (Q352/Q648; same scoring as the in-suite probe,"
          echo "    cmd/gmc/test/utils.ScoreGitHubEgress) ==="
          gh_body=$(curl -sS --max-time 10 \
            --write-out '\n%{http_code}' https://api.github.com/zen)
          gh_rc=$?
          gh_code="${gh_body##*$'\n'}"
          if [[ $gh_rc -ne 0 ]]; then
            echo "api.github.com: BLOCKED (curl rc=$gh_rc) — no response reached the runner; real-GitHub"
            echo "  spec failures in this run are infra, not product. Re-run the job."
          else
            echo "api.github.com: HTTP $gh_code"
            case "$gh_code" in
              2??) echo "  REACHABLE — GitHub served the runner; treat real-GitHub spec failures as real." ;;
              # /zen needs no credentials, so a refusal is about the source address —
              # the address the in-cluster path NATs through.
              403|408|429|5??)
                echo "  BLOCKED — GitHub refused or could not serve this runner's address; real-GitHub"
                echo "  spec failures in this run are infra, not product. Re-run the job." ;;
              *)
                echo "  INCONCLUSIVE — GitHub answers an unauthenticated /zen with 200 and nothing else,"
                echo "  so an intermediary answered or the endpoint moved. Read the body." ;;
            esac
            if [[ $gh_code != 2?? ]]; then
              echo "  body: $(printf '%s' "${gh_body%$'\n'*}" | tr -s '[:space:]' ' ' | cut -c1-200)"
            fi
          fi
          echo
          echo "=== nodes ==="
          kubectl get nodes -o wide
          echo
          echo "=== GMC pods ==="
          kubectl get pods -n gmc-system -o wide
          echo
          echo "=== GMC pod describe ==="
          kubectl describe pods -n gmc-system
          echo
          echo "=== GMC controller logs ==="
          kubectl logs -n gmc-system -l control-plane=controller-manager --tail=300
          echo
          echo "=== e2e-infra pods ==="
          kubectl get pods -n e2e-infra -o wide
          echo
          echo "=== fakegithub logs ==="
          kubectl logs -n e2e-infra -l app=fakegithub --tail=100
          echo
          echo "=== ALL pods (every namespace) ==="
          kubectl get pods --all-namespaces -o wide
          echo
          echo "=== ActionsGateway CRs ==="
          kubectl get actionsgateway --all-namespaces -o yaml
          echo
          echo "=== proxy Deployments ==="
          kubectl get deploy --all-namespaces -l app=actions-gateway-proxy -o yaml
          echo
          echo "=== tenant pod descriptions ==="
          for ns in $(kubectl get ns -o name | grep tenant- | sed 's|namespace/||'); do
            echo "--- namespace: $ns ---"
            kubectl describe pods -n "$ns"
            echo
          done
          echo "=== tenant NetworkPolicies (proxy ipBlock peers populated by IPRangeReconciler) ==="
          for ns in $(kubectl get ns -o name | grep tenant- | sed 's|namespace/||'); do
            echo "--- namespace: $ns ---"
            kubectl get networkpolicy -n "$ns" -o yaml
            echo
          done
          echo "=== tenant container logs (current + previous) ==="
          for ns in $(kubectl get ns -o name | grep tenant- | sed 's|namespace/||'); do
            for pod in $(kubectl get pods -n "$ns" -o name); do
              echo "--- LOGS $ns/$pod (current) ---"
              kubectl logs -n "$ns" "$pod" --all-containers --tail=200
              echo "--- LOGS $ns/$pod (previous, if crashed) ---"
              kubectl logs -n "$ns" "$pod" --all-containers --tail=200 --previous
              echo
            done
          done
          echo "=== events (last 200) ==="
          kubectl get events --all-namespaces --sort-by=.lastTimestamp | tail -200
          echo
          echo "=== CNI dataplane health (Q300: a starved NetworkPolicy enforcer times out"
          echo "    allowed traffic and leaves fresh NetworkPolicies unenforced) ==="
          # Both lanes' enforcers, the same two selectors as the suite's own dump in
          # cmd/gmc/test/utils/cni_enforcer.go. That one is authoritative because it fires
          # at failure time; this one covers the case where the suite process died before
          # its AfterEach could run — the same two-probe split as the runner-egress check
          # above. It read only app=kindnet until #1417, which is the lane where the
          # enforcement negatives self-SKIP, so a failure on calico, the lane that
          # actually asserts them, captured no enforcer state at all.
          cs='.status.containerStatuses[0]'
          for sel in app=kindnet k8s-app=calico-node; do
            pods=$(kubectl get pods -n kube-system -l "$sel" -o name)
            [[ -z "$pods" ]] && continue
            echo "--- enforcer pods ($sel) ---"
            kubectl get pods -n kube-system -l "$sel" -o wide
            echo "--- restart attribution ($sel): a nonzero RESTARTS on the node hosting a spec's"
            echo "    pods is the first thing to read when a connection that should have been"
            echo "    blocked succeeded; LAST_REASON says why the enforcer died ---"
            kubectl get pods -n kube-system -l "$sel" -o "custom-columns=NAME:.metadata.name,NODE:.spec.nodeName,RESTARTS:${cs}.restartCount,STARTED:${cs}.state.running.startedAt,LAST_REASON:${cs}.lastState.terminated.reason,LAST_EXIT:${cs}.lastState.terminated.exitCode,LAST_FINISHED:${cs}.lastState.terminated.finishedAt"
            echo "--- previous-container logs ($sel; only source for a crash-looped enforcer's fatal) ---"
            kubectl logs -n kube-system -l "$sel" --tail=60 --prefix --previous
            for pod in $pods; do
              echo "--- ${pod} cpu.stat (nr_throttled/nr_periods = CFS throttle ratio) ---"
              kubectl exec -n kube-system "${pod#pod/}" -- cat /sys/fs/cgroup/cpu.stat
              echo "--- ${pod} memory.current / memory.max (bring-up raises kind's 50Mi kindnet ceiling; Q747) ---"
              kubectl exec -n kube-system "${pod#pod/}" -- cat /sys/fs/cgroup/memory.current /sys/fs/cgroup/memory.max
              echo "--- ${pod} memory.events (nonzero 'high'/'max' = enforcer stalled on memory pressure) ---"
              kubectl exec -n kube-system "${pod#pod/}" -- cat /sys/fs/cgroup/memory.events
            done
            echo "--- logs ($sel; NetworkPolicy programming/verdict lag shows here; --since spans"
            echo "    the whole suite so the failing spec's window is covered, not just the tail) ---"
            kubectl logs -n kube-system -l "$sel" --since=30m --tail=-1 --prefix
          done
          # kindnet only: kindnetd runs kube-network-policies with FailOpen, so its nftables
          # rules carry 'queue flags bypass' — while no process is bound to the nfqueue EVERY
          # packet is accepted and NetworkPolicy is not enforced on that node. Calico programs
          # its rules into the kernel and binds no nfqueue, so this read says nothing there.
          for pod in $(kubectl get pods -n kube-system -l app=kindnet -o name); do
            echo "--- ${pod} nfnetlink_queue (queue_dropped/user_dropped > 0 = verdicts overflowed; with"
            echo "    the bypass flag an overflowed packet is ACCEPTED, i.e. NetworkPolicy fails open."
            echo "    These belong to the queue INSTANCE, not the boot: an enforcer restart destroys and"
            echo "    recreates it, so zeros here only describe the window since the last RESTARTS bump"
            echo "    above — check that column before reading a zero as 'no overflow this run', Q747) ---"
            kubectl exec -n kube-system "${pod#pod/}" -- cat /proc/net/netfilter/nfnetlink_queue
          done

      - name: Delete kind cluster
        if: always()
        run: make e2e-cluster-delete KIND_CLUSTER=actions-gateway-e2e
