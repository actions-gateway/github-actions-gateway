# Hold every Event reason the AGC emits to its runbook entry (Q850). Its own
# workflow for the reason metric-reference.yml has one, and separate from that one
# because their inputs differ: this gate also reads the shared reason vocabulary
# under api/ and the runbook, so folding the two together would re-run each on the
# other's triggers.
#
# The `paths` below are the gate's actual inputs and nothing else: the AGC source
# it takes the inventory from, the reason vocabulary the values resolve through,
# the runbook it checks against, the checker and its entry point, the Makefile
# target, and this file. `scripts/lib/**` is there because the entry point sources
# common.sh.
#
# The two lists are the same list written twice — GitHub has no anchor syntax
# across `pull_request` and `push` — so every edit belongs in both.
name: event-runbook

on:
  pull_request:
    paths:
      - 'cmd/agc/**'
      - 'api/**'
      - 'docs/operations/troubleshooting.md'
      - 'devtools/docs/eventreasons/**'
      - 'devtools/go.mod'
      - 'devtools/go.sum'
      - 'scripts/docs/check-event-runbook.sh'
      - 'scripts/docs/check-event-runbook-test.sh'
      - 'scripts/lib/**'
      - 'Makefile'
      - '.github/workflows/event-runbook.yml'
  # Merge queue: also run on the candidate merge commit, which is the only one
  # carrying the merge result. `merge_group` takes no path filter, so unlike the
  # two lists either side this runs on every candidate; the job is a checkout
  # plus one script, and a candidate the gate never sees is the defect this
  # trigger closes (Q942).
  merge_group:
  push:
    branches: [main]
    paths:
      - 'cmd/agc/**'
      - 'api/**'
      - 'docs/operations/troubleshooting.md'
      - 'devtools/docs/eventreasons/**'
      - 'devtools/go.mod'
      - 'devtools/go.sum'
      - 'scripts/docs/check-event-runbook.sh'
      - 'scripts/docs/check-event-runbook-test.sh'
      - 'scripts/lib/**'
      - 'Makefile'
      - '.github/workflows/event-runbook.yml'

permissions:
  contents: read

jobs:
  event-runbook:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
      - name: Event runbook entries (make event-runbook-check)
        run: make event-runbook-check
