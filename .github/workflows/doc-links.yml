# The docs-content gates: Markdown link + anchor integrity (Q52), release-pin
# freshness (Q638), release-note site-link resolution (Q636), and the gate-list
# reconciliation (Q649), which is here because its two halves — the Makefile and
# testing.md — are both covered by this workflow's triggers. Kept as their
# own workflow rather than jobs in unit-test.yml: that workflow deliberately
# path-ignores docs, so a docs-only change must trigger *these* lightweight
# checks and nothing else — the Go suite never runs on a pure-docs PR. Mirrors
# how e2e-test.yml is its own workflow.
#
# The `docs` filter in the `changes` job below scopes the gates to Markdown plus
# the checkers, the docs-site build inputs the release-links oracle is built
# from, and this workflow file, so a code-only change runs nothing but `changes`
# and `doc-links-gate`. The `push` list is the same list written a second time —
# GitHub has no anchor syntax between a trigger's `paths` and a filter's — so
# every edit belongs in both.
name: doc-links

on:
  # No pull_request path filter: this workflow must trigger on EVERY PR so its
  # `doc-links-gate` job always reports its check (a path-skipped workflow leaves
  # a required check Pending and wedges the merge). Fine-grained skipping happens
  # inside via the `changes` job — see
  # docs/development/testing.md#path-gated-workflows-verify-the-heavy-gates-actually-ran.
  pull_request:
  # Merge queue: also run on the queue's candidate merge commit (Q743). Without
  # it these gates only ever see a branch against its own base, so a rule that is
  # a function of the merge result — the em-dash ratchet of Q742, and any later
  # one — cannot be enforced: two PRs each green on their own base merge to a red
  # `main`. paths-filter diffs merge_group events via git against the event's
  # base/head, so non-matching queue entries stay cheap.
  merge_group:
  push:
    branches: [main]
    paths:
      - '**.md'
      - 'scripts/**'
      - 'devtools/docs/**'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - '.mdreflow.yaml'
      - 'tools/go.mod'
      - 'Makefile'
      - '.github/workflows/doc-links.yml'

# Cancel superseded runs on the same PR; pushes to main are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Fine-grained path gate. The workflow now triggers on every PR (so
  # doc-links-gate can report), so classify the diff here and skip the content
  # gates when nothing they read changed. On push to main they always run.
  #
  # One filter for all eleven gates: they share one path list, because each reads
  # the same Markdown walk plus the tooling behind it. `scripts/**` is
  # deliberately the whole tree rather than the individual
  # checkers: script-docs-check (Q688) takes the tree itself as an input, so a
  # script added anywhere under it must re-run these gates. `.mdreflow.yaml` and
  # `tools/go.mod` are the md-reflow gate's other two inputs: the formatter's
  # config, and the line that pins the formatter — a version bump changes what
  # the gate accepts, with no Markdown in the diff to route it here otherwise.
  # The pin rather than all of `tools/**`, so an unrelated tool bump does not
  # drag the docs-site build in release-links along with it.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      docs: ${{ steps.filter.outcome == 'success' && steps.filter.outputs.docs || 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        # paths-filter resolves the changed-file list through ONE un-retried
        # GitHub API call (@actions/github Octokit carries no retry plugin), so a
        # single transient 5xx fails this job and, with it, the gate. Survive it:
        # the job output above fails OPEN, running the gated jobs rather than
        # skipping them when the diff could not be classified (Q363).
        continue-on-error: true
        with:
          filters: |
            docs:
              - '**.md'
              - 'scripts/**'
              - 'devtools/docs/**'
              - 'mkdocs.yml'
              - 'requirements-docs.txt'
              - '.mdreflow.yaml'
              - 'tools/go.mod'
              - 'Makefile'
              - '.github/workflows/doc-links.yml'
      # A JS action reports failure only as an ::error:: annotation, so a rerun
      # that replaces the check run erases it — leaving a log that simply stops
      # after `Invoking listFiles` with no error anywhere (Q363). Say it plainly.
      - name: warn when change detection failed
        if: steps.filter.outcome == 'failure'
        run: echo "::warning::paths-filter could not classify the diff; assuming every filter matched so the gated jobs run"

  # Walk every tracked, non-vendored Markdown file and fail on dead relative
  # file links or `#anchors` that match no GitHub heading slug / explicit
  # <a id>. `make doc-links` (scripts/docs/check-doc-links.sh) is the single source
  # of truth, so the local and CI verdicts match. No Go toolchain needed — just
  # a checkout so `git ls-files` sees the tracked tree.
  doc-links:
    needs: [changes]
    if: needs.changes.outputs.docs == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: markdown links + anchors (make doc-links)
        run: make doc-links

  # Enforce the em-dash density rule (Q654). Same file walk as doc-links and
  # the same counter dependency, but its own job so a density failure and a
  # dead link are separate verdicts on the PR. The counter reads the parsed
  # document, which is why 'devtools/docs/**' is in the filter above.
  #
  # fetch-depth: 0 and the explicit main fetch are what the Q742 diff ratchet
  # measures against. A default shallow checkout has no merge-base, and the gate
  # fails open to the ceilings there — a silent skip, which is the shape of the
  # defect the ratchet exists to close, so this job opts into the hard error via
  # EM_DASH_REQUIRE_BASE below.
  # The fetch is written out rather than left to fetch-depth: 0 because the ref
  # this workflow is handed under merge_group is the queue's own branch, and
  # refs/heads/main is not implied by fetching that branch's history.
  em-dash:
    needs: [changes]
    if: needs.changes.outputs.docs == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: fetch the ratchet base
        run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
      - name: em-dash density (make em-dash-check)
        run: make em-dash-check
        env:
          # Turn the ratchet's fail-open into a hard error here, where the step
          # above has provided the base. Keeps a broken fetch loud instead of
          # silently reducing this job to the ceilings.
          EM_DASH_REQUIRE_BASE: '1'

  # Enforce the admonition-wall and duplicate-stat-tile rules (Q831 wired it;
  # the gate itself predates that). Same file walk and the same reasoning as
  # em-dash above — its only input is Markdown, which unit-test.yml
  # path-ignores — and its own job so a density failure reads apart from a
  # dead link. No Go step: unlike the em-dash counter this gate is pure shell.
  page-density:
    needs: [changes]
    if: needs.changes.outputs.docs == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: admonition + stat-tile density (make page-density-check)
        run: make page-density-check

  # Hold upgrade.md's hand-kept index to its own headings (Q865). It belongs
  # here for the reason doc-links does, and it is the blind spot doc-links
  # leaves: that gate resolves the anchors a page writes, so a heading the index
  # never mentions has no link for it to fail. Its own job so a section that has
  # dropped out of the page's map reads apart from a dead link. No setup-go, as
  # with the em-dash job it shares a module with — the runner image's toolchain
  # builds devtools/.
  upgrade-toc:
    needs: [changes]
    if: needs.changes.outputs.docs == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: upgrade.md's index matches its headings (make upgrade-toc-check)
        run: make upgrade-toc-check

  # Hold tracked Markdown to sentence-per-line (Q831). It belongs here for the
  # same reason em-dash does, and it is the gate whose absence from CI made
  # Q831 worth measuring: it lived in CHECK_FAST_GATES alone, so prose that had
  # never met it could merge on any PR the author did not run `make check` on.
  #
  # setup-go because `make md-reflow-check` builds .build/mdreflow from the
  # vendored tools/ module first. Pinned to go.work for the reason the
  # shellcheck job gives: it keeps the verdict off whatever the runner image
  # happens to default to.
  md-reflow:
    needs: [changes]
    if: needs.changes.outputs.docs == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
      - name: prose is sentence-per-line (make md-reflow-check)
        run: make md-reflow-check

  # Hold why-gag.md's competitor column to the version-and-date rule (Q801).
  # It belongs here rather than in unit-test.yml for the same reason em-dash
  # does: its only input is a Markdown page, and unit-test.yml path-ignores
  # docs, so a cell that lost its stamp would reach no gate there. Its own job
  # so an unstamped verdict and a dead link are separate verdicts on the PR.
  comparison-stamps:
    needs: [changes]
    if: needs.changes.outputs.docs == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: competitor verdicts carry a version and date (make comparison-stamps-check)
        run: make comparison-stamps-check

  # Hold scripts/README.md to the scripts/ tree (Q688). It belongs here for the
  # same reason gate-lists does: its two inputs are a doc and the scripts/ tree,
  # and this is the only workflow whose triggers cover both — unit-test.yml
  # path-ignores docs, so a README edit that dropped an entry would reach no
  # gate there.
  script-docs:
    needs: [changes]
    if: needs.changes.outputs.docs == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: every script is documented (make script-docs-check)
        run: make script-docs-check

  # Reconcile `make check`'s gate and suite lists with everything derived from
  # them (Q649, Q671). It lives here rather than in unit-test.yml's lint job
  # because it spans the Makefile, a doc and the scripts/ tree, and this is the
  # only workflow whose triggers cover all three: unit-test.yml path-ignores
  # docs, so a docs-only change that dropped the `make list-gates` pointer would
  # skip the gate that exists to catch it. The `scripts/**` filter entry is the
  # suite half: a suite added without touching the Makefile is exactly the
  # unlisted-suite case, and it reaches no other entry here.
  gate-lists:
    needs: [changes]
    if: needs.changes.outputs.docs == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: gate lists agree (make gate-lists-check)
        run: make gate-lists-check

  # Assert the install/upgrade pages name the newest stable tag. fetch-depth: 0
  # is load-bearing: the gate derives the current release from the tags, and a
  # shallow checkout has none — it would fall back to the remote, or skip.
  release-pins:
    needs: [changes]
    if: needs.changes.outputs.docs == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: release pins are current (make release-pins-check)
        run: make release-pins-check

  # Hold docs/releases/ to the release-body rules a machine can settle (Q920).
  # It belongs beside release-links rather than in unit-test.yml for the reason
  # em-dash gives: its only input is Markdown, which that workflow path-ignores.
  # Its own job so a duplicate h1 reads apart from a link that does not resolve
  # — and unlike release-links it is offline, so it needs no venv and no tags.
  release-notes:
    needs: [changes]
    if: needs.changes.outputs.docs == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: release notes meet the mechanical rules (make release-notes-check)
        run: make release-notes-check

  # Resolve the release notes' absolute links into the versioned site against a
  # local `mkdocs build`, not over the network — a gate that fetches URLs is a
  # gate that fails when a third party sneezes (Q636). `make release-links-check`
  # provisions the pinned docs venv and builds site/ itself, so this job runs the
  # same code path a contributor does and the two verdicts match. It is the one
  # docs-content gate outside `make check`: the fast local gate has no business
  # provisioning a Python venv.
  #
  # fetch-depth: 0 for the same reason pages.yml's build job takes it — the
  # announce bar's version comes from the tag list at build time (Q393).
  release-links:
    needs: [changes]
    if: needs.changes.outputs.docs == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'
      - name: release-note site links resolve (make release-links-check)
        run: make release-links-check

  # Aggregate gate. Mark THIS job's check context (`doc-links-gate`) required in
  # the branch ruleset — never the path-gated jobs above, because a path-skip
  # leaves them Pending and blocks the merge forever. Passes only when every
  # needed job succeeded or was legitimately skipped. Registering it is what
  # makes the merge queue evaluate these gates rather than merely run them
  # (Q743); until then the workflow reports on the candidate merge and nothing
  # blocks on the verdict. See
  # docs/development/testing.md#path-gated-workflows-verify-the-heavy-gates-actually-ran.
  doc-links-gate:
    needs:
      - changes
      - doc-links
      - em-dash
      - page-density
      - upgrade-toc
      - md-reflow
      - comparison-stamps
      - script-docs
      - gate-lists
      - release-pins
      - release-notes
      - release-links
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      # `always()` above makes a skipped need a pass, by design — so a green
      # gate reads the same whether the jobs it guards ran or never started, and
      # the check UI has nowhere to say which (Q872 gave the two e2e lanes this;
      # Q898 the rest). Ordered before the gate step so a failing gate still
      # reports. Narration only: the required check is unchanged.
      #
      # Driven off `toJSON(needs)` rather than a hand-written env var per job, so
      # a job added to `needs:` above appears here without a second edit — the
      # kind of drift the gate lists themselves keep acquiring.
      - name: say which gated jobs ran
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          # Backticks inside the single-quoted jq programs are markdown code
          # spans for the rendered summary, not command substitution.
          # shellcheck disable=SC2016
          {
            printf -- '### %s: which gated jobs ran\n\n' "${GITHUB_WORKFLOW}"
            printf -- '| job | result |\n| --- | --- |\n'
            jq -r 'to_entries | .[] | select(.key != "changes")
                   | "| `\(.key)` | \(.value.result) |"' <<<"${NEEDS}"
            if jq -e 'to_entries | any(.key != "changes" and .value.result == "skipped")' \
                >/dev/null <<<"${NEEDS}"; then
              printf -- '\n%s\n' 'A `skipped` job is a path-skip, **not** a pass — this gate counts it as one so the required check can report. A green gate here is not a verdict on the skipped rows above.'
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
      - name: require every gating job to have succeeded or skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          echo "needed job results: ${RESULTS}"
          for r in ${RESULTS}; do
            case "$r" in
              success | skipped) ;;
              *) echo "::error::a gating job concluded '${r}'"; exit 1 ;;
            esac
          done
