name: pages
on:
  pull_request:
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'overrides/**'
      # MkDocs hooks run during the build and feed the templates (Q393), so a
      # hook-only change can break the site; build-validate it like any other
      # docs source.
      - 'hooks/**'
      - 'requirements-docs.txt'
      - '.github/workflows/pages.yml'
  # Versioned docs deploy (Q238). The public site is a mike-managed versioned
  # tree on the `gh-pages` branch, NOT a single copy of `main`:
  #   - a push to `main`      -> (re)deploys the `dev` version (unreleased), and
  #                              re-runs the strict PR gate on the merged tree
  #                              (`validate`, which a tag push deliberately skips)
  #   - a STABLE `v*` tag push -> deploys that release and moves the `stable`
  #                               alias + default root redirect to it
  #   - a prerelease tag (0.x, -rc/-alpha/-beta) -> no deploy
  # `stable` is the default a visitor lands on, so a feature merged to `main` but
  # not yet in a tagged/released chart shows only under the opt-in `dev` version
  # in the selector, never as "Available now" on the released docs (this is the
  # Q387 availability fix, generalised). Pull requests only build-validate the
  # site; they never publish. workflow_dispatch deploys a chosen version (see the
  # inputs) — used to seed already-released versions and for manual redeploys.
  #
  # Pages source stays "GitHub Actions": mike maintains the version tree on
  # gh-pages, and the publish job deploys that tree as the Pages artifact (with
  # the custom-domain CNAME re-asserted at the artifact root). See
  # docs/development/website.md § Versioned deploy.
  #
  # Seeding a release cut BEFORE this workflow landed needs `docs_ref`. Dispatch
  # from `main`, because that tag's own pages.yml predates versioning: it has
  # neither these inputs nor mike, and its flat deploy would clobber the version
  # tree. Point `docs_ref` at the tag so the released CONTENT is what gets
  # published; without it a seed publishes feature-ahead `main` as the released
  # docs, the exact "Available now" drift Q387/Q238 exist to prevent.
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version id to deploy (e.g. 1.1.0, or dev). Blank = derive from the ref.'
        required: false
      alias:
        description: 'Alias to (re)assign to this version (e.g. stable). Blank = none.'
        required: false
      set_default:
        description: 'Make this alias/version the default the site root redirects to.'
        type: boolean
        default: false
      docs_ref:
        description: 'Ref to build the docs content from (e.g. v1.2.0). Blank = this ref. Use when seeding an already-released version.'
        required: false

# PR builds are per-ref and cancelable; every deploy shares one group and never
# cancels, so concurrent main/tag pushes serialise on the gh-pages branch instead
# of racing it.
concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Pull-request validation only: prove the site builds. The versioned deploy
  # path (mike) is exercised on push/dispatch, not on PRs, so keep this a plain
  # one-shot build — the same gate that ran before versioning.
  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The announce bar's version is derived from the tag list at build time
          # (Q393, hooks/release_version.py). A default depth-1 checkout fetches no
          # tags, so the PR preview would render the version-free fallback banner
          # instead of what the site actually publishes.
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'
      - run: pip install -r requirements-docs.txt
      # --strict promotes MkDocs' link/anchor warnings to build failures (Q560);
      # mkdocs.yml's `validation` block is what raises them to warnings in the
      # first place. Only the PR gate is strict — the deploy job below builds a
      # tag's own docs, and a release cut before this gate existed must still be
      # publishable.
      - run: mkdocs build --strict --site-dir _site
      # The `dev` version publishes the repo-internal docs as well (Q558), a
      # scope the release build above never exercises. Build it too, so a PR
      # that breaks a plan/development page fails here rather than on `main`.
      - name: Build the dev scope (repo-internal docs included)
        env:
          # /releases/ stays excluded on dev too — those files are GitHub Release
          # bodies, not site pages (mkdocs.yml documents why).
          MKDOCS_EXCLUDE_DOCS: "/README.md\n/releases/\n"
        run: mkdocs build --strict --site-dir _site-dev

  # Push to main: re-run the PR gate against the merged tree.
  #
  # Two individually-green PRs can merge into a red `main`, because neither gate
  # sees the other's change. Q560 raised MkDocs' link validation to warnings and
  # Q558 added a link that trips it; each passed on a base without the other, and
  # `main` built dirty from the second merge until the next docs PR inherited the
  # failure (Q562). Nothing caught it in between: `publish` below is deliberately
  # non-strict, so it deployed the broken tree without complaint.
  #
  # Deliberately parallel to `publish` rather than gating it. The signal wanted
  # here is a red commit status on `main`, not a stalled `dev` deploy — the same
  # reason `publish` stays non-strict, since a release cut before these gates
  # existed must still be publishable. Tags and dispatches are excluded for that
  # reason too; only `main` is held to the gate its PRs already pass.
  validate:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'
      - run: pip install -r requirements-docs.txt
      - run: mkdocs build --strict --site-dir _site
      - name: Build the dev scope (repo-internal docs included)
        env:
          # /releases/ stays excluded on dev too — those files are GitHub Release
          # bodies, not site pages (mkdocs.yml documents why).
          MKDOCS_EXCLUDE_DOCS: "/README.md\n/releases/\n"
        run: mkdocs build --strict --site-dir _site-dev

  # Push/dispatch: update the mike version tree on gh-pages and deploy it.
  publish:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # The live-site check below polls for up to five minutes on a release
    # publish, on top of the build, the mike deploy and the Pages rollout.
    timeout-minutes: 20
    permissions:
      contents: write   # push the gh-pages version tree
      pages: write      # deploy the Pages artifact
      id-token: write   # OIDC for actions/deploy-pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'
      - run: pip install -r requirements-docs.txt

      - name: Select the docs source
        id: source
        env:
          DOCS_REF: ${{ github.event.inputs.docs_ref }}
        # Decide WHICH docs content to build. Blank `docs_ref` (every push, and a
        # plain redeploy) builds this checkout, the normal path.
        #
        # A non-blank `docs_ref` restores that ref's docs sources over the working
        # tree so a seeded release publishes the content it actually shipped with,
        # not feature-ahead `main`. Deliberately NOT restored:
        #   - requirements-docs.txt: the toolchain stays this workflow's, because
        #     an old pin predates mike and the version-selector support.
        #   - `site_url` and `docs/CNAME`: where the site LIVES is a property of
        #     the site, not of the release. v1.0.0 predates the custom domain
        #     entirely, carrying no docs/CNAME (which would break the assemble
        #     step's `cp`) and a site_url still on the old github.io project
        #     subpath, which would give that version dead canonical URLs, sitemap,
        #     and announce-bar links. Both are pinned to this checkout.
        #   - `overrides/`: site chrome, not release documentation. Its announce
        #     bar advertises the newest release site-wide, which is exactly the
        #     signal a visitor reading older docs needs. Taking it from the tag
        #     instead pins each version to whatever the banner said the day it was
        #     cut, and the banner has historically lagged: both v1.1.0 and v1.2.0
        #     shipped still saying "v1.0.0 is here", so a faithful seed left the
        #     default landing page advertising a two-releases-stale version.
        #   - mkdocs.yml's `extra.version` block: a pre-versioning tag has none,
        #     so its pages would render with no version selector, stranding a
        #     visitor on an old release.
        #   - mkdocs.yml's `hooks:` block: a tag cut before Q393 does not wire
        #     hooks/release_version.py, so its announce bar would render the
        #     version-free fallback instead of naming the newest release.
        #
        # NOTE this only covers seeds. A stable tag push has a blank `docs_ref`
        # and builds the tag wholesale, overrides included. That is safe for the
        # banner's VERSION, which the hook derives from the tag list at build time
        # rather than from a string in the checkout (Q393); only the optional
        # highlight prose is pinned to the tag. See docs/operations/release.md,
        # Pre-flight.
        #
        # The overrides ride in an INHERIT overlay rather than a YAML rewrite, so
        # the tag's own nav and config stay byte-for-byte intact (mkdocs deep-merges
        # the parent, and scalars like site_url are replaced).
        run: |
          set -euo pipefail
          config="mkdocs.yml"
          if [[ -n "${DOCS_REF:-}" ]]; then
            site_url="$(awk '/^site_url:/ {print $2; exit}' mkdocs.yml)"
            if [[ -z "${site_url}" ]]; then
              echo "::error::Could not read site_url from mkdocs.yml"
              exit 1
            fi

            # `fetch-depth: 0` fetches this ref's history and every tag, but no
            # other branch, so a branch `docs_ref` is not a local ref and the
            # checkout below dies with `invalid reference`. Every earlier seed
            # named a tag and never hit it; the post-tag pin republish
            # (release.md step 7) names the `release-X.Y` branch, so fetch it
            # into a private ref. A ref the remote cannot resolve (a bare SHA)
            # leaves DOCS_REF alone, since the full local history already has it.
            if git fetch --no-tags origin "+${DOCS_REF}:refs/gag/docs-ref"; then
              DOCS_REF="refs/gag/docs-ref"
            fi

            git checkout "${DOCS_REF}" -- docs mkdocs.yml
            git checkout HEAD -- docs/CNAME

            config="mkdocs.versioned.yml"
            {
              echo 'INHERIT: ./mkdocs.yml'
              echo "site_url: ${site_url}"
              echo 'hooks:'
              echo '  - hooks/release_version.py'
              echo 'extra:'
              echo '  version:'
              echo '    provider: mike'
              echo '    default: stable'
            } > "${config}"
            echo "Building docs content from ${DOCS_REF} (site_url=${site_url}) via ${config}"
          fi
          echo "config=${config}" >> "${GITHUB_OUTPUT}"

      - name: Resolve version, alias, and default
        id: resolve
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          IN_VERSION: ${{ github.event.inputs.version }}
          IN_ALIAS: ${{ github.event.inputs.alias }}
          IN_DEFAULT: ${{ github.event.inputs.set_default }}
        # Decide WHAT to deploy. `deploy=false` means "nothing to publish" (a
        # prerelease tag): the mike/deploy steps below are skipped and the job is
        # a green no-op. The prerelease test mirrors publish.yml's single source
        # of truth (Q293): a tag is a prerelease when its SemVer core is 0.x or it
        # carries a '-' suffix (-rc/-alpha/-beta).
        #
        # For a stable release tag we set `stable_tag=true` rather than hardcoding
        # the `stable` alias: the deploy step only claims `stable` + the default
        # root redirect when this version is the HIGHEST released one, so a backport
        # patch to an older supported line (e.g. v1.2.5 cut after v1.3.0) publishes
        # its own version without demoting the site from the newer minor. A
        # workflow_dispatch with an explicit alias/set_default is honored verbatim
        # (that is the seeding path).
        run: |
          set -euo pipefail
          version=""
          alias=""
          is_default=false
          stable_tag=false
          title=""
          deploy=false

          resolve_from_ref() {
            if [[ "${REF}" == "refs/heads/main" ]]; then
              version="dev"
              title="dev (main)"
              deploy=true
            elif [[ "${REF}" == refs/tags/v* ]]; then
              local core="${REF#refs/tags/v}"
              if [[ "${core}" == 0.* || "${core}" == *-* ]]; then
                deploy=false
              else
                version="${core}"
                title="${core}"
                stable_tag=true
                deploy=true
              fi
            fi
          }

          if [[ "${EVENT}" == "workflow_dispatch" && -n "${IN_VERSION}" ]]; then
            version="${IN_VERSION}"
            title="${IN_VERSION}"
            alias="${IN_ALIAS}"
            is_default="${IN_DEFAULT}"
            deploy=true
          else
            resolve_from_ref
          fi

          {
            echo "deploy=${deploy}"
            echo "version=${version}"
            echo "alias=${alias}"
            echo "is_default=${is_default}"
            echo "stable_tag=${stable_tag}"
            echo "title=${title}"
          } >> "${GITHUB_OUTPUT}"
          echo "Resolved: deploy=${deploy} version=${version} alias=${alias} default=${is_default} stable_tag=${stable_tag}"

      - name: Deploy the version with mike
        id: mike
        if: steps.resolve.outputs.deploy == 'true'
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
          ALIAS: ${{ steps.resolve.outputs.alias }}
          IS_DEFAULT: ${{ steps.resolve.outputs.is_default }}
          STABLE_TAG: ${{ steps.resolve.outputs.stable_tag }}
          TITLE: ${{ steps.resolve.outputs.title }}
          CONFIG: ${{ steps.source.outputs.config }}
          DOCS_REF: ${{ github.event.inputs.docs_ref }}
        # mike commits each version into a subdir of gh-pages; the branch is pushed
        # once at the end. --alias-type=copy makes an alias (e.g. `stable`) a real
        # directory, not a symlink: GitHub Pages artifact deploys don't follow
        # symlinks, so a symlinked `stable/` would 404 on deep links.
        #
        # `stable` + the default root redirect only move to a release tag when it is
        # the HIGHEST released version, so a backport patch to an older supported
        # line never demotes the site from a newer minor. A workflow_dispatch's
        # explicit alias/default is applied verbatim instead (the seeding path).
        run: |
          set -euo pipefail
          # Which alias this run actually put on the version. The two checks
          # below assert against it rather than re-deriving the backport rule,
          # which would be a second copy of step 3's semver comparison.
          claimed_alias=""
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # `dev` is the only version that publishes the repo-internal docs —
          # the backlog, plan docs, contributor guides (Q558). A release is a
          # frozen build, so a backlog in one would be stale from tag day.
          # Exported here rather than as a step `env:` because mkdocs.yml's
          # !ENV default only applies when the variable is ABSENT: a
          # conditional expression falling through to '' would publish the
          # internal docs on every release instead.
          #
          # /releases/ is excluded here too: GitHub Release bodies are authored
          # for github.com's renderer and publish as literal text under MkDocs.
          if [[ "${VERSION}" == "dev" ]]; then
            export MKDOCS_EXCLUDE_DOCS=$'/README.md\n/releases/\n'
          fi

          # Links from the docs into the source tree resolve against the ref
          # this version documents, not always `main` (hooks/source_links.py).
          if [[ -n "${DOCS_REF:-}" ]]; then
            export GAG_DOCS_SOURCE_REF="${DOCS_REF}"
          elif [[ "${STABLE_TAG}" == "true" ]]; then
            export GAG_DOCS_SOURCE_REF="v${VERSION}"
          fi

          # Every mike call reads the same config the build does, so a `docs_ref`
          # seed picks up the INHERIT overlay (and, through it, the tag's own
          # mkdocs.yml) rather than this checkout's.
          cfg=(--config-file "${CONFIG}")

          # 1) Deploy the version itself (with an explicit dispatch alias if given).
          args=(deploy "${cfg[@]}" --update-aliases --title "${TITLE}")
          if [[ -n "${ALIAS}" ]]; then
            args+=(--alias-type=copy "${VERSION}" "${ALIAS}")
            claimed_alias="${ALIAS}"
          else
            args+=("${VERSION}")
          fi
          mike "${args[@]}"

          # 2) Honor an explicit workflow_dispatch default.
          if [[ "${IS_DEFAULT}" == "true" ]]; then
            mike set-default "${cfg[@]}" "${ALIAS:-${VERSION}}"
          fi

          # 3) Automatic stable handling for a release tag: claim `stable` + the
          #    default only when this version is the highest released one (semver).
          #    A backport to an older line just updates its own version's docs.
          if [[ "${STABLE_TAG}" == "true" ]]; then
            highest="$(mike list "${cfg[@]}" 2>/dev/null | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | sort -V | tail -1 || true)"
            if [[ "${highest}" == "${VERSION}" ]]; then
              mike deploy "${cfg[@]}" --alias-type=copy --update-aliases --title "${TITLE}" "${VERSION}" stable
              mike set-default "${cfg[@]}" stable
              claimed_alias="stable"
            else
              echo "Backport: ${VERSION} is not the highest release (${highest}); leaving stable unchanged."
            fi
          fi

          # 4) Publish the updated version tree.
          git push origin gh-pages

          echo "claimed_alias=${claimed_alias}" >> "${GITHUB_OUTPUT}"

      - name: Assemble the Pages artifact from the gh-pages version tree
        if: steps.resolve.outputs.deploy == 'true'
        # Serve the whole mike tree (all versions + root redirect + versions.json)
        # via the "GitHub Actions" Pages source. Re-assert the custom-domain CNAME
        # at the artifact root — mike does not keep a root CNAME — and give the
        # root a robots.txt that indexes the default (stable) sitemap while keeping
        # the unreleased `dev` version out of search results.
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          git archive gh-pages | tar -x -C _site
          cp docs/CNAME _site/CNAME
          cat > _site/robots.txt <<'ROBOTS'
          # Versioned docs: index the default (stable) release; keep the unreleased
          # `dev` version out of search results to avoid duplicate content.
          User-agent: *
          Allow: /
          Disallow: /dev/

          Sitemap: https://actions-gateway.com/stable/sitemap.xml
          ROBOTS

      - name: Verify the artifact carries the version being deployed
        if: steps.resolve.outputs.deploy == 'true'
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
          CLAIMED_ALIAS: ${{ steps.mike.outputs.claimed_alias }}
        # A stale archive still has a root index.html and a CNAME, which is all
        # this step asserted until Q1000: a deploy of the previous tree passed
        # its own verification and reported green. Assert the version tree and
        # the alias mike actually claimed as well.
        run: |
          set -euo pipefail
          scripts/pages/verify-pages-artifact.sh \
            --site _site --version "${VERSION}" --alias "${CLAIMED_ALIAS}"

      - name: Upload Pages artifact
        if: steps.resolve.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.resolve.outputs.deploy == 'true'
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

      # Every tree-side signal was green when v1.6.0 published nothing: mike
      # pushed the right commit, the archive picked it up, the artifact carried
      # 1.6.0 with the stable alias (it was re-read afterwards), and the
      # deployment reported success and went active. The site served the
      # previous release for 25 minutes regardless. Nothing in the run could see
      # that, because every check it ran read the tree. So ask the site (Q1000).
      #
      # `dev` is excluded because it is already in versions.json before the run
      # starts: there is no assertion here that could go red for it, and a check
      # that cannot fail on every push to `main` is worse than no check.
      - name: Verify the live site serves the version
        if: steps.resolve.outputs.deploy == 'true' && steps.resolve.outputs.version != 'dev'
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
          CLAIMED_ALIAS: ${{ steps.mike.outputs.claimed_alias }}
        run: |
          set -euo pipefail
          scripts/pages/verify-pages-live.sh \
            --version "${VERSION}" --alias "${CLAIMED_ALIAS}"
