name: dockerfile-lint
on:
  pull_request:
    paths:
      - '**/Dockerfile'
      - '.hadolint.yaml'
      - '.github/workflows/dockerfile-lint.yml'
  push:
    branches: [main]
    paths:
      - '**/Dockerfile'
      - '.hadolint.yaml'
      - '.github/workflows/dockerfile-lint.yml'

# Cancel superseded runs of this workflow on the same PR; pushes to main are
# never cancelled (each is a distinct post-merge gate). Keyed on github.ref —
# for a PR that is the unique refs/pull/<n>/merge.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Lint every Dockerfile with hadolint. All six currently pass at the strictest
# (style) threshold, so failure-threshold is set there to catch any regression —
# missing digest pins, a relaxed USER, an unpinned base tag — at PR time.
# (scripts/dogfood/runner/Dockerfile is a dev/reference image, not a shipped one,
# but it's gated too so the example people copy stays lint-clean.)
jobs:
  hadolint:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    strategy:
      fail-fast: false
      matrix:
        # The root Dockerfile holds every first-party image as a named stage
        # (gmc, agc, proxy, worker, wrapper, build-runner, fakegithub); hadolint
        # lints the whole file in one leg. The dogfood runner image is built
        # separately.
        dockerfile:
          - Dockerfile
          - scripts/dogfood/runner/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: hadolint ${{ matrix.dockerfile }}
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: ${{ matrix.dockerfile }}
          failure-threshold: style
