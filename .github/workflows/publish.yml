name: publish

# Build, push, sign, and SBOM-attest the four first-party images on a release.
#
# Images are MULTI-ARCH (linux/amd64 + linux/arm64, Q97): each push produces an
# OCI image index, and the digest recorded everywhere (signature, run summary,
# chart pins) is the INDEX digest — the kubelet resolves the per-arch manifest
# from it at pull time. The Dockerfiles cross-compile Go in a $BUILDPLATFORM
# builder stage and the runtime stages are COPY-only, so no QEMU setup is needed.
#
# Signing is KEYLESS (sigstore/Fulcio via GitHub Actions OIDC, id-token: write):
# cosign exchanges the short-lived OIDC token for an ephemeral Fulcio certificate
# and records the signature in the public Rekor transparency log. There is NO
# long-lived signing key and NO stored signing secret — the project forbids
# secrets-as-config, and keyless is the secure-by-default approach. Each image is
# signed RECURSIVELY (the index and every per-arch manifest), and an SPDX-JSON
# SBOM (generated with syft, one per architecture) is attached to each per-arch
# manifest as a cosign attestation, itself keyless-signed.
#
# A signed SLSA BUILD-PROVENANCE attestation (actions/attest-build-provenance,
# Q103) is also attached to each image's index digest as an OCI referrer. It
# travels the SAME keyless path — ambient OIDC → Fulcio cert → Rekor — so the
# provenance is authenticated (SLSA Build L2), not the unsigned, overwritable
# attestation buildx emits by default (which we disable). Reaching SLSA Build
# L3 would additionally need an isolated reusable-workflow builder.
#
# This runs ONLY on a v* tag push (or manual dispatch) — i.e. on PUBLISH, not on
# PRs. PR CI (security-scan.yml) builds each image and generates its SBOM so that
# path can't silently break, but it does NOT push, sign, or attest: signing needs
# a registry push and the ambient OIDC identity that only this workflow has. PR CI
# therefore does not exercise the cosign sign/attest steps — they are first
# exercised when a tag is published.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to publish (e.g. v1.0.0). Defaults to the git ref name.'
        required: false

# Workflow-default permissions are read-only; each job widens only what it needs.
permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  # Buildkit image docker/setup-buildx-action boots its builder from; pre-pulled
  # with retry below so the buildx boot never touches Docker Hub uncached.
  # DIGEST-PINNED (Q127): the `buildx-stable-1` tag floats, so an unpinned
  # reference would let the builder that assembles signed release images change
  # underfoot. Pin it by digest; updatecli.d/buildkit.yaml (Q151) resolves the
  # tag's current digest and auto-bumps it here and in the e2e/security-scan
  # workflows together so the three pins can't drift.
  BUILDKIT_IMAGE: moby/buildkit:buildx-stable-1@sha256:0168606be2315b7c807a03b3d8aa79beefdb31c98740cebdffdfeebf31190c9f

jobs:
  # Stop-ship gate, ahead of every publishing job. A stable tag push makes
  # pages.yml deploy THAT TAG's docs wholesale, so whatever the docs-site announce
  # bar renders at tag time is what the released version advertises, permanently,
  # and no later fix to `main` reaches it. Relying on the release checklist did not
  # work: all three stable tags shipped a stale banner (v1.0.0 still said
  # "Alpha - pre-1.0", v1.1.0 and v1.2.0 both said "v1.0.0 is here"), which left
  # the site's default landing page advertising a two-releases-old version until
  # it was caught by hand.
  #
  # The version is now DERIVED from the git tags at build time (Q393,
  # hooks/release_version.py), so no hand-edited string is left to forget. This
  # gate proves that derivation rather than trusting it: it builds the site the
  # same way pages.yml will and asserts the RENDERED banner names this tag. A hook
  # that resolves nothing (tags not fetched, git unavailable) falls back to a
  # version-free banner, and a template regression drops the version entirely.
  # Both fail here, before any image is pushed, rather than on the deployed site.
  # The expected version is recomputed in shell, independently of the hook, so
  # this stays a check rather than a restatement of the code under test.
  #
  # Prereleases are exempt: pages.yml publishes no docs for them, and the banner
  # names the newest GA release rather than churning through every RC. A backport
  # tag is exempt for the same reason pages.yml leaves the `stable` alias alone:
  # the banner advertises the NEWEST release, so a v1.2.5 cut after v1.3.0
  # correctly renders v1.3.0.
  announce-bar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The hook derives the banner from the tag list; a default depth-1
          # checkout of a tag push fetches none.
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'
      - name: The rendered announce bar names this release
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-${GITHUB_REF_NAME}}"
          version="${tag#v}"

          # Same prerelease test as the publish job's tag resolver (Q293): SemVer
          # core 0.x, or any '-' suffix (-rc/-alpha/-beta).
          if [[ "${version}" == 0.* || "${version}" == *-* ]]; then
            echo "Prerelease ${tag}: no docs are published for this tag, skipping."
            exit 0
          fi

          # Highest stable release, computed here rather than read back from the
          # hook. Mirrors pages.yml's `stable`-alias rule.
          highest="$(git tag --list 'v*' | grep -E '^v[1-9][0-9]*\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)"
          if [[ "${highest}" != "${tag}" ]]; then
            echo "Backport ${tag}: the banner advertises the newest release (${highest:-none}), as intended. Skipping."
            exit 0
          fi

          pip install --quiet -r requirements-docs.txt
          mkdocs build --site-dir _site --quiet

          # Material renders the announce block into the page's `md-banner` aside.
          banner="$(awk '/md-banner/,/<\/aside>/' _site/index.html)"
          if [[ -z "${banner}" ]]; then
            echo "::error::The built site has no announce bar. If the block was renamed or Material's banner markup changed, update overrides/main.html and this gate in .github/workflows/publish.yml."
            exit 1
          fi

          if [[ "${banner}" != *"${tag}"* ]]; then
            echo "::error::The rendered docs-site announce bar does not name ${tag}. A stable tag deploys its own docs, so this release would ship advertising the wrong version. The version is derived by hooks/release_version.py from the git tags; check that the tag is fetched and the hook is wired in mkdocs.yml. See docs/development/website.md, The announce bar."
            echo "Rendered banner:"
            echo "${banner}"
            exit 1
          fi

          echo "Rendered announce bar names ${tag}."

  publish:
    needs: announce-bar
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read # checkout
      packages: write # push images, signatures, and attestations to GHCR
      id-token: write # KEYLESS cosign + provenance — mint the OIDC token Fulcio signs against
      attestations: write # actions/attest-build-provenance writes the signed SLSA provenance
    strategy:
      fail-fast: false
      # One leg per published image. Every image is a named stage of the root
      # Dockerfile, so a leg is selected by `target`, not by file. fakegithub is
      # a test fixture, not a published artifact, so its stage is absent here.
      matrix:
        name: [gmc, agc, proxy, worker, wrapper]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Resolve publish tag
        id: tag
        # On a tag push GITHUB_REF_NAME is the tag; workflow_dispatch may override
        # it via the `tag` input. Refuse to publish from a non-tag ref with no
        # explicit input so a manual run on a branch can't push a junk image tag.
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          # Defense in depth (Q124): the sign step below uses the ambient release
          # OIDC identity, whose Fulcio cert records the ref this run executed
          # from. Refuse any non-tag ref so a workflow_dispatch from a branch can
          # never reach the sign step and mint a `refs/heads/...` signature.
          # verify-release.sh anchors to `@refs/tags/v.*` and would reject such a
          # signature anyway; this stops it before a malicious image is pushed.
          if [[ "${GITHUB_REF}" != refs/tags/* ]]; then
            echo "refusing to publish: ref '${GITHUB_REF}' is not a tag; publish runs only on v* tags" >&2
            exit 1
          fi
          tag="${INPUT_TAG:-}"
          if [[ -z "${tag}" ]]; then
            tag="${GITHUB_REF_NAME}"
          fi
          if [[ "${tag}" != v* ]]; then
            echo "refusing to publish: resolved tag '${tag}' is not a v* version" >&2
            exit 1
          fi
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
      - name: Pre-pull buildkit builder image
        run: scripts/fetch/pull-image-with-retry.sh "${BUILDKIT_IMAGE}"
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          driver-opts: image=${{ env.BUILDKIT_IMAGE }}
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata (tags + OCI labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=raw,value=${{ steps.tag.outputs.tag }}
            type=sha,format=long
      - name: Build and push ${{ matrix.name }}
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          target: ${{ matrix.name }}
          push: true
          # Multi-arch (Q97): both platforms on every release. The result is an
          # OCI image index; steps.build.outputs.digest below is the INDEX
          # digest — the ref operators pin in chart values. No QEMU: the
          # Dockerfile cross-compiles Go on $BUILDPLATFORM and the runtime
          # stages are COPY-only.
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Mirror docker-bake.hcl's provenance args so the OCI image.* labels are
          # stamped from this build's commit and the release version.
          build-args: |
            REVISION=${{ github.sha }}
            VERSION=${{ steps.tag.outputs.tag }}
          # Release images build every layer from source — NO build cache
          # (Q127). A `cache-from: type=gha` would let layers of a signed,
          # released image be served from the PR-populated GHA BuildKit cache
          # rather than the tagged source: a poisoned cache entry (writable by any
          # PR build) would be baked into the release and keyless-signed as the
          # publish identity. `no-cache: true` closes that supply-chain surface;
          # the extra build minutes are acceptable on the rare release path.
          #
          # That also means this leg executes the Dockerfile's `deps` stage for
          # real, compiling the whole vendored tree rather than just this
          # binary's dependency closure — the stage exists to make the e2e bake's
          # cache reusable across runs, and an uncached release build cannot
          # benefit from it. Measured cost is a couple of minutes on the smaller
          # legs (proxy/worker/wrapper), well inside this job's 30-minute
          # timeout, and it is the price of e2e exercising the exact same
          # Dockerfile the release builds from.
          no-cache: true
          # Disable buildx's default provenance attestation (mode=max for public
          # repos): it is UNSIGNED and would embed extra attestation manifests in
          # the index. The authenticated, Rekor-logged SLSA provenance comes from
          # the attest-build-provenance step below instead, keeping the index the
          # two arch manifests the SBOM/sign steps assume.
          provenance: false
      - name: Attest build provenance (signed, keyless)
        # Signed SLSA build-provenance for the pushed multi-arch INDEX (the digest
        # operators pin). KEYLESS, mirroring the cosign flow: the action mints the
        # ambient GitHub OIDC token (id-token: write), exchanges it for a
        # short-lived Fulcio cert, and records the in-toto SLSA provenance
        # predicate in Rekor — no key material. push-to-registry attaches the
        # attestation to GHCR as an OCI referrer of the index digest (needs
        # packages: write + attestations: write), so a consumer resolves it from
        # the same ref. This authenticated provenance — not buildx's unsigned
        # default (disabled above) — is what backs the images' SLSA claim
        # (SLSA Build L2; see docs/operations/release.md).
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # Pin the signer version (the action otherwise floats to latest). Keep
          # in step with COSIGN_VERSION in the Makefile so a local
          # `make verify-release` verifies with the same version that signed.
          cosign-release: v2.5.2
      - name: Install syft
        id: syft
        # download-syft only (no scan): the wrapping sbom-action has no
        # per-platform mode, and a single syft scan of a multi-arch index
        # silently picks ONE platform — the other arch's attestation would
        # carry the wrong package list. The step below loops the platforms.
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          # Pin the syft version explicitly: the action otherwise resolves syft
          # at runtime and would float to a newer release between otherwise
          # identical builds, changing the bytes that scan the release images.
          # This is a runtime tool download, not a SHA-pinnable action, so
          # Dependabot can't bump it — bump by hand alongside the action SHA.
          syft-version: v1.45.1
      - name: Generate per-arch SBOMs (SPDX-JSON) for the pushed image
        id: sbom
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.name }}
          INDEX_DIGEST: ${{ steps.build.outputs.digest }}
          SYFT: ${{ steps.syft.outputs.cmd }}
        run: |
          set -euo pipefail
          # One SBOM per architecture, scanned from that arch's exact manifest
          # digest (resolved from the index the push produced — never from the
          # floating tag). The digests are exported as step outputs so the
          # attest step below binds each SBOM to the same immutable manifest.
          for arch in amd64 arm64; do
            digest="$(docker buildx imagetools inspect --raw "${IMAGE}@${INDEX_DIGEST}" \
              | jq -r --arg arch "${arch}" \
                  '.manifests[] | select(.platform.os == "linux" and .platform.architecture == $arch) | .digest')"
            if [[ -z "${digest}" ]]; then
              echo "no linux/${arch} manifest found in index ${INDEX_DIGEST}" >&2
              exit 1
            fi
            "${SYFT}" "registry:${IMAGE}@${digest}" \
              -o "spdx-json=sbom-${{ matrix.name }}-${arch}.spdx.json"
            echo "digest-${arch}=${digest}" >> "${GITHUB_OUTPUT}"
          done
      - name: Upload SBOMs as run artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ matrix.name }}
          path: sbom-${{ matrix.name }}-*.spdx.json
          if-no-files-found: error
      - name: Sign image + attest SBOMs (keyless)
        env:
          # Always reference the image by digest so the signature/attestation bind
          # to the exact bytes we pushed, not to whatever the tag resolves to later.
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.name }}
          INDEX_DIGEST: ${{ steps.build.outputs.digest }}
          DIGEST_AMD64: ${{ steps.sbom.outputs.digest-amd64 }}
          DIGEST_ARM64: ${{ steps.sbom.outputs.digest-arm64 }}
        run: |
          set -euo pipefail
          # Keyless: cosign reads the ambient GitHub OIDC token (id-token: write),
          # obtains a short-lived Fulcio cert, and logs to Rekor. No key material.
          # scripts/fetch/retry.sh absorbs transient GHCR push errors (HTTP/2
          # INTERNAL_ERROR / 5xx) — sign and attest are idempotent.
          #
          # --recursive signs the index AND each per-arch child manifest, so
          # `cosign verify` succeeds against the index digest (what operators
          # pin) and against the per-arch digest a kubelet reports as imageID.
          scripts/fetch/retry.sh cosign sign --yes --recursive "${IMAGE}@${INDEX_DIGEST}"
          # Each arch's SBOM is attested onto that arch's manifest digest — the
          # precise binding. Note `cosign verify-attestation` therefore targets
          # a per-arch digest, not the index (see security-operations.md).
          scripts/fetch/retry.sh cosign attest --yes --type spdxjson \
            --predicate "sbom-${{ matrix.name }}-amd64.spdx.json" "${IMAGE}@${DIGEST_AMD64}"
          scripts/fetch/retry.sh cosign attest --yes --type spdxjson \
            --predicate "sbom-${{ matrix.name }}-arm64.spdx.json" "${IMAGE}@${DIGEST_ARM64}"
      - name: Record published digest in the run summary
        # Surface the immutable ref@digest (the multi-arch INDEX digest) in the
        # workflow summary so the release manager can copy it straight into the
        # GitHub Release notes and the `helm install --set <img>.image.digest=…`
        # pins. See the release runbook (docs/operations/release.md).
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.name }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          # One bullet per matrix leg — legs run in parallel and can't share a
          # table header, so a bullet renders cleanly where a header-less table row
          # would not.
          # Single-quoted printf format string: the %s must reach printf unexpanded.
          # shellcheck disable=SC2016
          printf -- '- **%s** — `%s`\n' "${{ matrix.name }}" "${IMAGE}" >> "${GITHUB_STEP_SUMMARY}"

  # Package, push, and keyless-sign the Helm chart as an OCI artifact to GHCR,
  # alongside the images. OCI (not a gh-pages chart repo) is chosen so the chart
  # reuses the SAME registry, GHCR login, and Fulcio/Rekor keyless-cosign flow as
  # the images — closing the supply-chain story with no separate hosting surface
  # or long-lived key. Artifact Hub (see Chart.yaml annotations) indexes the OCI
  # ref for discoverability. Like the image sign/attest steps, this is first
  # exercised on a v* tag publish, never on a PR. See docs/operations/release.md.
  chart-publish:
    # Runs only after every image leg succeeds, so a release never publishes a
    # chart whose referenced images failed to push.
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # checkout + create/upload the signed v2 CRD manifest release asset (Q276)
      packages: write # push the chart + its signature to GHCR
      id-token: write # KEYLESS cosign — same Fulcio/Rekor flow as the images
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Resolve publish tag
        id: tag
        # Same guard as the image job: refuse to publish from a non-tag ref with
        # no explicit input so a manual run on a branch can't push a junk version.
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          # Defense in depth (Q124): reject non-tag refs so a branch dispatch
          # can't reach the keyless chart sign step. See the image job's note.
          if [[ "${GITHUB_REF}" != refs/tags/* ]]; then
            echo "refusing to publish: ref '${GITHUB_REF}' is not a tag; publish runs only on v* tags" >&2
            exit 1
          fi
          tag="${INPUT_TAG:-}"
          if [[ -z "${tag}" ]]; then
            tag="${GITHUB_REF_NAME}"
          fi
          if [[ "${tag}" != v* ]]; then
            echo "refusing to publish: resolved tag '${tag}' is not a v* version" >&2
            exit 1
          fi
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          # Derive whether this is a prerelease straight from the tag (Q293), so the
          # chart's artifacthub.io/prerelease annotation and the GitHub Release's
          # --prerelease flag both flow from one source of truth — no hand-flipped
          # PR before/after each cut. A tag is a prerelease when its SemVer core is
          # 0.x (major 0 is pre-1.0 by SemVer) OR it carries a prerelease suffix
          # (any '-', e.g. -rc.1/-alpha/-beta). Everything else (>=1.0.0, no suffix)
          # is a stable GA release.
          version="${tag#v}"
          if [[ "${version}" == 0.* || "${version}" == *-* ]]; then
            prerelease=true
          else
            prerelease=false
          fi
          echo "prerelease=${prerelease}" >> "${GITHUB_OUTPUT}"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Cross-compiles the gag-migrate release binaries (Q306). Same Go version
          # source as the other workflows so the CLI is built with the toolchain the
          # rest of the release is.
          go-version-file: go.work
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # Pin the signer version (the action otherwise floats to latest). Keep
          # in step with COSIGN_VERSION in the Makefile so a local
          # `make verify-release` verifies with the same version that signed.
          cosign-release: v2.5.2
      - name: Log in to GHCR (docker — for cosign)
        # cosign authenticates via the docker credential store
        # (~/.docker/config.json), NOT helm's separate OCI store, so it needs its
        # own login to read the manifest and push the signature. Without this,
        # `cosign sign` fails with "UNAUTHORIZED: authentication required" even
        # though `helm push` (which uses the helm login below) succeeds.
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to GHCR (helm OCI)
        # helm keeps its OWN OCI credential store, so the docker login above does
        # not authenticate helm — log helm in explicitly too. Token on stdin keeps
        # it out of the process args/listing.
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          printf '%s' "${GHCR_TOKEN}" | helm registry login "${REGISTRY}" \
            --username "${ACTOR}" --password-stdin
      - name: Package, push, and sign the chart (keyless)
        id: chart
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          OWNER: ${{ github.repository_owner }}
          PRERELEASE: ${{ steps.tag.outputs.prerelease }}
        run: |
          set -euo pipefail
          # Chart SemVer has no leading 'v'. Derive both chart version and
          # appVersion from the release tag so the published artifact's version
          # always matches the release — no manual Chart.yaml bump to forget.
          version="${TAG#v}"
          repo="oci://${REGISTRY}/${OWNER}/charts"
          # Stamp the tag-derived prerelease state into the chart's Artifact Hub
          # annotation at package time (Q293). yq (mikefarah v4, preinstalled on
          # ubuntu-latest) writes it as a quoted string via strenv, matching the
          # committed format. This replaces the hand-flipped prerelease PR — the
          # in-repo value is now just a dev placeholder the pipeline overrides.
          yq -i '.annotations["artifacthub.io/prerelease"] = strenv(PRERELEASE)' \
            charts/actions-gateway/Chart.yaml
          helm package charts/actions-gateway \
            --version "${version}" --app-version "${version}" \
            --destination "${RUNNER_TEMP}"
          pkg="${RUNNER_TEMP}/actions-gateway-${version}.tgz"
          # helm push prints "Digest: sha256:…" on its own line; capture it so the
          # signature binds to the exact pushed bytes, not the floating tag.
          # scripts/fetch/retry.sh absorbs transient GHCR push errors; its stdout (the
          # successful attempt's output) is logged and parsed for the digest.
          scripts/fetch/retry.sh helm push "${pkg}" "${repo}" >"${RUNNER_TEMP}/push.log" 2>&1
          cat "${RUNNER_TEMP}/push.log"
          digest="$(awk '/^Digest: /{print $2}' "${RUNNER_TEMP}/push.log")"
          if [[ -z "${digest}" ]]; then
            echo "could not parse pushed chart digest from helm push output" >&2
            exit 1
          fi
          ref="${REGISTRY}/${OWNER}/charts/actions-gateway@${digest}"
          # Keyless: same ambient OIDC → Fulcio → Rekor path as the image signing.
          scripts/fetch/retry.sh cosign sign --yes "${ref}"
          echo "ref=${ref}" >> "${GITHUB_OUTPUT}"
      - name: Package, push, and sign the v2 CRD chart (keyless)
        id: chart_crds_v2
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          OWNER: ${{ github.repository_owner }}
          PRERELEASE: ${{ steps.tag.outputs.prerelease }}
        run: |
          set -euo pipefail
          # The opt-in actions-gateway-crds-v2 chart (v2alpha1 CRDs), published
          # separately so the large pod-template CRDs do not bloat the main chart's
          # Helm release (Q149). Same versioning/sign path as the main chart.
          version="${TAG#v}"
          repo="oci://${REGISTRY}/${OWNER}/charts"
          # Same tag-derived prerelease stamp as the main chart (Q293).
          yq -i '.annotations["artifacthub.io/prerelease"] = strenv(PRERELEASE)' \
            charts/actions-gateway-crds-v2/Chart.yaml
          helm package charts/actions-gateway-crds-v2 \
            --version "${version}" --app-version "${version}" \
            --destination "${RUNNER_TEMP}"
          pkg="${RUNNER_TEMP}/actions-gateway-crds-v2-${version}.tgz"
          scripts/fetch/retry.sh helm push "${pkg}" "${repo}" >"${RUNNER_TEMP}/push-crds-v2.log" 2>&1
          cat "${RUNNER_TEMP}/push-crds-v2.log"
          digest="$(awk '/^Digest: /{print $2}' "${RUNNER_TEMP}/push-crds-v2.log")"
          if [[ -z "${digest}" ]]; then
            echo "could not parse pushed v2 CRD chart digest from helm push output" >&2
            exit 1
          fi
          ref="${REGISTRY}/${OWNER}/charts/actions-gateway-crds-v2@${digest}"
          scripts/fetch/retry.sh cosign sign --yes "${ref}"
          echo "ref=${ref}" >> "${GITHUB_OUTPUT}"
      - name: Compose and create the GitHub Release (prerelease-aware, Q293)
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          PRERELEASE: ${{ steps.tag.outputs.prerelease }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Have publish.yml write the whole Release (Q293) instead of leaving a
          # minimal, wrong-flag one for a maintainer to fix by hand. The pipeline
          # already holds every piece of data:
          #   - the five immutable multi-arch INDEX digests operators pin to,
          #     resolved straight from the just-pushed tag (never the floating tag
          #     after the fact) — same ref the "Record published digest" summary
          #     bullets carry;
          #   - the one-line `make verify-release` command that checks every
          #     signature + SLSA provenance;
          #   - a changelog, via gh's --generate-notes (auto-detects the previous
          #     tag and appends a compare link after our curated block);
          # and the tag-derived --prerelease flag so an RC is never mislabelled GA.
          #
          # Guard: create ONLY if the tag has no Release yet, so a maintainer who
          # curated notes ahead of the tag is never clobbered. When absent, this is
          # the authoritative create; the v2-CRD asset step below only uploads.
          if gh release view "${TAG}" --repo "${REPO}" >/dev/null 2>&1; then
            echo "release ${TAG} already exists; leaving its notes and flags untouched"
            exit 0
          fi
          notes="${RUNNER_TEMP}/release-notes.md"
          # Single-quoted printf format strings: the %s must reach printf unexpanded.
          # shellcheck disable=SC2016
          {
            printf '## Container images\n\n'
            printf 'Pin these immutable multi-arch index digests (not the floating `%s` tag):\n\n' "${TAG}"
          } > "${notes}"
          for name in gmc agc proxy worker wrapper; do
            image="${REGISTRY}/${OWNER}/${name}"
            # The index digest — the ref that serves both amd64 and arm64. For a
            # multi-arch tag, imagetools' top-level .Manifest is the index descriptor.
            digest="$(docker buildx imagetools inspect "${image}:${TAG}" \
              --format '{{.Manifest.Digest}}')"
            if [[ "${digest}" != sha256:* ]]; then
              echo "could not resolve index digest for ${image}:${TAG}" >&2
              exit 1
            fi
            # Single-quoted printf format string: the %s must reach printf unexpanded.
            # shellcheck disable=SC2016
            printf -- '- **%s** — `%s@%s`\n' "${name}" "${image}" "${digest}" >> "${notes}"
          done
          {
            printf '\n## Verify\n\n'
            printf 'Verify every image + chart signature and the SLSA build provenance:\n\n'
            printf '    make verify-release VERSION=%s\n' "${TAG}"
          } >> "${notes}"
          # --prerelease only when the tag says so; gh otherwise auto-marks a
          # stable SemVer tag as "latest".
          extra=()
          if [[ "${PRERELEASE}" == "true" ]]; then
            extra+=(--prerelease)
          fi
          gh release create "${TAG}" --repo "${REPO}" --title "${TAG}" \
            --notes-file "${notes}" --generate-notes "${extra[@]}"
      - name: Render, sign, and attach the v2 CRD manifest to the release (keyless, Q276)
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # A helm-free manual install path (Q276): the opt-in v2 CRD chart is too
          # large to `helm install` (its release Secret exceeds the 1 MiB limit), so
          # operators apply the rendered CRDs server-side. Ship that render as a
          # signed release asset so the manual path is a single command with no helm
          # or chart checkout:
          #   kubectl apply --server-side -f <release-url>/actions-gateway-crds-v2.yaml
          # Rendered for the DEFAULT gmc-system namespace — the conversion webhook
          # clientConfig namespace bakes in at render time, so a GMC in another
          # namespace still uses the `helm template --set … | kubectl apply` path in
          # install.md. Keyless-signed via the SAME Fulcio/Rekor path as the charts
          # (sign-blob → a Sigstore bundle that `cosign verify-blob --bundle` checks
          # with no key material), answering the "release assets are mutable" note in
          # release.md.
          out="${RUNNER_TEMP}/actions-gateway-crds-v2.yaml"
          helm template actions-gateway-crds-v2 charts/actions-gateway-crds-v2 \
            --namespace gmc-system > "${out}"
          scripts/fetch/retry.sh cosign sign-blob --yes \
            --bundle "${out}.cosign.bundle" "${out}"
          # The preceding step already created the Release with full notes; this is
          # a defensive fallback (create a minimal one only if the tag somehow still
          # has none) so the asset upload can't fail on a missing Release. Uploading
          # with --clobber replaces a prior same-named asset, keeping re-publish
          # idempotent, and never touches curated notes.
          if ! gh release view "${TAG}" --repo "${REPO}" >/dev/null 2>&1; then
            gh release create "${TAG}" --repo "${REPO}" --title "${TAG}" --generate-notes
          fi
          gh release upload "${TAG}" --repo "${REPO}" --clobber \
            "${out}" "${out}.cosign.bundle"
      - name: Build, sign, and attach the gag-migrate CLI binaries (keyless, Q306)
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # gag-migrate (the one-shot v1->v2 migration CLI) was source-build-only
          # (Q306). Cross-compile it for the operator platform matrix and ship the
          # binaries as release assets so running the migration needs neither a Go
          # toolchain nor a repo checkout. Keyless-signed over a single SHA256SUMS
          # manifest via the SAME Fulcio/Rekor sign-blob path as the v2 CRD asset
          # above — no key material and no stored secret (the project forbids
          # secrets-as-config). Verify with `cosign verify-blob --bundle
          # SHA256SUMS.cosign.bundle SHA256SUMS`, then `sha256sum -c SHA256SUMS`.
          out="${RUNNER_TEMP}/migrate-bin"
          scripts/release/build-migrate-binaries.sh "${out}" "${TAG}"
          scripts/fetch/retry.sh cosign sign-blob --yes \
            --bundle "${out}/SHA256SUMS.cosign.bundle" "${out}/SHA256SUMS"
          # The Release already exists (created above); attach every binary, the
          # checksum manifest, and its signature. --clobber keeps re-publish idempotent.
          gh release upload "${TAG}" --repo "${REPO}" --clobber \
            "${out}"/gag-migrate-* "${out}/SHA256SUMS" "${out}/SHA256SUMS.cosign.bundle"
      - name: Record published chart in the run summary
        env:
          REF: ${{ steps.chart.outputs.ref }}
          REF_CRDS_V2: ${{ steps.chart_crds_v2.outputs.ref }}
          TAG: ${{ steps.tag.outputs.tag }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          # Single-quoted printf format strings: the %s must reach printf unexpanded.
          # shellcheck disable=SC2016
          {
            printf -- '- **chart** — `%s`\n' "${REF}"
            printf -- '  install: `helm install actions-gateway oci://%s/%s/charts/actions-gateway --version %s`\n' \
              "${REGISTRY}" "${OWNER}" "${TAG#v}"
            printf -- '- **chart (v2 CRDs, opt-in)** — `%s`\n' "${REF_CRDS_V2}"
            printf -- '  install (no helm, default gmc-system namespace): `kubectl apply --server-side -f https://github.com/%s/releases/download/%s/actions-gateway-crds-v2.yaml`\n' \
              "${REPO}" "${TAG}"
            printf -- '  install (helm render — for a custom GMC namespace; the chart exceeds the 1 MiB release-Secret limit so `helm install` cannot store it): `helm template actions-gateway-crds-v2 oci://%s/%s/charts/actions-gateway-crds-v2 --version %s --namespace <ns> | kubectl apply --server-side -f -`\n' \
              "${REGISTRY}" "${OWNER}" "${TAG#v}"
          } >> "${GITHUB_STEP_SUMMARY}"
