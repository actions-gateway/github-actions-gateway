# Q594 throwaway probe — measures how dorny/paths-filter's picomatch treats
# '**.go' vs '**/*.go'. Never merged; this branch is deleted after the run.
name: q594-picomatch-probe
on:
  push:
    branches: ["claude/**"]

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: f
        with:
          list-files: json
          filters: |
            doublestar:
              - '**.go'
            globstar:
              - '**/*.go'
            singlestar:
              - '*.go'
            pinned:
              - 'cmd/**.go'
            everything:
              - '**'
      - name: report
        run: |
          echo "changed files seen: ${{ steps.f.outputs.everything_files }}"
          echo "doublestar ('**.go')     = ${{ steps.f.outputs.doublestar }} -> ${{ steps.f.outputs.doublestar_files }}"
          echo "globstar   ('**/*.go')   = ${{ steps.f.outputs.globstar }} -> ${{ steps.f.outputs.globstar_files }}"
          echo "singlestar ('*.go')      = ${{ steps.f.outputs.singlestar }} -> ${{ steps.f.outputs.singlestar_files }}"
          echo "pinned     ('cmd/**.go') = ${{ steps.f.outputs.pinned }} -> ${{ steps.f.outputs.pinned_files }}"
