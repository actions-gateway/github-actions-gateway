# The RWX class the harness exercises. csi-driver-nfs provisions one
# subdirectory of the export per volume and mounts it into every claiming pod,
# which is what makes ReadWriteMany real rather than declared.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gag-rwx-nfs
provisioner: nfs.csi.k8s.io
parameters:
  server: nfs-server.gag-rwx-storage.svc.cluster.local
  share: /
reclaimPolicy: Delete
volumeBindingMode: Immediate
mountOptions:
  - nfsvers=4.1
