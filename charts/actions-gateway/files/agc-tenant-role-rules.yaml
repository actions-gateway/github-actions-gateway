# patch on pods (Q502): metadata-only annotation stamps, never a spec or status
# write — the reaper marks its own deletions (deletion-reason) so they are never
# read as recoverable disruptions, the scale-set recovery claim (eviction-handled-at)
# makes re-runs at-most-once per disrupted pod, and the job-completed-at stamp gives
# an orphaned Running worker its reap deadline. The latter two writes shipped before
# this grant existed and were silently 403'd on real clusters; envtest does not
# enforce RBAC, which is how that stayed invisible.
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch", "create", "patch", "delete"]
- apiGroups: [""]
  resources: ["pods/status"]
  verbs: ["get"]
# pods.metrics.k8s.io (read-only): the worker usage sampler lists PodMetrics
# (metrics-server) to aggregate per-RunnerSet × container CPU/memory peaks into
# the right-sizing metrics (Q359). PodMetrics are namespaced, so the per-tenant
# RoleBinding scopes this to the tenant namespace. The AGC degrades gracefully
# when metrics-server is absent — the grant is still shipped by default so
# usage sampling works out of the box wherever metrics-server exists.
- apiGroups: ["metrics.k8s.io"]
  resources: ["pods"]
  verbs: ["get", "list"]
# resourcequotas (read-only): the RunnerGroup reconciler reads the namespace
# ResourceQuota to compute the WorkerQuota{Pressure,Exceeded} conditions (Q82) —
# correlating the worker pool's footprint against the quota's hard/used. The
# quota is platform-owned (Q130); the AGC never creates or mutates it, so this
# grant is strictly get/list/watch.
- apiGroups: [""]
  resources: ["resourcequotas"]
  verbs: ["get", "list", "watch"]
# events: the RunnerGroup reconciler emits Kubernetes Events on credential,
# agent-pool, listener, and deregistration failures plus Ready transitions
# and worker-pod reaps. Both groups are required: the AGC's new-style
# recorder (mgr.GetEventRecorder) writes events.k8s.io/v1 Events — with only
# the core ("") grant those writes are silently 403'd.
# get/list on the core group additionally serve the capacity gate's
# AutoscalerVerdict mode (Q406): it reads a stuck worker pod's own Events to
# learn whether the cluster autoscaler declined to add a node for it. Without
# them that mode fails open — it never gates — rather than erroring. watch is
# deliberately withheld: the reads are field-selected to one pod at a time and
# the AGC runs no Event informer.
- apiGroups: [""]
  resources: ["events"]
  verbs: ["get", "list", "create", "patch"]
- apiGroups: ["events.k8s.io"]
  resources: ["events"]
  verbs: ["create", "patch"]
# list on secrets: the agent pool enumerates its own per-runner Secrets to
# reconcile pool state (metadata-only PartialObjectMetadataList — names/labels,
# never credential bodies). watch is deliberately omitted (no Secret informer).
# update: the single-use JIT agent recycle (Q114) rewrites an agent's Secret
# in place after re-registering it post-job.
# patch (Q466): the agent pool back-fills its owner reference onto agent Secrets
# written before owner references existed, so every one of them names exactly one
# owner and is garbage-collected with it. It is deliberately a patch and not an
# update: a merge patch built from an empty Secret shell writes metadata only, where
# an update would have to read and re-send the credential body to change one
# metadata field. The role already grants update, so this adds no authority the AGC
# did not have — it buys a narrower write.
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list", "create", "update", "patch", "delete"]
# configmaps (Q606): the per-RunnerSet guard ConfigMap persisting a scale-set
# listener's concluded-job state across a hard kill, so a restarted AGC does not
# provision a worker for a job that is over. get/create/update only: reads are
# uncached (the AGC runs no ConfigMap informer, so no list/watch), and the
# ConfigMap is owner-ref'd to its RunnerSet, so deletion is the garbage
# collector's, not the AGC's.
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "create", "update"]
- apiGroups: ["actions-gateway.github.com"]
  resources: ["runnergroups"]
  verbs: ["get", "list", "watch", "update", "patch"]
- apiGroups: ["actions-gateway.github.com"]
  resources: ["runnergroups/status", "runnergroups/finalizers"]
  verbs: ["get", "update", "patch"]
# v2 (actions-gateway.com): the RunnerSet reconciler reconciles RunnerSets and
# reads their references (gatewayRef → ActionsGateway, proxyRef/defaultProxyRef →
# EgressProxy, templateRef → RunnerTemplate) at runtime to resolve the worker pod
# shape and egress proxy (§H.7). All four are namespaced, so the per-tenant
# RoleBinding to this ClusterRole scopes the grants to the tenant namespace.
# Cluster-scoped ClusterRunnerTemplate reads need a ClusterRoleBinding and are
# wired separately (M3b); the namespaced RunnerTemplate gives v1 parity here.
- apiGroups: ["actions-gateway.com"]
  resources: ["runnersets"]
  verbs: ["get", "list", "watch", "update", "patch"]
- apiGroups: ["actions-gateway.com"]
  resources: ["runnersets/status", "runnersets/finalizers"]
  verbs: ["get", "update", "patch"]
- apiGroups: ["actions-gateway.com"]
  resources: ["actionsgateways", "egressproxies", "runnertemplates"]
  verbs: ["get", "list", "watch"]
