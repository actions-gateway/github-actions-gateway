# Secret reads the GMC needs in a tenant namespace (Q1188). The GMC holds no
# cluster-wide Secret read: it binds this ClusterRole to its own ServiceAccount
# with a RoleBinding in each namespace carrying a tenant marker, and
# gmc-tenant-resource-guard confines that RoleBinding to tenant namespaces.
#
# get: the credential Secret's existence check and the Secrets the GMC owns
# (CreateOrPatch reads before it writes). list/watch: the per-namespace
# metadata-only informer that re-triggers a gateway when its credential Secret
# appears or disappears. RBAC cannot grant a metadata-only list, so these verbs
# are the full-body grant, confined by the binding's namespace.
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list", "watch"]
# Pod reads (Q1328): gateway teardown keeps the workload NetworkPolicy until no
# worker pod of the gateway's RunnerSets remains, terminating ones included, and
# reads that from an uncached metadata list. No pod informer runs on this grant.
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["list"]
