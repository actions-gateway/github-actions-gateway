{{- /*
The gmc-tenant-secret-reader rules are single-sourced in
files/gmc-tenant-secret-reader-rules.yaml; this template embeds them via
.Files.Get, and the GMC integration suite installs the SAME file, so the role
granted in envtest is the one production ships. Edit the fragment, not this block.
*/ -}}
# gmc-tenant-secret-reader — the GMC's Secret reads, granted one tenant namespace
# at a time (Q1188). The GMC creates a RoleBinding to this ClusterRole, naming its
# own ServiceAccount, in each namespace carrying a tenant marker; it holds no
# cluster-wide Secret read.
#
# The name is intentionally UNPREFIXED and must stay `gmc-tenant-secret-reader`:
# the GMC manager-role grants `bind` only on this exact resourceName, so renaming
# it leaves the GMC unable to read any Secret.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: gmc-tenant-secret-reader
  labels:
    app.kubernetes.io/name: actions-gateway
    app.kubernetes.io/component: gmc-tenant-secret-reader
    app.kubernetes.io/part-of: actions-gateway
    app.kubernetes.io/managed-by: {{ .Release.Service }}
rules:
  {{- .Files.Get "files/gmc-tenant-secret-reader-rules.yaml" | trimSuffix "\n" | nindent 0 }}
