{{- /*
The agc-clusterrunnertemplate-reader rules are single-sourced in
files/agc-clusterrunnertemplate-reader-rules.yaml; this template embeds them via
.Files.Get. Edit the fragment, not this block. Unlike agc-tenant-role, no test
reads this fragment back, so nothing catches drift between it and the
+kubebuilder:rbac markers in cmd/agc/internal/controller/doc.go — keep the two in
sync by hand when adding a rule (Q454 tracks closing that).
*/ -}}
# agc-clusterrunnertemplate-reader — read-only access to the cluster-scoped kinds
# the AGC depends on and a namespaced RoleBinding cannot grant: ClusterRunnerTemplate
# and (since Q450) RuntimeClass, whose pod overhead is part of a worker's
# ResourceQuota charge. The GMC binds this ClusterRole to each gateway's AGC
# ServiceAccount via a per-gateway ClusterRoleBinding (M3b, §H.16 #1).
#
# The name is now narrower than the contents, and is kept anyway: it is intentionally
# UNPREFIXED and must stay
# `agc-clusterrunnertemplate-reader`: the GMC manager-role grants `bind` only on
# this exact resourceName (not create/escalate), so renaming it breaks the
# per-gateway ClusterRoleBinding the v2 ActionsGateway reconciler creates.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: agc-clusterrunnertemplate-reader
  labels:
    app.kubernetes.io/name: actions-gateway
    app.kubernetes.io/component: agc-clusterrunnertemplate-reader
    app.kubernetes.io/part-of: actions-gateway
    app.kubernetes.io/managed-by: {{ .Release.Service }}
rules:
  {{- .Files.Get "files/agc-clusterrunnertemplate-reader-rules.yaml" | trimSuffix "\n" | nindent 0 }}
