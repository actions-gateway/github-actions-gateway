{{- if .Values.admissionPolicy.enabled }}
{{- $paramName := printf "%s-priorityclass-allowlist" (include "actions-gateway.namePrefix" .) }}
# ValidatingAdmissionPolicy backstop for the platform PriorityClass allowlist
# (Q289 / Appendix G §G.7). RunnerGroup CRs have no webhook of their own — they are
# normally authored only by the GMC from an already-validated ActionsGateway — so a
# tenant granted direct `runnergroups` write RBAC would bypass the allowlist
# entirely. This policy closes that path for ANY writer, and re-validates every
# write to existing objects (narrowing the stored-object residual a webhook cannot
# reach). The v2 runnersets/runnertemplates rules (Q323) are the same
# defense-in-depth for the webhook-gated v2 kinds: webhook-outage/bypass coverage
# plus stored-object re-validation. Requires Kubernetes >= 1.30. See
# docs/operations/security-operations.md § Priority classes.
#
# The paramKind is the cluster-scoped PriorityClassAllowlist CR, NOT a ConfigMap
# (Q492). A core-type paramKind is permanently broken for the rest of that
# kube-apiserver process the moment the set of bindings naming it goes empty for one
# refresh tick — which `helm uninstall` does, leaving either a silently stale
# allowlist or a cluster-wide denial of every matched write, recoverable only by an
# apiserver restart (impossible on GKE/EKS/AKS). A CRD paramKind gets a fresh
# dynamic informer per context and survives the same transition; the contrast is
# measured by scripts/vap-param-informer-check.sh. See
# docs/development/kubernetes-conventions.md (paramKind: never a core type).
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ include "actions-gateway.namePrefix" . }}-priorityclass-allowlist-guard
  labels:
    {{- include "actions-gateway.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  paramKind:
    apiVersion: actions-gateway.com/v2beta1
    kind: PriorityClassAllowlist
  matchConstraints:
    resourceRules:
      - apiGroups: ["actions-gateway.github.com"]
        apiVersions: ["v1alpha1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["runnergroups"]
      # Q323: the v2 carriers of the same two PriorityClass routes (runnersets:
      # priorityTiers; runnertemplates: podTemplate.spec.priorityClassName). Both
      # versions share identical field paths. ClusterRunnerTemplate is exempt —
      # cluster-scoped and platform-authored, matching its webhook exemptions.
      - apiGroups: ["actions-gateway.com"]
        apiVersions: ["v2alpha1", "v2beta1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["runnersets", "runnertemplates"]
  variables:
    # The allowlist, read straight off the param CR. The CRD schema already
    # constrains each entry to a DNS 1123 subdomain and the list to a set, so
    # unlike the ConfigMap this replaced there is no string to split and no
    # malformed-value case to defend against — the apiserver rejects those at
    # write time. An absent or empty list denies every named class: the secure
    # default, unchanged.
    - name: allowed
      expression: >-
        has(params.spec) && has(params.spec.allowedPriorityClasses)
        ? params.spec.allowedPriorityClasses : []
    - name: tierClasses
      expression: "has(object.spec.priorityTiers) ? object.spec.priorityTiers.map(t, t.priorityClassName) : []"
    - name: podClass
      expression: >-
        (has(object.spec.podTemplate) && has(object.spec.podTemplate.spec)
         && has(object.spec.podTemplate.spec.priorityClassName))
        ? object.spec.podTemplate.spec.priorityClassName : ''
  validations:
    - expression: "variables.tierClasses.all(c, c in variables.allowed)"
      messageExpression: >-
        'priorityTiers priorityClassName ' + variables.tierClasses.filter(c, !(c in variables.allowed)).join(', ')
        + ' is not in the platform PriorityClassAllowlist; a PriorityClass sets cluster-wide scheduling preemption order, so the platform admin must pre-create it and add it to the allowlist'
      reason: Forbidden
    - expression: "variables.podClass == '' || variables.podClass in variables.allowed"
      messageExpression: >-
        'podTemplate.spec.priorityClassName ' + variables.podClass
        + ' is not in the platform PriorityClassAllowlist; a PriorityClass sets cluster-wide scheduling preemption order, so the platform admin must pre-create it and add it to the allowlist'
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ include "actions-gateway.namePrefix" . }}-priorityclass-allowlist-guard-binding
  labels:
    {{- include "actions-gateway.labels" . | nindent 4 }}
spec:
  policyName: {{ include "actions-gateway.namePrefix" . }}-priorityclass-allowlist-guard
  # Deny is the secure default. The apiserver resolves params before any
  # per-object filtering, so a missing param CR denies EVERY matched write until
  # it is recreated — fail closed, never silently off. The CR ships unconditionally
  # from priorityclass-allowlist.yaml, so that state is an explicit deletion.
  validationActions: [Deny]
  paramRef:
    # Cluster-scoped param: name only, no namespace.
    name: {{ $paramName }}
    parameterNotFoundAction: Deny
{{- end }}
