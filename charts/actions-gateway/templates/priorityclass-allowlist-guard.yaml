{{- if .Values.admissionPolicy.enabled }}
{{- /*
The param ConfigMap the policy binding references: the admin-owned watched
allowlist ConfigMap when priorityClassAllowlist.configMapName is set (keep it a
superset of allowedPriorityClasses — the apiserver cannot read the GMC flag), else
a chart-rendered ConfigMap holding exactly .Values.allowedPriorityClasses, so the
webhook flag and this policy stay in lockstep from one values entry.
*/ -}}
{{- $paramCM := .Values.priorityClassAllowlist.configMapName | default (printf "%s-priorityclass-allowlist" (include "actions-gateway.namePrefix" .)) }}
# ValidatingAdmissionPolicy backstop for the platform PriorityClass allowlist
# (Q289 / Appendix G §G.7). RunnerGroup CRs have no webhook of their own — they are
# normally authored only by the GMC from an already-validated ActionsGateway — so a
# tenant granted direct `runnergroups` write RBAC would bypass the allowlist
# entirely. This policy closes that path for ANY writer, and re-validates every
# write to existing objects (narrowing the stored-object residual a webhook cannot
# reach). The v2 runnersets/runnertemplates rules (Q323) are the same
# defense-in-depth for the webhook-gated v2 kinds: webhook-outage/bypass coverage
# plus stored-object re-validation. Requires Kubernetes >= 1.30. See
# docs/operations/security-operations.md § Priority classes.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ include "actions-gateway.namePrefix" . }}-priorityclass-allowlist-guard
  annotations:
    # Q444 — this policy MUST outlive `helm uninstall`, and the reason is an
    # apiserver constraint, not a Helm one.
    #
    # The apiserver runs ONE param informer per paramKind GVR, shared by every
    # policy that names it, and tears it down when the last such policy is
    # deleted. That teardown is permanent for the life of the apiserver process:
    # the informer is cached by GVR, and the cached instance is already stopped,
    # so a later policy naming the same paramKind gets the dead informer back
    # with an empty store. Every binding that resolves a ConfigMap param then
    # fails with `no params found for policy binding` — and with
    # parameterNotFoundAction: Deny that denies EVERY matched write
    # (runnergroups, runnersets, runnertemplates), cluster-wide, forever.
    # Measured on Kubernetes 1.35.5 and 1.36.1; only a kube-apiserver restart
    # clears it, which is not an option on a managed control plane.
    #
    # So `helm uninstall` + reinstall must not delete this object. Retaining it
    # is safe: a ValidatingAdmissionPolicy enforces NOTHING without a binding,
    # and the binding below is deliberately NOT retained — it is deleted on
    # uninstall (and when admissionPolicy.enabled is set to false), which is what
    # actually stops enforcement. The param ConfigMap is likewise not retained;
    # with the policy alive the informer keeps observing its deletion and
    # recreation normally. See docs/operations/security-operations.md
    # § The policy object survives `helm uninstall` — on purpose.
    helm.sh/resource-policy: keep
  labels:
    {{- include "actions-gateway.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  paramKind:
    apiVersion: v1
    kind: ConfigMap
  matchConstraints:
    resourceRules:
      - apiGroups: ["actions-gateway.github.com"]
        apiVersions: ["v1alpha1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["runnergroups"]
      # Q323: the v2 carriers of the same two PriorityClass routes (runnersets:
      # priorityTiers; runnertemplates: podTemplate.spec.priorityClassName). Both
      # versions share identical field paths. ClusterRunnerTemplate is exempt —
      # cluster-scoped and platform-authored, matching its webhook exemptions.
      - apiGroups: ["actions-gateway.com"]
        apiVersions: ["v2alpha1", "v2beta1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["runnersets", "runnertemplates"]
  variables:
    # The allowlist: the param ConfigMap's allowedPriorityClasses value, split on
    # the same separators the GMC's ConfigMap watcher accepts. A missing key or
    # empty value denies every named class — the secure default.
    - name: allowed
      expression: >-
        (has(params.data) && 'allowedPriorityClasses' in params.data)
        ? params.data['allowedPriorityClasses'].replace('\n', ',').replace('\r', ',').replace('\t', ',').replace(' ', ',').split(',').filter(s, s != '')
        : []
    - name: tierClasses
      expression: "has(object.spec.priorityTiers) ? object.spec.priorityTiers.map(t, t.priorityClassName) : []"
    - name: podClass
      expression: >-
        (has(object.spec.podTemplate) && has(object.spec.podTemplate.spec)
         && has(object.spec.podTemplate.spec.priorityClassName))
        ? object.spec.podTemplate.spec.priorityClassName : ''
  validations:
    - expression: "variables.tierClasses.all(c, c in variables.allowed)"
      messageExpression: >-
        'priorityTiers priorityClassName ' + variables.tierClasses.filter(c, !(c in variables.allowed)).join(', ')
        + ' is not in the platform PriorityClass allowlist ConfigMap; a PriorityClass sets cluster-wide scheduling preemption order, so the platform admin must pre-create it and add it to the allowlist'
      reason: Forbidden
    - expression: "variables.podClass == '' || variables.podClass in variables.allowed"
      messageExpression: >-
        'podTemplate.spec.priorityClassName ' + variables.podClass
        + ' is not in the platform PriorityClass allowlist ConfigMap; a PriorityClass sets cluster-wide scheduling preemption order, so the platform admin must pre-create it and add it to the allowlist'
      reason: Forbidden
---
# Deliberately NOT annotated helm.sh/resource-policy: keep — unlike the policy
# above, the binding is the object that makes the policy enforce, so it must be
# removed by `helm uninstall` and by admissionPolicy.enabled=false. Deleting a
# binding does not disturb the apiserver's param informer (that is keyed to the
# policy's paramKind), so the uninstall/reinstall cycle stays safe. Read the Q444
# note on the policy's annotation before adding a retention policy here.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ include "actions-gateway.namePrefix" . }}-priorityclass-allowlist-guard-binding
  labels:
    {{- include "actions-gateway.labels" . | nindent 4 }}
spec:
  policyName: {{ include "actions-gateway.namePrefix" . }}-priorityclass-allowlist-guard
  # Deny is the secure default. The apiserver resolves params before any
  # per-object filtering, so a missing param ConfigMap denies EVERY matched
  # write until it is recreated — fail closed, never silently off. The ConfigMap
  # ships below (or is the admin-owned watched one), so that state is an
  # explicit deletion.
  validationActions: [Deny]
  paramRef:
    name: {{ $paramCM }}
    namespace: {{ .Release.Namespace }}
    parameterNotFoundAction: Deny
{{- if not .Values.priorityClassAllowlist.configMapName }}
---
# The chart-rendered allowlist parameter, generated from
# .Values.allowedPriorityClasses — the same list passed to the GMC as
# --allowed-priority-classes — so the webhook and this policy cannot drift. Empty
# (the default) permits no named class. When priorityClassAllowlist.configMapName
# is set, that admin-owned ConfigMap is the param instead and this one is not
# rendered.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $paramCM }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "actions-gateway.labels" . | nindent 4 }}
data:
  allowedPriorityClasses: {{ join "," .Values.allowedPriorityClasses | quote }}
{{- end }}
{{- end }}
