apiVersion: v2
name: actions-gateway
description: |-
  Gateway Manager Controller (GMC) for running GitHub Actions self-hosted
  runners in a shared Kubernetes cluster with zero idle compute. Installs the
  GMC, its RBAC, validating webhook, and admission policy; the v2 tenant CRDs
  ship in the separate actions-gateway-crds-v2 chart. Per-tenant AGC instances and egress proxy pools are
  provisioned by the GMC at runtime from each ActionsGateway CR — they are not
  installed by this chart.
type: application
# Chart version: bump on every chart change (templates, values, packaging).
version: 0.1.0
# appVersion tracks the released GMC/AGC/proxy image tag. The actual image
# references operators run live in values.yaml (pinned by digest in production).
appVersion: "0.1.0"
kubeVersion: ">=1.35.0-0"
keywords:
  - github-actions
  - self-hosted-runners
  - multi-tenant
  - operator
home: https://github.com/actions-gateway/github-actions-gateway
sources:
  - https://github.com/actions-gateway/github-actions-gateway
maintainers:
  - name: actions-gateway maintainers
annotations:
  # This committed value is a DEV PLACEHOLDER only. publish.yml derives the real
  # prerelease state from the release tag at package time (Q293) — 0.x or a
  # -rc/-alpha/-beta suffix ⇒ "true", a stable >=1.0.0 tag ⇒ "false" — and
  # overrides this annotation with `yq` before `helm package`, so there is no
  # hand-flipped prerelease PR to remember. See docs/operations/release.md
  # § Chart version & metadata.
  artifacthub.io/prerelease: "false"
