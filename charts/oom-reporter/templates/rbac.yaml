{{- if and .Values.allNamespaces .Values.namespaces }}
{{- fail "set namespaces or allNamespaces, not both" }}
{{- end }}
{{- if not (or .Values.allNamespaces .Values.namespaces) }}
{{- fail "set namespaces to those whose pods to write to, or allNamespaces=true" }}
{{- end }}
# The agent writes its node's report, which the report-writer policy holds it to:
# a Role cannot name a ConfigMap for each node.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "oom-reporter.agentName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "oom-reporter.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "oom-reporter.agentName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "oom-reporter.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "oom-reporter.agentName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "oom-reporter.agentName" . }}
    namespace: {{ .Release.Namespace }}
---
# The controller reads the reports and the agents here, and makes and deletes
# the reports.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "oom-reporter.controllerName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "oom-reporter.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "oom-reporter.controllerName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "oom-reporter.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "oom-reporter.controllerName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "oom-reporter.controllerName" . }}
    namespace: {{ .Release.Namespace }}
{{- if .Values.allNamespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "oom-reporter.fullname" . }}-pods
  labels:
    {{- include "oom-reporter.labels" . | nindent 4 }}
rules:
  {{- include "oom-reporter.podRules" . | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "oom-reporter.fullname" . }}-pods
  labels:
    {{- include "oom-reporter.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "oom-reporter.fullname" . }}-pods
subjects:
  - kind: ServiceAccount
    name: {{ include "oom-reporter.controllerName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- range .Values.namespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "oom-reporter.fullname" $ }}-pods
  namespace: {{ . }}
  labels:
    {{- include "oom-reporter.labels" $ | nindent 4 }}
rules:
  {{- include "oom-reporter.podRules" $ | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "oom-reporter.fullname" $ }}-pods
  namespace: {{ . }}
  labels:
    {{- include "oom-reporter.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "oom-reporter.fullname" $ }}-pods
subjects:
  - kind: ServiceAccount
    name: {{ include "oom-reporter.controllerName" $ }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
