# Keep CA_VERSION in scripts/e2e/autoscaler-cluster.sh — the cluster-autoscaler the
# live-autoscaler drift gate installs — on the newest PATCH of the minor it
# already pins. updatecli reads the current pin out of the script, resolves the
# newest published patch inside that minor, and opens a PR moving it. The pin is
# a shell variable default, not a package-manifest entry, so Dependabot is blind
# to it. Run by .github/workflows/updatecli.yml.
#
# Why this manifest exists (Q483): the drift gate is triggered by the version
# move, not by a clock, because a scheduled sweep would reinstall the same pinned
# image every week and assert the same strings. Before this manifest, the only
# thing that moved CA_VERSION was the kind bump PR that changed the Kubernetes
# minor — so every cluster-autoscaler PATCH release went untested until the next
# minor came round. A patch is where a quiet event-vocabulary reword can land as
# easily as anywhere else. Now each patch gets its own PR, that PR edits
# scripts/e2e/autoscaler-cluster.sh, and that path is in autoscaler-drift.yml's
# `changes` filter — so the gate runs and says whether upstream reworded.
#
# The MINOR is deliberately NOT resolved here. cluster-autoscaler ships one
# release series per Kubernetes minor, and the harness runs kind's default node
# image, so the CA minor is chosen by the kind version. Moving it is the kind
# bump PR's decision (see updatecli.d/kind.yaml); this manifest resolves patches
# and nothing else. That split is enforced in the source script, not just
# documented — scripts/updatecli/latest-cluster-autoscaler-patch.sh takes the
# current pin and can only return a version in the same minor.
#
# Release the PR's checks with "Approve and run" per
# docs/development/dependency-updates.md: a GITHUB_TOKEN-authored PR has its runs
# created and then withheld, and here the check IS the point of the PR.
name: 'Bump cluster-autoscaler (drift gate) patch within the pinned minor'

scms:
  repo:
    kind: github
    spec:
      owner: '{{ requiredEnv "UPDATECLI_OWNER" }}'
      repository: '{{ requiredEnv "UPDATECLI_REPO" }}'
      branch: main
      username: '{{ requiredEnv "UPDATECLI_ACTOR" }}'
      token: '{{ requiredEnv "UPDATECLI_GITHUB_TOKEN" }}'
      user: 'github-actions[bot]'
      email: '41898282+github-actions[bot]@users.noreply.github.com'

actions:
  pr:
    kind: github/pullrequest
    scmid: repo
    spec:
      # No auto-merge: a cluster-autoscaler bump is the drift experiment, and a
      # red gate wants a human decision — adopt the new vocabulary (update the
      # matcher and its recorded unit table) or hold the bump.
      labels:
        - dependencies

sources:
  currentPin:
    name: 'CA_VERSION currently pinned in scripts/e2e/autoscaler-cluster.sh'
    kind: file
    scmid: repo
    spec:
      file: scripts/e2e/autoscaler-cluster.sh
      # The sole `CA_VERSION:-` in the file is the default assignment; anchoring
      # on it keeps the version numbers in the surrounding comments out of the
      # match. matchpattern returns the whole match, so the prefix is trimmed off.
      matchpattern: 'CA_VERSION:-v\d+\.\d+\.\d+'
    transformers:
      - trimprefix: 'CA_VERSION:-'
  caVersion:
    name: 'Newest published cluster-autoscaler patch within that minor'
    kind: shell
    dependson:
      - currentPin
    spec:
      command: 'scripts/updatecli/latest-cluster-autoscaler-patch.sh {{ source "currentPin" }}'
      environments:
        - name: PATH

targets:
  pin:
    name: 'CA_VERSION in scripts/e2e/autoscaler-cluster.sh'
    kind: file
    disablesourceinput: true
    scmid: repo
    spec:
      file: scripts/e2e/autoscaler-cluster.sh
      matchpattern: '(CA_VERSION=\$\{CA_VERSION:-)v\d+\.\d+\.\d+(\})'
      replacepattern: '${1}{{ source "caVersion" }}${2}'
