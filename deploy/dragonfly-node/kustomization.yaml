apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# The Dragonfly node client (Q540): containerd on each Kata node pulls through
# a loopback dfdaemon that shares blobs node to node. Needs ../dragonfly's
# scheduler, which it shares with the mirrors' seed peer. See README.md.
resources:
  - namespace.yaml
  - client.yaml
  - scheduler-from-nodes.yaml
