apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Library entry `kata-dind` — see ../README.md. Each entry is its own base so an
# operator adopts exactly one; there is deliberately no aggregate kustomization
# that applies all three.
#
# PATCH THIS BASE WITH JSON 6902, NOT A STRATEGIC MERGE, wherever the patch
# reaches into a list (containers, initContainers, volumes, tolerations).
# kustomize has no schema for a CRD, so it falls back to an RFC 7386 JSON merge
# patch, which REPLACES a list wholesale instead of merging it by key — a patch
# naming only `initContainers[0].resources` silently drops that container's
# image, restartPolicy, capabilities and probe, and renders at exit 0. Measured
# on kustomize v5.8.1 (kubectl 1.36). ../../dogfood-e2e/overlays/kata is the
# worked example.
resources:
  - template.yaml
