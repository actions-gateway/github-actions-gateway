# One CNCF Distribution instance per upstream registry, each in pull-through
# cache mode. Proxy mode takes exactly one `proxy.remoteurl`, so the upstream set
# is the instance set — five, per the measured e2e job-time inventory
# (the Q408 plan, §2.2/§2.5).
#
# NAMING: a Service here must never be named `registry-*`. Kubernetes injects
# <SVCNAME>_SERVICE_HOST/_PORT into every pod in the namespace, and Distribution
# reads REGISTRY_-prefixed env vars as configuration. Measured on 3.1.1: an
# unrecognised REGISTRY_* var is logged as "Ignoring unrecognized environment
# variable" and skipped, but a name that maps onto a real config key
# (REGISTRY_HTTP_HOST, REGISTRY_HTTP_SECRET) would be applied silently. The
# `mirror-` prefix keeps every injected var outside that namespace. This is the
# same class of footgun that renamed the Athens Service to go-module-proxy.
#
# THE IMAGE SHIPS THE UPSTREAM *DEVELOPMENT* CONFIG at /etc/distribution/config.yml
# — `log.level: debug`, a debug listener on :5001 serving pprof and /metrics, and
# `storage.delete.enabled: true`. The env overrides below replace all three.
# Measured on 3.1.1: proxy mode answers DELETE with 405 even with delete enabled,
# so REGISTRY_STORAGE_DELETE_ENABLED=false removes this posture's dependence on
# that internal behaviour rather than being the only thing closing the endpoint.
#
# THE CATALOG IS CLOSED BY A FRONTING PROXY rather than by a registry setting.
# 3.1.1 registers /v2/_catalog unconditionally and carries one catalog knob,
# catalog.maxentries, which the config parser raises to 1000 whenever it is <= 0
# — so REGISTRY_CATALOG_MAXENTRIES=0 still answers 200 with every repository
# named. Each pod runs a `catalog-deny` container on 5000 that refuses that path
# and passes everything else to the registry on 127.0.0.1:5002, which is why the
# registry container declares 5002 and binds loopback. Its probes stay on 5000
# and so traverse the proxy: a proxy that fails to start leaves the pod NotReady
# and the Service endpointless, so the failure is closed rather than a pod that
# serves the catalog because its deny did not load. The proxy probes ITSELF at
# /haproxy-up, which catalog-deny.cfg answers and never forwards, so a proxy that
# hangs rather than exits restarts the proxy while a registry fault does not:
# measured with no registry running, the proxy answers /haproxy-up 200 and /v2/
# 503 in that same state. Probing it at /v2/ instead, as an earlier version did,
# fails the healthy proxy on every registry fault. See catalog-deny.cfg.
#
# ONE CONSEQUENCE FOR THE AUDIT POINT: the registry's access log records
# 127.0.0.1 as the remote address for every request, since the proxy is what
# connects to it. The request path and the user agent are forwarded unchanged
# and are what e2e-mirror-hits.sh reads; the source address survives only in
# the catalog-deny container's own log.
#
# The image runs as root by default and its /var/lib/registry is root-owned, so
# `fsGroup` is load-bearing: without it a non-root registry answers every pull
# with 500 `mkdir /var/lib/registry/docker: permission denied`.
#
# No toleration for dedicated=e2e, so these land on the system node pool and stay
# reachable while the e2e pool is scaled to zero — the Athens placement rule.
---
# docker.io — the v2 API host is registry-1.docker.io, not docker.io
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mirror-docker-io
  namespace: gag-registry-mirror
  labels:
    app: registry-mirror
    upstream: docker-io
spec:
  replicas: 1
  selector:
    matchLabels:
      app: registry-mirror
      upstream: docker-io
  template:
    metadata:
      labels:
        app: registry-mirror
        upstream: docker-io
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: registry
          image: registry:3.1.1@sha256:1be55279f18a2fe1a74edf2664cac61c1bea305b7b4642dab412e7affdcb3e33
          ports:
            - containerPort: 5002
          env:
            - name: REGISTRY_PROXY_REMOTEURL
              value: https://registry-1.docker.io
            - name: REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY
              value: /var/lib/registry
            - name: REGISTRY_STORAGE_DELETE_ENABLED
              value: "false"
            - name: REGISTRY_LOG_LEVEL
              value: info
            # The access log is this posture's audit point for what an untrusted
            # job asked the mirror to fetch (Q408 plan §3.4). Its remote address
            # is the pod's own loopback now — see the header.
            - name: REGISTRY_LOG_ACCESSLOG_DISABLED
              value: "false"
            # Empty unbinds the bundled config's :5001 pprof + /metrics
            # listener. That also gives up /debug/health, the only endpoint that
            # reflects the storage-driver check — see the probe note below.
            - name: REGISTRY_HTTP_DEBUG_ADDR
              value: ""
            # Loopback only: the pod network reaches the catalog-deny
            # container on 5000, never this one. See the header.
            - name: REGISTRY_HTTP_ADDR
              value: 127.0.0.1:5002
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: storage
              mountPath: /var/lib/registry
          resources:
            requests:
              cpu: "25m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          # /v2/ answers 200 from the API layer alone: measured, a registry
          # whose storage root is unwritable serves 200 here and 500 for every
          # pull. So this proves the process is up, not that the cache works.
          # What closes that gap is fsGroup above, not the probe.
          readinessProbe:
            httpGet:
              path: /v2/
              port: 5000
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /v2/
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 20
        - name: catalog-deny
          image: haproxy:3.2.23-alpine@sha256:93de1368b406157be4cded231bb34336e8477e8db24e90f5fb830bec99142331
          ports:
            - containerPort: 5000
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: catalog-deny
              mountPath: /usr/local/etc/haproxy
              readOnly: true
          resources:
            requests:
              cpu: "10m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "128Mi"
          # Its own probes, so a wedged proxy restarts the proxy. Without them
          # only the registry container is probed, and since its probes traverse
          # this one, a proxy that hangs rather than exits restarts the registry
          # indefinitely while the broken container is never touched. The path is
          # /haproxy-up, which catalog-deny.cfg answers and never forwards, so
          # this probe reports on THIS process alone -- see the header.
          readinessProbe:
            httpGet:
              path: /haproxy-up
              port: 5000
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /haproxy-up
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 20
      volumes:
        # Ephemeral by default: $0 at rest, cold on the next e2e window. The
        # persistent overlay swaps this for a PVC — see ../README.md.
        - name: storage
          emptyDir:
            sizeLimit: 10Gi
        - name: catalog-deny
          configMap:
            name: mirror-catalog-deny
---
