# The mirror's public listener. Everything that reaches a mirror pod on 5000
# arrives here; the registry itself binds 127.0.0.1:5002 and is not on the pod
# network at all. Mounted at the image's own config path, so the container takes
# no args -- see ../README.md#closing-the-repository-catalog.
#
# WHY A FRONTING PROXY RATHER THAN A REGISTRY SETTING. Distribution 3.1.1
# registers /v2/_catalog unconditionally (registry/handlers/app.go:110) and
# carries exactly one catalog knob, catalog.maxentries, which configuration.go:837
# raises to 1000 whenever it is <= 0 -- so REGISTRY_CATALOG_MAXENTRIES=0 leaves
# the endpoint answering 200 with every repository named. Its only request gate
# is `auth`, and an access controller applies to every route including the
# anonymous pulls four separately-configured clients depend on.
#
# url_dec IS LOAD-BEARING, not decoration. Go decodes percent escapes before
# gorilla mux matches, so /v2/%5Fcatalog and /v2%2F_catalog both reach the
# catalog route: measured against the pinned image, both answered 200 with the
# repository listed. A deny written against the raw path passes them through.
# Dot segments need no rule of their own -- mux answers /v2/./_catalog with a 301
# to /v2/_catalog, which the client re-requests through this frontend.
global
    log stdout format raw local0 info
    maxconn 512

defaults
    mode http
    log global
    option httplog
    option dontlognull
    timeout connect 5s
    # Generous on both sides: a cache miss fetches the layer from the upstream
    # while the client waits on this connection.
    timeout client 5m
    timeout server 5m
    timeout http-request 30s

frontend mirror
    bind :5000
    # The proxy's own liveness, answered here and never forwarded, so the deny
    # container's probes test THIS process rather than the registry behind it.
    # Without it both probes ask for /v2/, which is proxied through: measured,
    # with no registry running the proxy answers /v2/ 503 while still answering
    # /v2/_catalog 403, so a healthy proxy fails its own probe on a registry
    # fault and restart counts stop saying which container is broken.
    #
    # TWO THINGS A READER NEEDS. This is a new path reachable on 5000 from every
    # admitted namespace; it returns 200 and carries nothing, and that exposure
    # is deliberate rather than overlooked. And monitor-uri answers 200
    # unconditionally absent a `monitor fail` condition -- which is exactly what
    # isolates the proxy, and means this probe says NOTHING about the backend.
    # The registry container's own probes stay on /v2/ for that reason; dropping
    # them would leave nothing traversing the pair.
    monitor-uri /haproxy-up
    acl catalog path,url_dec -m beg -i /v2/_catalog
    http-request return status 403 content-type "application/json" string '{"errors":[{"code":"DENIED","message":"the catalog endpoint is disabled on this mirror"}]}' if catalog
    default_backend registry

backend registry
    server local 127.0.0.1:5002
