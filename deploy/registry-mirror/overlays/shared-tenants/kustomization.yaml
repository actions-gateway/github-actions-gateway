apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Shared mirror set, ephemeral caches: one set admitting every managed tenant,
# $0 at rest. The topology itself is ../../components/shared-tenants, which
# carries the rationale and the knobs; this overlay is the composition with the
# ephemeral base. For caches that survive an e2e window, render
# ../shared-tenants-persistent instead. See ../../README.md#two-topologies-one-shared-set-or-one-set-per-tenant.
resources:
  - ../../base
components:
  - ../../components/shared-tenants
