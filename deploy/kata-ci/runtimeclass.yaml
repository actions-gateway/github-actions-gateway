# The `kata` alias RuntimeClass.
#
# kata-deploy's Helm chart already creates `kata-qemu` (with pod overhead and a
# katacontainers.io/kata-version annotation). We deliberately do NOT redeclare it
# here -- doing so would fight Helm for ownership of the same object.
#
# `kata` is a stable alias mapping to the QEMU handler, so the hypervisor can be
# retargeted later (e.g. to Cloud Hypervisor, `kata-clh`) by editing one object
# rather than every pod spec.
#
# `scheduling.nodeSelector` pins kata pods to nodes where kata-deploy has finished
# installing the runtime -- kata-deploy applies this label itself, post-install.
# `overhead` mirrors what the chart renders for kata-qemu: the scheduler must
# account for the micro-VM's memory/CPU footprint on top of the container's own
# requests, or the node is oversubscribed.
---
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: kata
handler: kata-qemu
overhead:
  podFixed:
    memory: "160Mi"
    cpu: "250m"
scheduling:
  nodeSelector:
    katacontainers.io/kata-runtime: "true"
