# Unprivileged CI runner pod — runs dockerd + kind inside a Kata micro-VM.
#
# This is the security thesis of Q226 made concrete: a pod that runs a full Docker
# daemon and a `kind` Kubernetes cluster with NO `privileged: true` anywhere.
# Isolation is enforced at the hypervisor layer by `runtimeClassName: kata` — the
# pod gets its own guest kernel, so untrusted contributor CI code never touches the
# node's kernel, /proc, /sys, or devices.
#
# LIVE-VALIDATED (Q226 spike, GKE 1.35.5-gke.1241004, Ubuntu 24.04, c2-standard-4
# nested-virt, Kata 3.32.0/QEMU):
#   node kernel 6.8.0-1054-gke  vs  guest kernel 6.18.35   -> a real VM boundary
#   `kind create cluster` (kindest/node v1.35.0): 58s cold, 43s warm
#   `kind load docker-image`: 2s ; Kata VM boot overhead: ~2s over runc
#
# SECURITY INVARIANT — nothing below may be relaxed to `privileged: true`. The VM
# boundary is what makes a *non-privileged* dockerd safe. If a step proves too
# tight, add a single guest-scoped capability and record why — never host privilege.
#
# !! Kata isolates the KERNEL, not the POD NETWORK. The GKE metadata server stays
# !! reachable from inside the guest. Q226 measured the node service-account token
# !! endpoint returning 200 from within this pod. Kata alone does NOT close that
# !! path — you MUST also enable Workload Identity (GKE_METADATA node metadata
# !! mode). See docs/operations/kata-dind-workloads.md.
---
# Docker's overlay2 driver cannot run on virtiofs, which is how Kata surfaces an
# emptyDir. Left on emptyDir, dockerd silently falls back to `vfs`; kind then
# switches its node snapshotter to fuse-overlayfs, which needs /dev/fuse (absent
# in the guest) and the inner kubelet never becomes healthy. A RAW BLOCK volume is
# passed into the guest as a virtio-blk device, which we mkfs.ext4 — giving Docker
# a real filesystem and native overlay2.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kata-docker-blk
spec:
  accessModes: ["ReadWriteOnce"]
  volumeMode: Block
  storageClassName: standard-rwo
  resources:
    requests:
      storage: 100Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: kata-runner
  labels:
    app: kata-runner
spec:
  # The hypervisor-isolation boundary. The RuntimeClass `scheduling.nodeSelector`
  # (runtimeclass.yaml) auto-pins this pod to the nested-virt pool.
  runtimeClassName: kata
  restartPolicy: Never
  # An untrusted-PR CI runner has no business holding a Kubernetes API token.
  automountServiceAccountToken: false
  securityContext:
    # runAsNonRoot is intentionally NOT true: a rootful dockerd needs uid 0. Under
    # Kata that uid 0 is root of the *guest VM*, hypervisor-isolated from the host.
    # On a normal runtime this would be unacceptable; under Kata it is the design.
    runAsUser: 0
    seccompProfile:
      type: RuntimeDefault
  containers:
  - name: runner
    # Replace with GAG's e2e runner image (bundling dockerd, kind and the test
    # toolchain); pin by digest. `docker:28-dind` is what the spike validated.
    image: docker:28-dind
    imagePullPolicy: IfNotPresent
    command: ["/bin/sh", "-c"]
    args:
    - |
      set -eu

      # 1. Give Docker a real filesystem. NOTE: the docker:dind image declares
      #    VOLUME /var/lib/docker and Kata honours it by pre-mounting virtiofs
      #    there, so test for OUR device — not merely the mountpoint — and mount
      #    ext4 over the virtiofs entry.
      blkid /dev/dockerblk >/dev/null 2>&1 || mkfs.ext4 -F /dev/dockerblk >/dev/null
      mkdir -p /var/lib/docker
      grep -q "^/dev/dockerblk /var/lib/docker " /proc/mounts \
        || mount -t ext4 /dev/dockerblk /var/lib/docker

      # 2. The Kata guest's /dev has no kernel-log device, and the inner kubelet
      #    hard-requires one. Needs CAP_MKNOD; it is the guest's kernel log.
      [ -e /dev/kmsg ] || mknod /dev/kmsg c 1 11

      # 3. The OCI spec mounts /sys/fs/cgroup and /proc/sys read-only for a
      #    non-privileged container. runc must mkdir cgroups for kind's node, and
      #    Docker writes per-veth net.ipv6.conf.*.disable_ipv6. Under Kata BOTH of
      #    these belong to the GUEST kernel, so remounting them rw (CAP_SYS_ADMIN)
      #    grants nothing on the host. Under plain runc the same tree is the
      #    host's — which is exactly why classic DinD demands privileged: true.
      mount -o remount,rw /sys/fs/cgroup
      mount -o remount,rw /proc/sys

      # 4. cgroup v2 forbids a cgroup holding processes AND delegating controllers
      #    to children. Our shell + dockerd sit in the cgroupns root, so systemd
      #    inside kind's node cannot create /init.scope ("Structure needs
      #    cleaning"). Evacuate the root, then delegate. docker:dind's own
      #    entrypoint does this; overriding `command` skips it.
      mkdir -p /sys/fs/cgroup/init
      xargs -rn1 < /sys/fs/cgroup/cgroup.procs > /sys/fs/cgroup/init/cgroup.procs 2>/dev/null || true
      sed -e 's/ / +/g' -e 's/^/+/' < /sys/fs/cgroup/cgroup.controllers \
        > /sys/fs/cgroup/cgroup.subtree_control

      # 5. Standard dockerd — no --privileged, no DinD flags.
      dockerd >/var/log/dockerd.log 2>&1 &
      i=0; while [ $i -lt 90 ]; do docker info >/dev/null 2>&1 && break; i=$((i+1)); sleep 1; done
      docker info --format 'StorageDriver={{.Driver}}'
      [ "$(docker info --format '{{.Driver}}')" = "overlay2" ] || { echo "FATAL: not overlay2"; exit 1; }

      # 6. kind creates its docker network with --ipv6, which writes
      #    /proc/sys/net/ipv6/... for the bridge. IPv6 is disabled in the guest, so
      #    pre-create an IPv4-only network named `kind`; kind reuses it.
      docker network inspect kind >/dev/null 2>&1 || docker network create -d=bridge \
        -o com.docker.network.bridge.enable_ip_masquerade=true \
        -o com.docker.network.driver.mtu=1500 kind >/dev/null

      echo "dockerd is up on overlay2; pod ready for kind + make e2e"
      # kind must bind the guest's /dev/kmsg into its node container:
      #   nodes: [{role: control-plane, extraMounts: [{hostPath: /dev/kmsg, containerPath: /dev/kmsg}]}]
      sleep infinity
    securityContext:
      # THE headline property of Q226: the runner runs unprivileged.
      privileged: false
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
        add:
        # --- Docker's own default container capability set ---
        - CHOWN
        - DAC_OVERRIDE
        - FSETID
        - FOWNER            # image layer unpack chmods files it does not own
        - MKNOD             # create /dev/kmsg; device nodes containers expect
        - NET_RAW
        - SETGID
        - SETUID
        - SETFCAP           # layer unpack restores file capabilities
        - SETPCAP
        - NET_BIND_SERVICE
        - SYS_CHROOT        # runc setns() into the container mount namespace
        - KILL
        - AUDIT_WRITE
        # --- extras a rootful dockerd + runc need ---
        - SYS_ADMIN         # mount/remount, cgroup + namespace setup
        - NET_ADMIN         # docker bridge + iptables NAT
        - SYS_RESOURCE      # raise file-descriptor / process rlimits
        - SYS_PTRACE        # runc nsenter / process inspection
    resources:
      # The micro-VM is sized from these. kind's control plane needs real memory.
      # Add the RuntimeClass overhead (160Mi / 250m) on top when sizing nodes.
      requests:
        cpu: "2"
        memory: 6Gi
      limits:
        cpu: "3"
        memory: 10Gi
    volumeDevices:
    - name: docker-blk
      devicePath: /dev/dockerblk
    volumeMounts:
    - name: docker-run
      mountPath: /var/run
  volumes:
  - name: docker-blk
    persistentVolumeClaim:
      claimName: kata-docker-blk
  - name: docker-run
    emptyDir: {}
