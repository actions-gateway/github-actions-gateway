apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Default Athens deployment: ephemeral (emptyDir) cache — $0 at rest. This is what
# `kubectl apply -k deploy/athens` renders. For a warm cache that survives
# scale-to-zero (at the cost of a continuously-billed PVC-backed disk), render the
# persistent overlay instead: `kubectl apply -k deploy/athens/overlays/persistent`.
# See README.md.
resources:
  - base
