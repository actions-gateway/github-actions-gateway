# Kata isolation delta, e2e-tenant half. The worker pod shape itself is NOT here
# any more: it is the shipped library entry deploy/templates/kata-dind, which
# this overlay consumes as a base and patches with the cluster specifics
# (kustomization.yaml). That inversion is the point — the artifact an operator
# applies is the same one this suite runs jobs on, minus declared patches, so
# the library cannot silently drift from its validation (Q554).
#
# What remains here is the one object that is genuinely tenant-scoped rather
# than template-scoped: the egress policy.
#
# Open egress (additive; unions with GAG's managed default-deny), as in ../dind:
# e2e pulls from Docker Hub / quay / registry.k8s.io / get.helm.sh, all
# CDN-fronted (a CIDR allowlist would rot; an FQDN allowlist isn't enforceable
# on GKE DPv2 — Q245). The durable hardening that would let this variant carry
# untrusted-PR CI is an in-cluster pull-through mirror + tight egress — planned
# as docs/plan/q408-untrusted-pr-egress.md (Q408), whose Phase 3 replaces this
# policy. Until then Kata hardens the kernel-escape axis while egress stays
# trusted-CI-shaped.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: e2e-open-egress
  namespace: gag-dogfood-e2e
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - {}
