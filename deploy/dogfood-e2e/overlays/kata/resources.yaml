# Kata isolation delta: the worker pod shape + the egress policy.
#
# The worker runs dockerd + kind inside a Kata micro-VM (`runtimeClassName:
# kata`) with NO `privileged: true` anywhere — the hypervisor, not host
# privilege, is the isolation boundary. Every non-obvious line below was
# live-validated in the Q226 spike (deploy/kata-ci/runner-pod.yaml is the
# single-pod reference; docs/plan/kata-on-gke.md has the evidence).
#
# SECURITY INVARIANT — nothing here may be relaxed to `privileged: true`. If a
# step proves too tight, add a single guest-scoped capability and record why.
#
# WHY THE NAMESPACE IS STILL PSA-privileged (kustomization.yaml patch): PSS
# baseline forbids capabilities.add beyond its fixed allowlist, and the
# unprivileged dockerd needs SYS_ADMIN / NET_ADMIN / SYS_RESOURCE / SYS_PTRACE /
# NET_RAW (guest-scoped under Kata, but PSA is not Kata-aware). Verified against
# a real apiserver (envtest, 2026-07-16): enforce=baseline rejects this pod
# shape as Forbidden; enforce=privileged admits it. The property "no privileged
# container" is therefore enforced by this template being platform-owned
# (cluster-scoped; tenants cannot author it), not by the PSA level.
#
# ClusterRunnerTemplate rather than a namespaced RunnerTemplate: near-privileged
# capability sets are platform-owned golden templates, and keeping the kind
# identical to ../dind makes `diff -r overlays/dind overlays/kata` exactly the
# security/complexity tradeoff.
apiVersion: actions-gateway.com/v2beta1
kind: ClusterRunnerTemplate
metadata:
  name: dogfood-e2e-kata
spec:
  podTemplate:
    spec:
      # The hypervisor-isolation boundary. `kata` is the alias RuntimeClass
      # (e2e-setup.sh) over the chart-owned kata-qemu handler; its
      # scheduling.nodeSelector additionally pins to nodes where kata-deploy
      # has FINISHED installing (katacontainers.io/kata-runtime=true).
      runtimeClassName: kata
      nodeSelector:
        cloud.google.com/gke-nodepool: e2e
      tolerations:
        - key: dedicated
          value: e2e
          effect: NoSchedule
      # An untrusted-PR CI runner has no business holding a Kubernetes API
      # token. (Kata bounds the kernel, not the pod network — the metadata
      # server stays reachable, which is why the e2e pool runs Workload
      # Identity; see docs/operations/kata-dind-workloads.md.)
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      # dind as a NATIVE sidecar (restartPolicy: Always init container, K8s
      # >=1.29). Load-bearing: a regular sidecar's dockerd never exits, so the
      # pod never completes, the AGC keeps the session active, and maxWorkers
      # strands (Q249). Unlike ../dind this daemon is UNPRIVILEGED — uid 0 and
      # the added capabilities are root of the guest VM only.
      initContainers:
        - name: dind
          # docker:28-dind is what the Q226 spike validated. The image's own
          # entrypoint is replaced because Kata needs six setup steps before
          # dockerd (each discovered by running it — see the numbered comments).
          image: docker:28-dind
          restartPolicy: Always
          env:
            - name: DOCKER_TLS_CERTDIR
              value: ""
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu

              # 1. Give Docker a real filesystem. Kata surfaces emptyDir as
              #    virtiofs, on which dockerd silently falls back to vfs and the
              #    inner kubelet never gets healthy; a raw BLOCK volume arrives
              #    as a virtio-blk device we mkfs.ext4. NOTE: docker:dind
              #    declares VOLUME /var/lib/docker and Kata pre-mounts virtiofs
              #    there, so test for OUR device — not merely the mountpoint —
              #    and mount ext4 over the virtiofs entry.
              blkid /dev/dockerblk >/dev/null 2>&1 || mkfs.ext4 -F /dev/dockerblk >/dev/null
              mkdir -p /var/lib/docker
              grep -q "^/dev/dockerblk /var/lib/docker " /proc/mounts \
                || mount -t ext4 /dev/dockerblk /var/lib/docker

              # 2. The Kata guest's /dev has no kernel-log device, and the inner
              #    kubelet hard-requires one (needs CAP_MKNOD; it is the GUEST's
              #    kernel log). kind binds it into the node container via the
              #    extraMounts in test/kind-config-*.yaml.
              [ -e /dev/kmsg ] || mknod /dev/kmsg c 1 11

              # 3. /sys/fs/cgroup and /proc/sys are mounted read-only for a
              #    non-privileged container. runc must mkdir cgroups for kind's
              #    node, and Docker writes per-veth ipv6 sysctls. Under Kata
              #    BOTH trees belong to the GUEST kernel, so remounting rw
              #    (CAP_SYS_ADMIN) grants nothing on the host — under plain runc
              #    the same tree is the host's, which is exactly why classic
              #    DinD demands privileged: true.
              mount -o remount,rw /sys/fs/cgroup
              mount -o remount,rw /proc/sys

              # 4. cgroup v2 forbids a cgroup holding processes AND delegating
              #    controllers. Our shell + dockerd sit in the cgroupns root, so
              #    systemd inside kind's node cannot create /init.scope
              #    ("Structure needs cleaning"). Evacuate the root, then
              #    delegate. docker:dind's own entrypoint does this; overriding
              #    `command` skips it.
              mkdir -p /sys/fs/cgroup/init
              xargs -rn1 < /sys/fs/cgroup/cgroup.procs > /sys/fs/cgroup/init/cgroup.procs 2>/dev/null || true
              sed -e 's/ / +/g' -e 's/^/+/' < /sys/fs/cgroup/cgroup.controllers \
                > /sys/fs/cgroup/cgroup.subtree_control

              # 5. Standard dockerd — no --privileged, no DinD flags. tcp for
              #    the runner container (DOCKER_HOST), unix for the checks here.
              dockerd --host=tcp://0.0.0.0:2375 --host=unix:///var/run/docker.sock --tls=false \
                >/var/log/dockerd.log 2>&1 &
              pid=$!
              i=0; while [ $i -lt 90 ]; do docker info >/dev/null 2>&1 && break; i=$((i+1)); sleep 1; done
              # Fail loudly if storage silently fell back off overlay2 (the
              #    step-1 failure signature) instead of wedging mid-suite.
              [ "$(docker info --format '{{.Driver}}')" = "overlay2" ] \
                || { echo "FATAL: storage driver is not overlay2"; cat /var/log/dockerd.log; exit 1; }

              # 6. kind creates its docker network with --ipv6, which writes
              #    ipv6 sysctls for the bridge; IPv6 is disabled in the guest.
              #    Pre-create an IPv4-only network named `kind`; kind reuses it.
              docker network inspect kind >/dev/null 2>&1 || docker network create -d=bridge \
                -o com.docker.network.bridge.enable_ip_masquerade=true \
                -o com.docker.network.driver.mtu=1500 kind >/dev/null

              echo "dockerd up on overlay2 (tcp://0.0.0.0:2375); kind network ready"
              trap 'kill "$pid" 2>/dev/null' TERM INT
              wait "$pid"
          securityContext:
            # THE headline property of this variant: no privileged container.
            privileged: false
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
              add:
                # --- Docker's own default container capability set ---
                - CHOWN
                - DAC_OVERRIDE
                - FSETID
                - FOWNER            # image layer unpack chmods files it does not own
                - MKNOD             # create /dev/kmsg; device nodes containers expect
                - NET_RAW
                - SETGID
                - SETUID
                - SETFCAP           # layer unpack restores file capabilities
                - SETPCAP
                - NET_BIND_SERVICE
                - SYS_CHROOT        # runc setns() into the container mount namespace
                - KILL
                - AUDIT_WRITE
                # --- extras a rootful dockerd + runc need (guest-scoped) ---
                - SYS_ADMIN         # mount/remount, cgroup + namespace setup
                - NET_ADMIN         # docker bridge + iptables NAT
                - SYS_RESOURCE      # raise file-descriptor / process rlimits
                - SYS_PTRACE        # runc nsenter / process inspection
          # Same measured baseline as ../dind (Q248: dind peaked 1308m /
          # 2343Mi — the in-DinD kind+CNI cluster is the memory-heavy half),
          # with one Kata-specific difference: CPU LIMITS ARE LOAD-BEARING
          # here. Kata sizes the guest VM's vCPUs from the pod's CPU limits, so
          # the dind overlay's "requests-only, let it burst" idiom would cap
          # the whole guest at the default vCPU count. Add the RuntimeClass
          # overhead (250m/160Mi) when sizing nodes.
          resources:
            requests: { cpu: "1", memory: "3Gi" }
            limits: { cpu: "3", memory: "4Gi" }
          volumeDevices:
            - name: docker-blk
              devicePath: /dev/dockerblk
      containers:
        - name: runner
          # docker CLI + buildx + helm + kubectl + jq on the build-capable base
          # (scripts/dogfood/e2e-runner/Dockerfile) — the daemon lives in the
          # dind sidecar above. The AGC still injects the Q235 wrapper and
          # preserves the native-sidecar init container. Same image as ../dind:
          # the isolation mechanism is the sidecar's, not the runner's.
          image: ghcr.io/actions-gateway/dogfood-e2e-runner:2.335.1-2
          env:
            - name: DOCKER_HOST
              value: "tcp://localhost:2375"
          # Q248 measured the runner at ~4940m / 1034Mi peak (it drives the e2e
          # specs + kubectl/helm/kind CLI). CPU limit 5 ≈ that peak — explicit
          # here (unlike ../dind) because Kata turns CPU limits into guest
          # vCPUs; memory as in ../dind. requests runner(3)+dind(1)+overhead
          # (0.25) still packs one worker per c2-standard-8 e2e node.
          resources:
            requests: { cpu: "3", memory: "1Gi" }
            limits: { cpu: "5", memory: "3Gi" }
      volumes:
        # Per-worker raw block device for /var/lib/docker (step 1 above). A
        # generic ephemeral volume so each ephemeral worker pod gets its own
        # PVC, created and DELETED with the pod — no orphaned Persistent Disks
        # (the Q226 spike's static PVC outlived its cluster; see
        # docs/plan/kata-on-gke.md gotchas).
        - name: docker-blk
          ephemeral:
            volumeClaimTemplate:
              spec:
                accessModes: [ReadWriteOnce]
                volumeMode: Block
                storageClassName: standard-rwo
                resources:
                  requests:
                    storage: 100Gi
---
# Open egress (additive; unions with GAG's managed default-deny), as in ../dind:
# e2e pulls from Docker Hub / quay / registry.k8s.io / get.helm.sh, all
# CDN-fronted (a CIDR allowlist would rot; an FQDN allowlist isn't enforceable
# on GKE DPv2 — Q245). The durable hardening that would let this variant carry
# untrusted-PR CI is an in-cluster pull-through mirror + tight egress — future
# work, tracked in docs/plan/kata-on-gke.md. Until then Kata hardens the
# kernel-escape axis while egress stays trusted-CI-shaped.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: e2e-open-egress
  namespace: gag-dogfood-e2e
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - {}
