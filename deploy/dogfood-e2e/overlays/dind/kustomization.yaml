apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Privileged-DinD isolation variant — no nested virt, no Kata.
#
# TRUSTED CI ONLY. The worker runs a privileged dockerd (host-kernel exposure)
# and broad egress. For untrusted PRs use the Kata variant (../kata). See ../../README.md.
#
# The worker pod shape is the SHIPPED library entry
# ../../../templates/privileged-dind (Q554), consumed as a base here rather than
# restated. This overlay adds only what is specific to GAG's own e2e cluster:
# the build-capable runner image, and the GKE node pool and taint.
#
# The delta vs any other overlay is exactly: the namespace security profile
# (below), which library entry is the base, and the egress policy.
#
# The mirror wiring is the same as ../kata's (Q1193): one ConfigMap in
# ../../base, mounted the same way. Here it routes rather than fences, since
# the open egress in resources.yaml stays, and its point is that a job's pulls
# reach Dragonfly when the mirrors fetch through it
# (E2E_MIRROR_BACKEND=dragonfly), which an unwired dockerd never would.
resources:
  - ../../base
  - ../../../templates/privileged-dind
  - resources.yaml
patches:
  # Namespace -> privileged. All four gates in one object so the GMC's
  # ValidatingAdmissionPolicies admit it (the security-profile downgrade needs
  # the annotation; privileged needs the platform eligibility label).
  - patch: |
      apiVersion: v1
      kind: Namespace
      metadata:
        name: gag-dogfood-e2e
        labels:
          actions-gateway.com/security-profile: privileged
          pod-security.kubernetes.io/enforce: privileged
          actions-gateway.com/privileged-profile: allowed
        annotations:
          actions-gateway.com/allow-profile-downgrade: allowed
  # Point the RunnerSet at the library entry. The apiVersion must match the base
  # RunnerSet (v2beta1) for the strategic-merge patch to target it; this patch
  # touches only maps and scalars, which is why a strategic merge is safe here
  # and is not safe against the template below.
  - patch: |
      apiVersion: actions-gateway.com/v2beta1
      kind: RunnerSet
      metadata:
        name: ci-e2e
        namespace: gag-dogfood-e2e
      spec:
        templateRef:
          name: privileged-dind
          kind: ClusterRunnerTemplate
  # Cluster specifics onto the library template. JSON 6902, NOT a strategic
  # merge — see ../kata/kustomization.yaml for the mechanism and the
  # measurement.
  - target:
      group: actions-gateway.com
      version: v2beta1
      kind: ClusterRunnerTemplate
      name: privileged-dind
    patch: |
      # Build-capable runner image (scripts/dogfood/e2e-runner/Dockerfile).
      # Load-bearing and unenforced by the base, same as ../kata: dropping this
      # op gap-fills the default runner, which lacks helm/kubectl/jq.
      - op: replace
        path: /spec/workerImage
        value: ghcr.io/actions-gateway/dogfood-e2e-runner:2.338.1-1
      # The e2e pool, shared with ../kata: tainted so nothing else lands on it
      # (scripts/dogfood/e2e-setup.sh). The nested-virt and Workload Identity
      # settings that pool carries are inert for this variant.
      - op: add
        path: /spec/podTemplate/spec/nodeSelector
        value:
          cloud.google.com/gke-nodepool: e2e
      - op: add
        path: /spec/podTemplate/spec/tolerations
        value:
          - key: dedicated
            value: e2e
            effect: NoSchedule
      # Mirror wiring, same three ops as ../kata — the reasoning is there and
      # in ../../base/mirror-wiring.yaml.
      #
      # `add` on /volumes creates the list, where ../kata appends with
      # /volumes/-: privileged-dind declares no volumes, and appending to an
      # absent list is an error. It also REPLACES a list that exists, so a
      # volume the library entry gains later is dropped here, and nothing
      # fails: switch to /volumes/- in the same change.
      - op: add
        path: /spec/podTemplate/spec/volumes
        value:
          - name: docker-config
            configMap:
              name: registry-mirror-wiring
              items:
                - key: daemon.json
                  path: daemon.json
      - op: add
        path: /spec/podTemplate/spec/initContainers/0/volumeMounts
        value:
          - name: docker-config
            mountPath: /etc/docker/daemon.json
            subPath: daemon.json
            readOnly: true
      - op: add
        path: /spec/podTemplate/spec/containers/0/env/-
        value:
          name: REGISTRY_MIRRORS
          valueFrom:
            configMapKeyRef:
              name: registry-mirror-wiring
              key: registry-mirrors
      # The wiring is egress-negatives.sh's trigger, and on this overlay every
      # upstream it must find blocked is reachable. This tells the battery the
      # posture is open on purpose. Kata never sets it, so a marker lost there
      # cannot skip the battery: absent means enforce.
      - op: add
        path: /spec/podTemplate/spec/containers/0/env/-
        value:
          name: E2E_EGRESS_POSTURE
          value: open
