# Shared, isolation-agnostic tenant objects. The overlay patches in the
# security profile (namespace) and the worker shape (RunnerSet.templateRef).
apiVersion: v1
kind: Namespace
metadata:
  name: gag-dogfood-e2e
  labels:
    # Authorizes the GMC to operate in this namespace. The security profile is
    # isolation-specific and set by the overlay (dind=privileged, kata=baseline).
    actions-gateway.com/tenant: managed
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: dogfood-e2e-quota
  namespace: gag-dogfood-e2e
spec:
  hard:
    pods: "6"
---
apiVersion: actions-gateway.com/v2beta1
kind: ActionsGateway
metadata:
  name: dogfood-e2e
  namespace: gag-dogfood-e2e
spec:
  credentials:
    type: GitHubApp
    githubApp:
      name: github-app-v1 # Secret created out-of-band (see ../README.md)
  githubURL: https://github.com/actions-gateway/github-actions-gateway
---
apiVersion: actions-gateway.com/v2beta1
kind: RunnerSet
metadata:
  name: ci-e2e
  namespace: gag-dogfood-e2e
spec:
  gatewayRef:
    name: dogfood-e2e
  # templateRef is supplied by the overlay — the isolation-specific worker shape.
  # Authored directly at v2beta1 — the graduated, served+storage front-door shape
  # (Q273) — deliberately UNLIKE scripts/dogfood/setup.sh (main dogfood), which
  # authors at v2alpha1 to exercise the conversion webhook. v2beta1 is ScaleSet-only
  # and strips acquisitionProtocol + maxListeners (Q74 graduation / Q264 §5a): a
  # runner set declares exactly ONE runnerLabel, which is both its runs-on target and
  # the scale-set name registered at GitHub. e2e-{start,stop}.sh set GAG_E2E_RUNNER to
  # this single label. (Q231)
  runnerLabels: ["gag-ci-e2e"]
  maxWorkers: 2
