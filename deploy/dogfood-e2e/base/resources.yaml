# Shared, isolation-agnostic tenant objects. The overlay patches in the
# security profile (namespace) and the worker shape (RunnerSet.templateRef).
apiVersion: v1
kind: Namespace
metadata:
  name: gag-dogfood-e2e
  labels:
    # Authorizes the GMC to operate in this namespace. The security profile is
    # isolation-specific and set by the overlay (dind=privileged, kata=baseline).
    actions-gateway.com/tenant: managed
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: dogfood-e2e-quota
  namespace: gag-dogfood-e2e
spec:
  hard:
    pods: "6"
---
apiVersion: actions-gateway.com/v2beta1
kind: ActionsGateway
metadata:
  name: dogfood-e2e
  namespace: gag-dogfood-e2e
spec:
  credentials:
    type: GitHubApp
    githubApp:
      name: github-app-v1 # Secret created out-of-band (see ../README.md)
  githubURL: https://github.com/actions-gateway/github-actions-gateway
---
apiVersion: actions-gateway.com/v2beta1
kind: RunnerSet
metadata:
  name: ci-e2e
  namespace: gag-dogfood-e2e
spec:
  gatewayRef:
    name: dogfood-e2e
  # templateRef is supplied by the overlay — the isolation-specific worker shape.
  # Authored directly at v2beta1 — the graduated, served+storage front-door shape
  # (Q273) — deliberately UNLIKE scripts/dogfood/setup.sh (main dogfood), which
  # authors at v2alpha1 to exercise the conversion webhook. v2beta1 is ScaleSet-only
  # and strips acquisitionProtocol + maxListeners (Q74 graduation / Q264 §5a). One
  # runnerLabel here, deliberately: it is both this tenant's runs-on target and the
  # scale-set name registered at GitHub, and e2e-{start,stop}.sh set GAG_E2E_RUNNER
  # to it. Q726 permits more, which this tenant has no use for. (Q231)
  runnerLabels: ["gag-ci-e2e"]
  maxWorkers: 2
  # Opt in to the placeability rung (Q405) so the release gate observes it produce a
  # real verdict on real infra. Off — the default — REMOVES WorkerCapacityDeclined
  # rather than publishing it False, so without this the gate can only see the rung's
  # withheldCapacity zero, never that the opt-in path evaluates end to end here.
  #
  # Observe is not report-only: it gates intake. It cannot starve this tenant, because
  # the gateway leaves clusterCapacity.nodeAutoscaling at its Present default, and
  # under Present a decline needs the autoscaler's OWN declination — which a pool with
  # budget headroom does not produce. That is also why the NEGATIVE verdict stays
  # undriven here; Q1025 tracks it.
  capacityGate:
    mode: Observe
  # NodeShare sizing (Q359 Phase 3). This tenant validates the profile the
  # release gate can actually reach in a single run: NodeShare needs NO usage
  # history, so it actuates on the first job, unlike Binpack/Throughput which
  # wait for 20 samples. That is also why it is the profile an operator can
  # enable on day one — and it was the least exercised of the four.
  #
  # THE ENVELOPE IS A DELIBERATE LOWER BOUND, NOT THE NODE'S REAL ALLOCATABLE.
  # The e2e pool is c2-standard-8 (8 vCPU), but the true allocatable after GKE
  # system daemonsets has not been measured, and NodeShare divides the envelope
  # into the RUNNER container only — the dind sidecar (2 CPU kata / 1 CPU dind)
  # and the Kata RuntimeClass overhead (250m) are the operator's accounting, per
  # the profile's design. Declaring an envelope too large would derive a runner
  # request the node cannot hold and make the release's own e2e gate
  # unschedulable, so this is pinned below BOTH variants' static runner request
  # (kata 2, dind 3): actuation can only ever REDUCE the pod's ask, never grow
  # it. 1500m is also observably different from either template, which is what
  # lets validate-release.sh prove the profile actuated rather than assuming it.
  #
  # It leaves packing on the table by construction. Tighten it once someone
  # measures the real number on a live e2e node:
  #   kubectl get node -l cloud.google.com/gke-nodepool=gag-e2e-pool \
  #     -o jsonpath='{.items[0].status.allocatable}'
  # Tracked as Q448. CPU only on purpose: memory is non-compressible and both
  # variants already carry hand-measured requests/limits (Q248), so there is no
  # safe reduction to make there without the same measurement.
  sizing:
    profile: NodeShare
    nodeShare:
      allocatable:
        cpu: "1500m"
      workersPerNode: 1
