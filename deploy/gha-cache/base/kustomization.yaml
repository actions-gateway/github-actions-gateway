apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Namespace-free on purpose: the server belongs in the tenant's namespace, which
# only the tenant kustomization knows. Apply ../example (copied and renamed),
# never this directory on its own. See ../README.md.
resources:
  - deployment.yaml
  - service.yaml
  - networkpolicy.yaml
