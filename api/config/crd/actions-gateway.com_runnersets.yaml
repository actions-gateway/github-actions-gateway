---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: runnersets.actions-gateway.com
spec:
  group: actions-gateway.com
  names:
    categories:
    - actions-gateway
    kind: RunnerSet
    listKind: RunnerSetList
    plural: runnersets
    shortNames:
    - rs
    singular: runnerset
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.gatewayRef.name
      name: Gateway
      type: string
    - jsonPath: .spec.maxListeners
      name: MaxListeners
      type: integer
    - jsonPath: .status.activeSessions
      name: ActiveSessions
      type: integer
    - jsonPath: .status.activeJobs
      name: ActiveJobs
      type: integer
    - jsonPath: .status.pendingJobs
      name: PendingJobs
      type: integer
    - jsonPath: .status.proxyMode
      name: Egress
      type: string
    - jsonPath: .status.templateSource
      name: Template
      priority: 1
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].reason
      name: Reason
      priority: 1
      type: string
    - jsonPath: .status.observedGeneration
      name: ObservedGen
      priority: 1
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    deprecated: true
    deprecationWarning: actions-gateway.com/v2alpha1 RunnerSet is deprecated; use
      actions-gateway.com/v2beta1. v2alpha1 is served until v2.0.0, which removes
      it.
    name: v2alpha1
    schema:
      openAPIV3Schema:
        description: |-
          RunnerSet is a namespace-scoped CRD reconciled by the AGC. It binds a worker pod
          shape (templateRef) and an optional egress proxy (proxyRef) to a GitHub gateway
          (gatewayRef), and carries the scheduling/quota knobs that were RunnerGroup's in
          v1alpha1. Worker pods are provisioned per acquired job and released on completion.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              RunnerSetSpec is the desired state of a RunnerSet — the small scheduling/quota
              binder that replaces v1alpha1's RunnerGroup. The large PodTemplateSpec no longer
              lives here: it moves to a referenced RunnerTemplate / ClusterRunnerTemplate so a
              runner set stays a fixed-size object and a template is reused across many sets
              (docs/design/appendix-h-v2-api-decomposition.md §H.5). The scheduling and
              lifecycle fields are carried over from RunnerGroup unchanged in meaning.
            properties:
              acquisitionProtocol:
                default: ScaleSet
                description: |-
                  AcquisitionProtocol selects how the AGC acquires jobs for this runner set:
                  "ScaleSet" (default, as of Q264 P5) is the runner-scale-set message-queue
                  protocol (Q264 Option E) — one listener session per set, capacity-gated
                  assignment, and a full-runner (run.sh --jitconfig) worker; it removes the
                  classic protocol's many-acquirers fan-out race by construction. "Classic"
                  (deprecated) is the per-runner broker protocol; select it only to retain a
                  classic-only capability during the migration window.

                  Multi-label matching was that capability until Q726 and no longer is: a
                  ScaleSet set registers every runnerLabel on its scale set, so a multi-label
                  set no longer has to pin Classic. Existing sets are unaffected: the value is
                  persisted at admission, so a set created while the default was Classic keeps
                  Classic, and gag-migrate still emits Classic explicitly so a migrating tenant's
                  protocol never changes underneath it.

                  It is immutable: switching a live set's protocol is a re-registration storm, so
                  the value is frozen (§H.15 pattern) — create a new RunnerSet to change it.
                  Starting immutable is compatible (relaxing it later is a non-breaking change;
                  adding immutability later would be breaking). A ScaleSet set's first runnerLabel
                  names its scale set, and the GMC webhook holds that name unique across the sets
                  under one gateway.
                  This field exists only on v2alpha1 as the per-set canary/rollback lever for the
                  Q264 P3–P4 rollout; v2beta1 is ScaleSet-only and drops it (Q264 §5a-U7).
                enum:
                - Classic
                - ScaleSet
                type: string
                x-kubernetes-validations:
                - message: acquisitionProtocol is immutable; create a new RunnerSet
                    to change the acquisition protocol
                  rule: self == oldSelf
              capacityGate:
                description: |-
                  CapacityGate opts this runner set into the placeability rung of the admission
                  ladder (Q405): the AGC refuses to take on jobs whose worker pod the cluster
                  cannot currently place, instead of claiming them and stalling. Omitted (or
                  mode Off) keeps today's behavior exactly — no capacity rung.
                properties:
                  mode:
                    default: "Off"
                    description: |-
                      Mode selects how hard this set tries not to claim work it cannot run, by naming
                      how the AGC learns the cluster cannot place a worker; see the CapacityGateMode*
                      constants. Off is the default and is today's behavior. Observe gates on evidence
                      an already-stuck pod produced — it is not a report-only tier.

                      It does NOT select the signal. Which signal is sound depends on whether the
                      cluster can grow, which is stated once by the platform operator on
                      ActionsGateway.spec.clusterCapacity.nodeAutoscaling — so a tenant enabling the
                      gate cannot pick a signal that is wrong for the cluster they are running in.
                    enum:
                    - "Off"
                    - Observe
                    type: string
                type: object
              completedPodTTL:
                description: |-
                  CompletedPodTTL is how long a worker pod that has reached a terminal phase is
                  retained before the AGC deletes it. Set to "0s" to delete immediately on
                  completion. Must not be negative. Defaults to "5m" when omitted.
                type: string
              evictionRetryDelay:
                description: |-
                  EvictionRetryDelay is the minimum time to wait before re-queuing an evicted
                  job. Must be at least 1s. Defaults to "5s" when omitted.

                  Honored only when acquisitionProtocol is Classic, for the reason given on
                  MaxEvictionRetries.
                type: string
              gatewayRef:
                description: |-
                  GatewayRef names the ActionsGateway that supplies this runner set's GitHub
                  binding and control plane. Under multi-gateway-per-namespace each AGC
                  reconciles only the RunnerSets whose gatewayRef targets it — which is why
                  spec.gatewayRef.name is a CRD selectable field (KEP-4358), so that scoping
                  runs server-side (§H.7). Required: a runner set with no gateway has no GitHub
                  connection to register against. Resolved at runtime, not admission.
                properties:
                  kind:
                    description: |-
                      Kind optionally selects the referent kind when more than one is valid. It is
                      load-bearing only on templateRef, where it chooses between RunnerTemplate
                      (the namespaced default) and ClusterRunnerTemplate (a platform golden
                      template). gatewayRef and proxyRef each have a single valid kind, so Kind is
                      left empty there.
                    enum:
                    - RunnerTemplate
                    - ClusterRunnerTemplate
                    type: string
                  name:
                    description: |-
                      Name of the referenced object. Bounded by the same 52-char budget every v2
                      object name carries (§H.6), so a well-formed ref can always name a valid object.
                    maxLength: 52
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              maxEvictionRetries:
                description: |-
                  MaxEvictionRetries controls how many times the AGC automatically re-queues a
                  job whose worker pod was evicted. Set to 0 to disable auto-retry entirely.
                  Defaults to 2 when omitted.

                  Honored only when acquisitionProtocol is Classic. Eviction recovery runs off
                  the classic provisioning path, which blocks on the worker pod's terminal
                  phase; a ScaleSet worker is provisioned fire-and-forget, so no eviction is
                  observed and no rerun is issued. On a ScaleSet set an evicted worker's job
                  needs a manual rerun until Q417 ports the recovery.
                format: int32
                maximum: 10
                minimum: 0
                type: integer
              maxListeners:
                default: 10
                description: |-
                  MaxListeners is the maximum number of concurrent listener goroutines — a
                  concurrency ceiling with a permanent baseline of one poller; extra pollers
                  demand-spawn as jobs are acquired and idle-exit when the queue drains. The v2
                  default is 10 (v1 defaulted to 1): a higher ceiling costs nothing at idle and
                  avoids serializing job pickup, while maxWorkers and the namespace ResourceQuota
                  remain the binding resource guards (§H.15).
                format: int32
                minimum: 1
                type: integer
              maxQuotaRetries:
                description: |-
                  MaxQuotaRetries controls how many times the AGC retries pod creation when the
                  namespace ResourceQuota is exhausted. Set to 0 to disable quota retry.
                  Defaults to 5 when omitted.

                  This is the backstop, not the first line of defence: the admission gate already
                  declines to claim a job when the quota has no headroom, so this path is reached
                  only for what that live check cannot see — a sibling AGC or another workload
                  taking the headroom first, an eventually-consistent ResourceQuota .status, or an
                  AGC restart between the claim and the pod create.
                format: int32
                maximum: 20
                minimum: 0
                type: integer
              maxWorkerLifetime:
                description: |-
                  MaxWorkerLifetime is the maximum time a worker pod may be active on its node
                  before the kubelet kills it, applied as the pod's activeDeadlineSeconds. It
                  bounds a worker whose job ended while the AGC was down — a pod nothing the AGC
                  observes later can distinguish from one running a long job (Q438). The kubelet
                  enforces it, so it holds even while the AGC is unavailable.

                  A pod killed this way lands in Failed with reason DeadlineExceeded and is
                  reaped under reason "lifetime_exceeded", with a Warning Event
                  (WorkerPodLifetimeExceeded). Jobs declaring a `timeout-minutes` above this will
                  be killed mid-run. Set to "0s" to disable. An activeDeadlineSeconds set
                  explicitly on the RunnerTemplate's podTemplate takes precedence. Must not be
                  negative. Defaults to "12h" when omitted.
                type: string
              maxWorkers:
                description: |-
                  MaxWorkers caps the number of worker pods this RunnerSet may run concurrently.
                  A soft, in-process ceiling; pair it with a namespace ResourceQuota for a hard,
                  cluster-enforced limit.
                format: int32
                minimum: 1
                type: integer
              pendingPodDeadline:
                description: |-
                  PendingPodDeadline is the maximum time a worker pod may remain Pending before
                  the AGC deletes it, releasing the concurrency-ceiling slot. Must be at least
                  1s. Defaults to "10m" when omitted.
                type: string
              priorityTiers:
                description: |-
                  PriorityTiers defines PriorityClass assignments and cumulative pod-count
                  thresholds. Tiers must be in strictly ascending threshold order.
                items:
                  description: |-
                    PriorityTier maps a Kubernetes PriorityClass to a cumulative pod-count
                    threshold. Thresholds must be in strictly ascending order. Unchanged in meaning
                    from v1alpha1; carried onto the RunnerSet (was RunnerGroup).
                  properties:
                    priorityClassName:
                      description: |-
                        PriorityClassName is the name of an existing cluster-scoped PriorityClass.
                        The platform owns which classes a tenant may reference: the GMC admission
                        path rejects any name not on the platform allowlist (--allowed-priority-classes),
                        so a tenant cannot name a high-priority, preempting class and evict other
                        tenants' worker pods. The named class — including its preemptionPolicy — is
                        platform-created; see docs/operations/security-operations.md.
                      maxLength: 253
                      minLength: 1
                      type: string
                    threshold:
                      description: Threshold is the cumulative active-pod count at
                        which this tier is exhausted.
                      format: int32
                      minimum: 1
                      type: integer
                  required:
                  - priorityClassName
                  - threshold
                  type: object
                maxItems: 10
                type: array
              proxyRef:
                description: |-
                  ProxyRef optionally names the EgressProxy this runner set's traffic egresses
                  through. Unset means inherit the gateway's defaultProxyRef; both unset means
                  direct egress (still NetworkPolicy-restricted to DNS + GitHub) — a well-defined
                  behavior, so the dependency is simply droppable, which is why proxyRef is
                  optional where templateRef is required (§H.4, §H.10). Direct egress is reflected
                  in status as proxyMode=Direct plus an advisory EgressUnattributed condition; a
                  proxyRef/defaultProxyRef that names a *missing* proxy still fails closed
                  (ProxyNotFound), not direct egress (Q168).
                properties:
                  name:
                    description: Name of the referenced EgressProxy. Bounded by the
                      v2 52-char name budget (§H.6).
                    maxLength: 52
                    minLength: 1
                    type: string
                  namespace:
                    description: |-
                      Namespace optionally selects an EgressProxy outside the referrer's own namespace.
                      Empty means the referrer's namespace.

                      A cross-namespace reference resolves only with provider consent: the named proxy
                      must list the referrer's namespace in its spec.sharing.allowedNamespaces.
                      Without that the reference fails closed with ProxyShareNotGranted, and no
                      NetworkPolicy or CA trust is wired. Naming a proxy never authorizes reaching it.

                      A shared proxy is a shared egress identity, so it suits cooperating tenants or a
                      platform-operated central pool rather than mutually-distrusting tenants.
                    maxLength: 63
                    type: string
                required:
                - name
                type: object
              quotaRetryDelay:
                description: |-
                  QuotaRetryDelay is the time to wait between pod creation retries when the
                  namespace ResourceQuota is exhausted. Must be at least 1s. Defaults to "30s"
                  when omitted.
                type: string
              runnerGroup:
                description: |-
                  RunnerGroup names the GitHub runner group this set's scale set is registered
                  into. This is GitHub's own grouping, not the deprecated v1alpha1 RunnerGroup
                  CR. Unset means inherit the gateway's defaultRunnerGroup; both unset means
                  GitHub's default group. It governs the scale-set registration, so it has no
                  effect on a Classic set, which registers no scale set.

                  The runner group is the GitHub-side authorization point for which repositories
                  may target these runners. A scale set left in the default group is reachable
                  by every repository that group admits, typically the whole organization, so a
                  repository outside the tenant can name this set in runs-on and route work into
                  its namespace, quota, and egress IP. Pod-level isolation is unaffected; what
                  the group bounds is who can cause a job to run here.

                  Resolved at runtime against GitHub, not at admission (§H.7), and fail-closed:
                  a name no runner group matches leaves the set Ready=False/
                  RunnerGroupNotFound rather than falling back to the default group, and a
                  scale set already registered in a different group is moved into this one.
                  The group's own repository access is configured at GitHub and is not managed
                  by GAG. See docs/operations/tenant-onboarding.md.
                maxLength: 255
                minLength: 1
                type: string
              runnerLabels:
                description: |-
                  RunnerLabels is the label set matched against workflow runs-on values. At
                  least one label is required: an empty set would silently match every workflow
                  run. Each label must be non-empty and contain no whitespace or commas (comma
                  is the runs-on list separator).

                  Both protocols match on the whole set, so a workflow may target a runner set
                  with a single name or with an array (runs-on: [linux, gpu]). On a ScaleSet set
                  the FIRST label is additionally the scale set's name at GitHub — its identity,
                  held unique per gateway by the GMC's admission webhook, and renamed if the list
                  is reordered (Q726). Classic sets have no scale-set object and no such
                  distinction.
                items:
                  maxLength: 256
                  pattern: ^[^,\s]+$
                  type: string
                minItems: 1
                type: array
              scaleUp:
                description: |-
                  ScaleUp optionally caps the RATE at which the AGC creates new worker pods for
                  this RunnerSet, smoothing cold-start stampedes on a shared, rate-sensitive
                  egress path (NAT/SNAT gateway, stateful-firewall conntrack table, site-to-site
                  VPN) when a burst of jobs is acquired at once. It is a token bucket over pod
                  CREATION and is distinct from maxWorkers (a ceiling on the concurrent pod
                  COUNT): the ceiling bounds how many run, this bounds how fast they start.
                  Omitted ⇒ no rate limit (the default): immediate provisioning, zero added
                  latency. An availability knob for the narrow stampede case; prefer a
                  peer-to-peer image mirror for image-pull storms and workflow-level
                  `concurrency:` or the maxWorkers ceiling for fairness/sustained load.
                properties:
                  burst:
                    description: |-
                      Burst is the maximum number of worker pods that may be created in an
                      instantaneous batch before the MaxPerSecond rate throttles subsequent
                      creations — the token-bucket depth. Defaults to MaxPerSecond when omitted.
                    format: int32
                    maximum: 100000
                    minimum: 1
                    type: integer
                  maxPerSecond:
                    description: |-
                      MaxPerSecond is the sustained rate, in worker pods created per second, once
                      the initial burst is spent. Required when scaleUp is set.
                    format: int32
                    maximum: 10000
                    minimum: 1
                    type: integer
                required:
                - maxPerSecond
                type: object
              sizing:
                description: |-
                  Sizing opts this runner set into measured worker sizing at pod-build time
                  (Q359 Phase 3): the AGC derives the worker containers' CPU/memory
                  requests/limits from the observed per-job usage history
                  (status.sizingRecommendation) — or, for the NodeShare profile, from a
                  declared per-node share — instead of the template's static values. Omitted
                  (or profile Static) keeps today's behavior: the template is authoritative.
                  Extended resources (GPUs) are never modified by any profile: they are
                  job-selected shape identity, and only the cpu/memory keys are ever derived.
                properties:
                  limitHeadroomPercent:
                    description: |-
                      LimitHeadroomPercent (Throughput only) scales the observed per-job memory
                      peak into the derived memory limit: limit = peak × percent / 100. Defaults
                      to 150 (the dogfood-validated OOM-headroom band, rounded up for the
                      burst-friendly profile). Memory only — no CPU limit is ever derived.
                    format: int32
                    maximum: 1000
                    minimum: 100
                    type: integer
                  maxRequests:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    description: ResourceList is a set of (resource name, quantity)
                      pairs.
                    type: object
                  minRequests:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    description: |-
                      MinRequests / MaxRequests clamp every derived cpu/memory request (and the
                      limits that track them) within an operator-set floor/ceiling, bounding how
                      far a skewed usage history can push the derived values. Keys other than
                      cpu and memory are ignored.
                    type: object
                  nodeShare:
                    description: |-
                      NodeShare declares the per-node envelope the NodeShare profile divides.
                      Required when (and only meaningful when) profile is NodeShare.
                    properties:
                      allocatable:
                        additionalProperties:
                          anyOf:
                          - type: integer
                          - type: string
                          pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                          x-kubernetes-int-or-string: true
                        description: |-
                          Allocatable is the node's allocatable cpu/memory to divide (from
                          `kubectl describe node`, minus any system/sidecar overhead the operator
                          reserves). Keys other than cpu and memory are ignored, so at least one of
                          the two must be present: an envelope carrying neither (empty, or GPUs
                          only) derives nothing while the profile still reports Active (Q484).
                          Declaring just one is legitimate — the other resource keeps the
                          template's ask.
                        type: object
                        x-kubernetes-validations:
                        - message: sizing.nodeShare.allocatable must declare cpu,
                            memory, or both; other resources are ignored
                          rule: '''cpu'' in self || ''memory'' in self'
                      workersPerNode:
                        description: |-
                          WorkersPerNode is the divisor: the number of worker pods that should pack
                          onto one node (for GPU nodes, typically the GPU count).
                        format: int32
                        maximum: 1000
                        minimum: 1
                        type: integer
                    required:
                    - allocatable
                    - workersPerNode
                    type: object
                  profile:
                    default: Static
                    description: Profile selects the sizing behavior; see the SizingProfile*
                      constants.
                    enum:
                    - Static
                    - Binpack
                    - Throughput
                    - NodeShare
                    type: string
                type: object
                x-kubernetes-validations:
                - message: the NodeShare profile requires sizing.nodeShare
                  rule: self.profile != 'NodeShare' || has(self.nodeShare)
                - message: sizing.nodeShare is only meaningful with profile NodeShare
                  rule: '!has(self.nodeShare) || self.profile == ''NodeShare'''
                - message: sizing.limitHeadroomPercent is only meaningful with profile
                    Throughput
                  rule: '!has(self.limitHeadroomPercent) || self.profile == ''Throughput'''
              templateRef:
                description: |-
                  TemplateRef optionally names the RunnerTemplate (default) or ClusterRunnerTemplate
                  (set kind: ClusterRunnerTemplate) that supplies the worker pod shape. Unset means
                  inherit the gateway's defaultTemplateRef; both unset means the single cluster-default
                  ClusterRunnerTemplate (the one marked IsDefaultTemplateAnnotation). If none of the
                  three resolves the set fails closed Ready=False/TemplateNotFound — the AGC never
                  synthesizes a phantom worker pod without a pod shape (Q172, §H.4). This relaxes the
                  GA-era required templateRef to optional-with-a-default (a backward-compatible
                  required→optional change): a set that sets templateRef behaves exactly as before.
                  The referent is resolved at runtime; a set pointing at a not-yet-applied template
                  sits Ready=False/TemplateNotFound until it syncs (§H.7). status.templateSource
                  reports which rung resolved.
                properties:
                  kind:
                    description: |-
                      Kind optionally selects the referent kind when more than one is valid. It is
                      load-bearing only on templateRef, where it chooses between RunnerTemplate
                      (the namespaced default) and ClusterRunnerTemplate (a platform golden
                      template). gatewayRef and proxyRef each have a single valid kind, so Kind is
                      left empty there.
                    enum:
                    - RunnerTemplate
                    - ClusterRunnerTemplate
                    type: string
                  name:
                    description: |-
                      Name of the referenced object. Bounded by the same 52-char budget every v2
                      object name carries (§H.6), so a well-formed ref can always name a valid object.
                    maxLength: 52
                    minLength: 1
                    type: string
                required:
                - name
                type: object
            required:
            - gatewayRef
            - runnerLabels
            type: object
            x-kubernetes-validations:
            - message: maxWorkers must equal the last priorityTiers threshold when
                both are set
              rule: '!has(self.maxWorkers) || !has(self.priorityTiers) || self.priorityTiers.size()
                == 0 || self.maxWorkers == self.priorityTiers[self.priorityTiers.size()-1].threshold'
            - message: evictionRetryDelay must be at least 1s
              rule: '!has(self.evictionRetryDelay) || duration(self.evictionRetryDelay)
                >= duration(''1s'')'
            - message: quotaRetryDelay must be at least 1s
              rule: '!has(self.quotaRetryDelay) || duration(self.quotaRetryDelay)
                >= duration(''1s'')'
            - message: completedPodTTL must not be negative
              rule: '!has(self.completedPodTTL) || duration(self.completedPodTTL)
                >= duration(''0s'')'
            - message: pendingPodDeadline must be at least 1s
              rule: '!has(self.pendingPodDeadline) || duration(self.pendingPodDeadline)
                >= duration(''1s'')'
            - message: maxWorkerLifetime must not be negative
              rule: '!has(self.maxWorkerLifetime) || duration(self.maxWorkerLifetime)
                >= duration(''0s'')'
          status:
            description: |-
              RunnerSetStatus is the observed state of a RunnerSet. It follows the uniform v2
              status/condition contract (§H.7): a listType=map Conditions slice keyed on type,
              an ObservedGeneration, and a Ready condition with the shared reason vocabulary
              (see conditions.go). Reference-resolution failures surface as Ready=False with a
              specific reason (TemplateNotFound / ProxyNotFound / …) and a message naming the
              missing object.
            properties:
              activeJobs:
                description: |-
                  ActiveJobs is the number of worker pods currently in the Running phase
                  (a job is actively executing). Derived from the worker pod phase count
                  during each reconcile; see also PendingJobs.
                format: int32
                type: integer
              activeSessions:
                description: ActiveSessions is the number of currently open long-poll
                  sessions.
                format: int32
                type: integer
              advertisedCapacity:
                description: |-
                  AdvertisedCapacity is the X-ScaleSetMaxCapacity this set most recently
                  advertised: the total jobs GitHub may keep assigned to it at once, recomputed
                  every long-poll from the admission ladder. Together with WithheldCapacity it
                  answers "why is intake throttled?" from `kubectl describe` alone: the same
                  accounting previously reachable only through Prometheus, which a tenant without
                  metrics access cannot read (Q721).

                  A pointer because zero is a meaningful advertisement (intake fully withheld) and
                  has to be distinguishable from "no advertisement": nil on a classic-tier set,
                  which decides per delivered job and never states a capacity, and on a scale-set
                  set whose listener has not polled yet.

                  Lags the live value by up to one reconcile, because the advertisement is
                  recomputed per poll and published per reconcile. It is an observation of intake,
                  never an input: setting it does not change what the listener advertises.
                format: int32
                type: integer
              conditions:
                description: |-
                  Conditions are the observed conditions of the runner set. Known types: Ready,
                  Degraded, EgressUnattributed, PossibleReapBlockingSidecar, WorkerQuotaPressure,
                  WorkerQuotaExceeded, WorkersUnschedulable, RateLimited, RunnerVersionTooOld,
                  SizingDrift.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: ObservedGeneration is the .metadata.generation the most
                  recent reconcile acted on.
                format: int64
                type: integer
              observedRunnerVersion:
                description: |-
                  ObservedRunnerVersion is the actions/runner version a worker pod of this set
                  reported actually running, read from the runner's own dependency manifest by the
                  injected wrapper and handed back on the pod's termination message (Q792). It
                  answers what the image ships for a reference the AGC cannot read a version from
                  at all: a digest-only or custom tag, which is the case
                  RunnerVersionTooOld reports as WorkerImageVersionUnknown.

                  It is a SELF-REPORT, not an attestation, and must not be read as a security
                  verdict. The runner container runs the tenant's image and the job's own steps
                  run inside it, so anything in that container can rewrite the report before the
                  container terminates. It is a diagnostic for an operator debugging their own
                  image, and it deliberately does NOT move the RunnerVersionTooOld condition,
                  which keeps saying Unknown rather than trusting a value the tenant controls.
                  Q988 is the attestable form, read from the registry before the container runs.

                  Sticky and newest-wins: the latest report seen from a terminal worker pod
                  survives that pod being reaped, because the answer is a property of the image
                  the set runs rather than of which pods happen to be retained. Empty until a
                  worker pod has terminated and reported, and on any image whose wrapper could not
                  detect a version, where absence is the honest answer.
                type: string
              pendingJobs:
                description: |-
                  PendingJobs is the number of worker pods currently in the Pending phase
                  (a job has been acquired and a pod spawned, but the pod is not yet
                  running — waiting on scheduling, image pull, or node readiness). Pods
                  that remain Pending past spec.pendingPodDeadline are deleted by the
                  controller; a sustained non-zero count warrants checking events and
                  scheduling constraints.
                format: int32
                type: integer
              proxyMode:
                description: |-
                  ProxyMode records how this runner set's worker egress reaches GitHub:
                  "Proxied" (through the resolved EgressProxy, with stable per-tenant egress IPs)
                  or "Direct" (no proxyRef/defaultProxyRef, still NetworkPolicy-restricted to
                  GitHub + DNS but without per-tenant IP attribution). Explicit so "no proxy" is
                  an auditable state, not an inferred absence (§H.10). Paired with the advisory
                  EgressUnattributed condition when Direct.
                enum:
                - Proxied
                - Direct
                type: string
              sizingProfileState:
                description: |-
                  SizingProfileState reports whether the opt-in sizing profile
                  (spec.sizing.profile) is actuating: "Active" — derived values are applied
                  at pod build; "AwaitingSamples" — a history-based profile (Binpack /
                  Throughput) is selected but not every template container has a confident
                  recommendation yet, so pods provision with the template's static values
                  until the history accumulates (whole-pod fallback, keeping QoS
                  predictable). Empty when no profile (or Static) is selected. Explicit so
                  "is the profile live yet" is auditable status, not something to infer from
                  pod specs (the proxyMode precedent).
                enum:
                - Active
                - AwaitingSamples
                type: string
              sizingRecommendation:
                description: |-
                  SizingRecommendation is the per-container worker resource recommendation
                  derived from measured per-job usage peaks (Q359 Phase 2), refreshed by the
                  AGC as jobs complete. Advisory only: nothing is applied to worker pods —
                  the operator (or a future opt-in sizing profile) acts on it. It doubles as
                  the persistence for the usage aggregates: the AGC re-seeds its in-memory
                  history from this field on restart, so the observation window survives
                  control-plane rollouts (status is the store; no separate backing store).
                items:
                  description: |-
                    ContainerSizingRecommendation is the measured-usage-derived resource
                    recommendation for one container of a runner set's worker pods (Q359 Phase 2).
                    Derivation follows the worker right-sizing model
                    (docs/operations/worker-rightsizing.md): requests from the p95 of per-job
                    usage peaks, a memory limit with OOM headroom above the observed maximum, and
                    deliberately no CPU limit (CPU is compressible — a limit only throttles bursty
                    jobs for no packing benefit).
                  properties:
                    container:
                      description: |-
                        Container is the container name in the worker pod template this
                        recommendation applies to.
                      type: string
                    limits:
                      additionalProperties:
                        anyOf:
                        - type: integer
                        - type: string
                        pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                        x-kubernetes-int-or-string: true
                      description: |-
                        Limits are the recommended resource limits. Memory only, at the observed
                        maximum peak plus OOM headroom; no CPU limit is ever recommended.
                      type: object
                    observedP95:
                      additionalProperties:
                        anyOf:
                        - type: integer
                        - type: string
                        pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                        x-kubernetes-int-or-string: true
                      description: |-
                        ObservedP95 is the 95th percentile of per-job usage peaks (cpu, memory),
                        bucket-interpolated — the input to the recommended requests.
                      type: object
                    observedPeak:
                      additionalProperties:
                        anyOf:
                        - type: integer
                        - type: string
                        pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                        x-kubernetes-int-or-string: true
                      description: |-
                        ObservedPeak is the highest per-job usage peak (cpu, memory) observed in
                        the window — the input to the recommended memory limit.
                      type: object
                    requests:
                      additionalProperties:
                        anyOf:
                        - type: integer
                        - type: string
                        pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                        x-kubernetes-int-or-string: true
                      description: |-
                        Requests are the recommended resource requests (cpu, memory), derived from
                        the p95 of observed per-job usage peaks and rounded up to coarse increments
                        (sizing is bucket-granular, not exact).
                      type: object
                    sampleCount:
                      description: |-
                        SampleCount is the number of finished jobs whose usage peaks fed this
                        recommendation — the operator's confidence signal. Jobs shorter than one
                        sampling interval are not counted (see the worker usage metrics).
                      format: int64
                      type: integer
                    windowStartTime:
                      description: |-
                        WindowStartTime is when this container's observation window began (first
                        sampled job, surviving AGC restarts via the re-seed).
                      format: date-time
                      type: string
                  required:
                  - container
                  - sampleCount
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - container
                x-kubernetes-list-type: map
              templateSource:
                description: |-
                  TemplateSource records which rung of the template-resolution chain supplied this
                  runner set's worker pod shape (Q172, §H.4): "TemplateRef" (its own spec.templateRef),
                  "GatewayDefault" (the gateway's spec.defaultTemplateRef, inherited because templateRef
                  was unset), or "ClusterDefault" (the single cluster-default ClusterRunnerTemplate,
                  resolved because neither was set). Explicit so an operator can audit whether a set
                  runs on an explicit template or a default without inspecting the gateway and cluster
                  state. Empty until the references resolve.
                enum:
                - TemplateRef
                - GatewayDefault
                - ClusterDefault
                type: string
              withheldCapacity:
                description: |-
                  WithheldCapacity attributes the gap between the declared worker ceiling and
                  AdvertisedCapacity to the rung of the admission ladder that took each slot, so a
                  tenant can tell "my own maxWorkers" from "the namespace ResourceQuota" from "the
                  cluster cannot place my workers" without reading metrics or the AGC's logs
                  (Q721). Every rung the poll evaluated appears, including the ones withholding
                  nothing, so a reason absent from the list was not evaluated rather than not
                  binding. That is the same explicit-zero contract the withheld gauge carries.

                  Empty on a classic-tier set and before the first poll, alongside a nil
                  AdvertisedCapacity.
                items:
                  description: |-
                    WithheldCapacity is one admission-ladder rung's contribution to the gap between a
                    runner set's declared worker ceiling and the capacity it advertises (Q721). The
                    entries sum to ceiling - advertisedCapacity, because the rungs compose as a min()
                    and each entry is its own marginal contribution.
                  properties:
                    reason:
                      description: |-
                        Reason names the rung, matching the `reason` label on
                        actions_gateway_scaleset_capacity_withheld so the status view and the metric
                        read the same vocabulary: "quota" is namespace-ResourceQuota headroom,
                        "capacity" the opt-in placeability gate, "scaleup" the opt-in creation-rate
                        limit.

                        Deliberately not an enum. The ladder is designed to grow a rung at a time, and
                        every rung must land in both acquisition tiers at once, so a closed enum would
                        couple each new rung to a CRD change for no validation benefit: this field is
                        controller-written status that a tenant cannot author.
                      type: string
                    slots:
                      description: |-
                        Slots is the number of worker slots this rung removed from the advertisement.
                        Zero means the rung was evaluated and did not bind, which is a different
                        statement from the reason being absent.
                      format: int32
                      type: integer
                  required:
                  - reason
                  - slots
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - reason
                x-kubernetes-list-type: map
            type: object
        type: object
        x-kubernetes-validations:
        - message: 'metadata.name must be at most 52 characters: v2 derives child
            resource names as <name>-<suffix> and reserves the remainder of the 63-char
            label/Service-name budget'
          rule: self.metadata.name.size() <= 52
    selectableFields:
    - jsonPath: .spec.gatewayRef.name
    served: true
    storage: false
    subresources:
      status: {}
  - additionalPrinterColumns:
    - jsonPath: .spec.gatewayRef.name
      name: Gateway
      type: string
    - jsonPath: .status.activeSessions
      name: ActiveSessions
      type: integer
    - jsonPath: .status.activeJobs
      name: ActiveJobs
      type: integer
    - jsonPath: .status.pendingJobs
      name: PendingJobs
      type: integer
    - jsonPath: .status.proxyMode
      name: Egress
      type: string
    - jsonPath: .status.templateSource
      name: Template
      priority: 1
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].reason
      name: Reason
      priority: 1
      type: string
    - jsonPath: .status.observedGeneration
