# Sentence-per-line (semantic line breaks) for every tracked Markdown file.
# One changed sentence is one changed line, so prose diffs stay reviewable and
# concurrent branches stop colliding on rewrapped paragraphs.
#
# max-width: 0 keeps sentence mode unbounded. A width here would enable the
# clause-level splitting that mdreflow's own render-preservation bug lives in
# (jbeda/mdreflow#5), so leave it at 0.
mode: sentence
max-width: 0

# Our docs are MkDocs-flavoured, so a `!!! note` callout's indented body is
# prose rather than the code block CommonMark reads it as. Off by default
# upstream, because reflowing it changes what a plain CommonMark renderer
# emits; here the published site is the renderer that matters, and its
# output is unchanged apart from source whitespace.
dialect: mkdocs

exclude:
  # Generated — a reflow here is reverted by the next `make api-reference` /
  # `make compat-report`.
  - "docs/reference/api.md"
  - "docs/development/broker-compatibility.md"
  # Table-shaped and high-contention, with its own git merge driver
  # (scripts/docs/git-merge-status.sh). Reflow buys nothing and risks the driver.
  - "docs/STATUS.md"
  # Backlog item pages (Q869). Each body is one Queue Notes cell, and a cell is
  # one line by construction — reflowing it to sentence-per-line would stop the
  # item rendering back into the table at all. The contention this gate exists
  # to reduce is already gone here: one item, one file.
  - "docs/queue/*.md"
  # Symlink to CLAUDE.md; formatting it walks the same bytes twice.
  - "AGENTS.md"
